# Ежедневный бэкап базы.
#
# Зачем. Supabase на бесплатном тарифе бэкапы НЕ делает. До этого файла любая
# порча данных была необратимой: слова учеников, сданные работы, программы
# обучения. Один неудачный запрос — и возвращать нечего.
#
# Дамп шифруется ПЕРЕД загрузкой: артефакт лежит в чужом облаке, а внутри
# персональные данные учеников. Пароль знает только владелец.
#
# ⚠️ ПАДЕНИЕ ОБЪЯСНЯЕТ СЕБЯ САМО. Прогон #4 упал за 21 секунду с кодом 1, и
# единственным способом узнать причину было открыть логи Actions — а владелец
# видит только красный значок в почте. Поэтому: причина, которую можно поймать
# заранее, ловится ДО дампа, а если pg_dump всё-таки упал — его stderr едет в
# сводку прогона вместе с расшифровкой (.github/scripts/backup-explain.mjs,
# у него есть локальный тест `node scripts/test-backup-explain.mjs`).
# Секреты в сводку не попадают: GitHub маскирует их в логах, но не в сводке.
#
# Секреты (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL   — строка подключения. ⚠️ ОБЯЗАТЕЛЬНО «Session pooler»
#                       (порт 5432), а НЕ «Direct connection» и НЕ «Transaction
#                       pooler» (6543). Прямой хост Supabase отвечает только по
#                       IPv6, которого у раннеров GitHub нет; транзакционный пул
#                       рвёт сессию между запросами, а pg_dump держит её целиком.
#                       Нужный адрес: Supabase → Connect → Session pooler
#                       (хост вида ...pooler.supabase.com, порт 5432).
#   BACKUP_PASSPHRASE — пароль шифрования. Потеряете его — дамп бесполезен.
name: Бэкап базы

on:
  schedule:
    # 03:00 UTC = 09:00 в Алматы: если что-то пойдёт не так, владелец увидит
    # это утром, а не ночью
    - cron: '0 3 * * *'
  workflow_dispatch: # можно запустить руками перед рискованной миграцией

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      # Скрипты предпроверки и разбора ошибок лежат в репозитории, поэтому
      # без checkout шаги не найдут их и упадут на ровном месте.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Всё, что можно поймать ДО дампа, ловится здесь: пропущенные секреты и
      # три способа испортить строку подключения на одном экране Supabase
      # (Direct connection, транзакционный пул 6543, логин без кода проекта).
      # Разбор строки живёт в скрипте, а не в этом YAML: YAML нельзя прогнать
      # локально, а у скрипта есть тест — node scripts/test-backup-precheck.mjs.
      - name: Проверить секреты и строку подключения
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if ! node .github/scripts/backup-precheck.mjs >> "$GITHUB_STEP_SUMMARY"; then
            echo "::error::Предпроверка бэкапа не прошла — причина в сводке прогона"
            exit 1
          fi

      - name: Снять дамп и зашифровать
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -uo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          # pg_dump берём ОБРАЗОМ, а не из apt: версия клиента должна быть не
          # ниже серверной, и подключать репозиторий PostgreSQL на каждом
          # прогоне — лишняя точка отказа (ключи, зеркала, смена релиза Ubuntu).
          # Образ даёт ровно ту версию, которую мы назвали.
          #
          # stderr pg_dump уходит в файл, а не в никуда: именно там лежит
          # единственное внятное объяснение падения, и без него сводка прогона
          # сообщала бы «код 1» — ровно то, ради чего пришлось бы лезть в логи.
          # errexit на время конвейера снят, чтобы успеть прочитать PIPESTATUS.
          set +e
          docker run --rm -i -e PGCONNECT_TIMEOUT=15 postgres:17 \
            pg_dump "$DB_URL" --no-owner --no-acl --clean --if-exists 2> pg_dump.err \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase "$PASSPHRASE" \
                  -o "recall-$STAMP.sql.gz.gpg"
          codes=("${PIPESTATUS[@]}")
          set -e
          dump_code=${codes[0]:-0}; gzip_code=${codes[1]:-0}; gpg_code=${codes[2]:-0}
          if [ "$dump_code" != "0" ] || [ "$gzip_code" != "0" ] || [ "$gpg_code" != "0" ]; then
            if [ "$dump_code" != "0" ]; then stage=dump; code=$dump_code
            elif [ "$gzip_code" != "0" ]; then stage=gzip; code=$gzip_code
            else stage=gpg; code=$gpg_code; fi
            echo "::error::Бэкап упал на этапе $stage (код $code) — расшифровка в сводке прогона"
            node .github/scripts/backup-explain.mjs pg_dump.err "$code" "$stage" >> "$GITHUB_STEP_SUMMARY"
            # сам stderr — в лог шага целиком; секреты там маскирует GitHub
            echo "--- pg_dump stderr ---"; cat pg_dump.err || true
            exit 1
          fi
          ls -lh recall-*.sql.gz.gpg
          # пустой дамп — тоже авария, лучше упасть громко. Такое бывает, когда
          # pg_dump достучался, но не увидел данных (нет прав на схему): код
          # возврата нулевой, а бэкапа нет — молчаливая потеря, самая дорогая.
          SIZE=$(stat -c%s "recall-$STAMP.sql.gz.gpg")
          if [ "$SIZE" -lt 10240 ]; then
            echo "::error::Дамп подозрительно мал ($SIZE байт) — проверьте подключение и права"
            node .github/scripts/backup-explain.mjs pg_dump.err "$SIZE" size >> "$GITHUB_STEP_SUMMARY"
            echo "--- pg_dump stderr ---"; cat pg_dump.err || true
            exit 1
          fi
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "✅ Бэкап снят: \`recall-$STAMP.sql.gz.gpg\`, $(numfmt --to=iec "$SIZE")" >> "$GITHUB_STEP_SUMMARY"
          # Дамп 1-го числа держим дольше: порчу, замеченную через месяц,
          # двухнедельными копиями уже не откатить.
          if [ "$(date -u +%d)" = "01" ]; then
            echo "KEEP=90" >> "$GITHUB_ENV"
          else
            echo "KEEP=14" >> "$GITHUB_ENV"
          fi

      - name: Сохранить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: recall-backup-${{ env.STAMP }}
          path: recall-*.sql.gz.gpg
          retention-days: ${{ env.KEEP }}
          if-no-files-found: error
