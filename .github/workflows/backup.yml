# Ежедневный бэкап базы.
#
# Зачем. Supabase на бесплатном тарифе бэкапы НЕ делает. До этого файла любая
# порча данных была необратимой: слова учеников, сданные работы, программы
# обучения. Один неудачный запрос — и возвращать нечего.
#
# Дамп шифруется ПЕРЕД загрузкой: артефакт лежит в чужом облаке, а внутри
# персональные данные учеников. Пароль знает только владелец.
#
# Секреты (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL   — строка подключения. ⚠️ ОБЯЗАТЕЛЬНО «Session pooler»,
#                       а НЕ «Direct connection»: прямой хост Supabase отвечает
#                       только по IPv6, а у раннеров GitHub его нет — соединение
#                       падает за секунды. Нужный адрес в Supabase → Connect →
#                       Session pooler (хост вида ...pooler.supabase.com).
#   BACKUP_PASSPHRASE — пароль шифрования. Потеряете его — дамп бесполезен.
name: Бэкап базы

on:
  schedule:
    # 03:00 UTC = 09:00 в Алматы: если что-то пойдёт не так, владелец увидит
    # это утром, а не ночью
    - cron: '0 3 * * *'
  workflow_dispatch: # можно запустить руками перед рискованной миграцией

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить секреты
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          fail=0
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::Нет секрета SUPABASE_DB_URL"
            echo "❌ Не задан секрет **SUPABASE_DB_URL**" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          fi
          if [ -z "${PASSPHRASE:-}" ]; then
            echo "::error::Нет секрета BACKUP_PASSPHRASE"
            echo "❌ Не задан секрет **BACKUP_PASSPHRASE**" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          fi
          # Самая частая причина падения: взяли «Direct connection». Он живёт
          # только на IPv6, которого у раннера нет, и дамп умирает за секунды с
          # невнятным «could not translate host name». Проверяем ДО дампа и
          # пишем в сводку прогона — чтобы причина была видна без чтения логов.
          if [ "$fail" = "0" ] && ! printf '%s' "$DB_URL" | grep -q 'pooler\.supabase\.com'; then
            echo "::error::SUPABASE_DB_URL похож на Direct connection (IPv6). Нужен Session pooler."
            {
              echo "❌ **SUPABASE_DB_URL указывает не на пул соединений.**"
              echo ""
              echo "У раннеров GitHub нет IPv6, а прямой хост Supabase доступен только по нему."
              echo "Возьмите строку из Supabase → **Connect → Session pooler**"
              echo "(хост вида \`...pooler.supabase.com\`) и обновите секрет."
            } >> "$GITHUB_STEP_SUMMARY"
            fail=1
          fi
          exit $fail

      - name: Снять дамп и зашифровать
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          # pg_dump берём ОБРАЗОМ, а не из apt: версия клиента должна быть не
          # ниже серверной, и подключать репозиторий PostgreSQL на каждом
          # прогоне — лишняя точка отказа (ключи, зеркала, смена релиза Ubuntu).
          # Образ даёт ровно ту версию, которую мы назвали.
          docker run --rm -i -e PGCONNECT_TIMEOUT=15 postgres:17 \
            pg_dump "$DB_URL" --no-owner --no-acl --clean --if-exists \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase "$PASSPHRASE" \
                  -o "recall-$STAMP.sql.gz.gpg"
          ls -lh recall-*.sql.gz.gpg
          # пустой дамп — тоже авария, лучше упасть громко
          SIZE=$(stat -c%s "recall-$STAMP.sql.gz.gpg")
          if [ "$SIZE" -lt 10240 ]; then
            echo "::error::Дамп подозрительно мал ($SIZE байт) — проверьте подключение"
            echo "❌ Дамп всего $SIZE байт — похоже, подключение не удалось" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "✅ Бэкап снят: \`recall-$STAMP.sql.gz.gpg\`, $(numfmt --to=iec "$SIZE")" >> "$GITHUB_STEP_SUMMARY"
          # Дамп 1-го числа держим дольше: порчу, замеченную через месяц,
          # двухнедельными копиями уже не откатить.
          if [ "$(date -u +%d)" = "01" ]; then
            echo "KEEP=90" >> "$GITHUB_ENV"
          else
            echo "KEEP=14" >> "$GITHUB_ENV"
          fi

      - name: Сохранить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: recall-backup-${{ env.STAMP }}
          path: recall-*.sql.gz.gpg
          retention-days: ${{ env.KEEP }}
          if-no-files-found: error
