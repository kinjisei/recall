# Проверки на каждый пуш в любую ветку и на каждый pull request.
#
# Зачем. Смоуки и юнит-тесты в проекте есть, но запускались руками — то есть
# ловили регрессию только пока о них помнят. Достаточно одной сессии, где
# «сборка прошла, значит нормально», чтобы сломанное уехало в прод.
#
# Здесь только то, чему НЕ нужны ни база, ни браузер, ни секреты: типы, сборка,
# сторожа, чистые тесты логики и валидаторы данных. Браузерные смоуки
# (навигация, офлайн, фичи) требуют dev-сервера и service_role — их по-прежнему
# гоняем локально, а прод стережёт отдельный сторож (canary.yml).
#
# Ветки проверяются тоже, а не только main: переезд разделов идёт на ветках с
# превью-ссылками (архитектура §12), и красное должно быть видно до слияния.
name: Проверки

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # сторожу описаний нужна история: он проверяет каждый коммит пуша
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Шаги ниже идут и после красного соседа (!cancelled): полезнее увидеть
      # сразу все сломанные места, чем чинить их по одному.
      - name: Типы и сборка
        run: npm run build

      # Vercel собирает функции api/ по КОРНЕВОМУ tsconfig, а не по нашему
      # строгому — и падал там, где локальная сборка была зелёной.
      - name: Функции api так, как их собирает Vercel
        if: ${{ !cancelled() }}
        run: node scripts/check-api-vercel.mjs

      # Линтер, границы, токены, размер, план, описания — scripts/checks/README.md.
      # Описания проверяются для каждого коммита этого пуша (или pull request).
      - name: Сторожа
        if: ${{ !cancelled() }}
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            export CHECK_RANGE="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            export CHECK_RANGE="$BEFORE..HEAD"
          else
            # новая ветка, ручной запуск или переписанная история
            export CHECK_RANGE="origin/main..HEAD"
          fi
          echo "Описания проверяются для коммитов $CHECK_RANGE"
          npm run check

      # Все scripts/test-*.mjs — по шаблону имени, новый тест подхватится сам.
      - name: Чистые тесты логики
        if: ${{ !cancelled() }}
        run: npm test

      - name: Валидаторы данных и схемы
        if: ${{ !cancelled() }}
        run: |
          set +e
          fail=0
          node scripts/validate-exercises.mjs || { echo "::error::упражнения"; fail=1; }
          node scripts/check-schema.mjs      || { echo "::error::схема"; fail=1; }
          exit $fail
