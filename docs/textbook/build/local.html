  pick(){
    const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
    this.voice = vs.find(v => /google/i.test(v.name)) || vs.find(v => /milena|katya|premium|enhanced/i.test(v.name)) || vs[0] || null;
  },
  build(){
    this.q = []; this.i = 0;
    document.querySelectorAll('article p, article li, article h1, article h2, article h3').forEach(el => {
      const txt = el.textContent.trim();
      if (!txt) return;
      const parts = txt.match(/[^.!?…]+[.!?…]+["»”)\]]*\s*|[^.!?…]+$/g) || [txt];
      parts.forEach(s => { s = s.trim(); if (s) this.q.push({ el, s }); });
    });
  },
  speak(){
    const mySeq = ++this.seq;
    speechSynthesis.cancel();
    const item = this.q[this.i];
    if (!item) { this.stop(); return; }
    this.mark(item.el);
    const u = new SpeechSynthesisUtterance(item.s);
    u.lang = 'ru-RU';
    if (this.voice) u.voice = this.voice;
    u.rate = this.rate;
    u.onend = () => {
      if (!this.on || mySeq !== this.seq) return;
      if (this.i < this.q.length - 1) { this.i++; this.speak(); }
      else this.stop();
    };
    speechSynthesis.speak(u);
  },
  mark(el){
    document.querySelectorAll('.reading').forEach(e => e.classList.remove('reading'));
    if (el) { el.classList.add('reading'); el.scrollIntoView({ block: 'center', behavior: smooth() }); }
  },
  toggle(){
    if (this.on) { this.on = false; this.seq++; speechSynthesis.cancel(); }
    else {
      if (!this.q.length) this.build();
      this.on = true; this.speak();
    }
    this.ui();
  },
  step(d){
    this.i = Math.max(0, Math.min(this.q.length - 1, this.i + d));
    if (this.on) this.speak(); else this.mark(this.q[this.i] && this.q[this.i].el);
    this.ui();
  },
  cycle(){
    const R = [0.5, 0.75, 1, 1.25, 1.5, 2];
    this.rate = R[(R.indexOf(this.rate) + 1) % R.length] || 1;
    LS.set('rate', this.rate);
    if (this.on) this.speak();
    this.ui();
  },
  stop(){
    this.on = false; this.seq++; speechSynthesis.cancel();
    this.mark(null); this.q = []; this.i = 0;
    const p = $('#player'); if (p) p.remove();
  },
  open(){
    if ($('#player')) { this.toggle(); return; }
    this.build();
    const bar = document.createElement('div');
    bar.id = 'player'; bar.className = 'player';
    bar.innerHTML = '<div class="in">' +
      '<button class="pbtn" id="pPrev" aria-label="Назад на предложение">' + SVG.prev + '</button>' +
      '<button class="pbtn main" id="pPlay" aria-label="Пауза">' + SVG.pause + '</button>' +
      '<button class="pbtn" id="pNext" aria-label="Вперёд на предложение">' + SVG.next + '</button>' +
      '<button class="pbtn rate" id="pRate" aria-label="Скорость озвучки"></button>' +
      '<span class="pspacer">Экран не выключай — озвучка прервётся</span>' +
      '<button class="pbtn" id="pStop" aria-label="Закрыть плеер">' + SVG.x + '</button></div>';
    document.body.appendChild(bar);
    $('#pPlay').onclick = () => this.toggle();
    $('#pPrev').onclick = () => this.step(-1);
    $('#pNext').onclick = () => this.step(1);
    $('#pRate').onclick = () => this.cycle();
    $('#pStop').onclick = () => this.stop();
    this.on = true; this.speak(); this.ui();
  },
  ui(){
    const b = $('#pPlay'); if (!b) return;
    b.innerHTML = this.on ? SVG.pause : SVG.play;
    b.setAttribute('aria-label', this.on ? 'Пауза' : 'Продолжить');
    $('#pRate').textContent = String(this.rate).replace('.', ',') + '×';
  }
} : null;
if (TTS) {
  TTS.pick();
  if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = () => TTS.pick();
}

/* ---------- глоссарий ---------- */
function openTerm(id){
  const g = GLOSS.find(x => x.id === id);
  if (!g) return;
  closeSheet();
  const w = document.createElement('div');
  w.className = 'sheetwrap'; w.id = 'sheet';
  w.innerHTML = '<div class="backdrop"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Глоссарий: ' + esc(g.term) + '">' +
    '<div class="gl">Глоссарий</div><h3>' + esc(g.term) + '</h3><p>' + esc(g.def) + '</p>' +
    '<button class="x" aria-label="Закрыть">' + SVG.x + '</button></div>';
  document.body.appendChild(w);
  w.querySelector('.backdrop').onclick = closeSheet;
  w.querySelector('.x').onclick = closeSheet;
}
function closeSheet(){ const s = $('#sheet'); if (s) s.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- закладка и прогресс ---------- */
let curId = null, saveT = 0;
window.addEventListener('scroll', () => {
  if (!curId) return;
  const now = Date.now();
  if (now - saveT > 400) {
    saveT = now;
    LS.set('pos', { ch: curId, y: Math.round(scrollY) });
  }
  const h = document.documentElement;
  if (h.scrollHeight - scrollY - innerHeight < h.clientHeight * 0.08) {
    const done = LS.get('done', {});
    if (!done[curId]) { done[curId] = 1; LS.set('done', done); }
  }
}, { passive: true });

/* ---------- рендер ---------- */
function bindTerms(){
  document.querySelectorAll('.term').forEach(b => b.onclick = () => openTerm(b.dataset.t));
}
function renderHome(){
  if (TTS) TTS.stop();
  curId = null;
  document.title = 'Строитель А+Б';
  const done = LS.get('done', {});
  const pos = LS.get('pos', null);
  const ready = CH.filter(c => c.html);
  const readDone = ready.filter(c => done[c.id]).length;
  let h = '<div class="wrap"><header class="cover">' +
    '<div class="kicker">Учебник · на примере Recall</div>' +
    '<h1>Строитель А+Б</h1>' +
    '<p class="sub">Как делать с помощью ИИ продукты, в которых хочется жить: от идеи до денег и постоянных клиентов.</p>' +
    '<div class="progress"><div class="bar"><i style="width:' + Math.round(100 * ready.length / CH.length) + '%"></i></div>' +
    '<div class="cap">Опубликовано глав: ' + ready.length + ' из ' + CH.length + ' · прочитано: ' + readDone + '</div></div>';
  if (pos && CH.some(c => c.id === pos.ch && c.html)) {
    const c = CH.find(x => x.id === pos.ch);
    h += '<button class="continue" id="cont"><span class="ico">' + SVG.book + '</span>' +
      '<span><b>Продолжить чтение</b><span>Глава ' + c.n + ' · ' + esc(c.title) + '</span></span></button>';
  }
  h += '</header><nav aria-label="Оглавление">';
  let lastPart = '';
  CH.forEach(c => {
    if (c.part !== lastPart) {
      lastPart = c.part;
      h += '<div class="part"><span class="rn">' + c.part + '</span><h2>' + esc(PARTS[c.part]) + '</h2></div>';
    }
    if (c.html) {
      h += '<button class="chrow" data-ch="' + c.id + '"><span class="num">' + c.n + '</span>' +
        '<span class="t">' + esc(c.title) + '</span>' +
        '<span class="st' + (done[c.id] ? ' done">✓ прочитана' : '">читать') + '</span></button>';
    } else {
      h += '<div class="chrow soon"><span class="num">' + c.n + '</span><span class="t">' + esc(c.title) + '</span><span class="st">скоро</span></div>';
    }
  });
  h += '</nav><div class="foot">Закладка, прогресс и скорость озвучки хранятся в этом браузере. Термины с пунктиром — тап открывает объяснение.</div></div>';
  app.innerHTML = h;
  const cont = $('#cont');
  if (cont) cont.onclick = () => { location.hash = '#/' + pos.ch; };
  document.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { location.hash = '#/' + b.dataset.ch; });
  scrollTo(0, 0);
}
function renderChapter(id){
  const c = CH.find(x => x.id === id && x.html);
  if (!c) { location.hash = ''; return; }
  if (TTS) TTS.stop();
  curId = id;
  document.title = 'Гл. ' + c.n + ' — ' + c.title;
  const idx = CH.indexOf(c);
  const prev = CH.slice(0, idx).reverse().find(x => x.html);
  const next = CH.slice(idx + 1).find(x => x.html);
  let h = '<div class="topbar"><div class="in">' +
    '<button class="tbtn" id="back" aria-label="К оглавлению">' + SVG.back + '</button>' +
    '<div class="title">Глава ' + c.n + ' · ' + esc(PARTS[c.part]) + '</div>' +
    (TTS ? '<button class="tbtn" id="listen">' + SVG.speak + ' Слушать</button>' : '') +
    '</div></div><div class="wrap"><article>' +
    '<div class="chnum">Глава ' + c.n + '</div>' + c.html;
  h += '<div class="chnav">';
  h += prev
    ? '<button data-ch="' + prev.id + '"><span class="lbl">← Назад</span><span class="nm">' + esc(prev.title) + '</span></button>'
    : '<button data-home="1"><span class="lbl">←</span><span class="nm">Оглавление</span></button>';
  if (next) h += '<button class="nx" data-ch="' + next.id + '"><span class="lbl">Дальше →</span><span class="nm">' + esc(next.title) + '</span></button>';
  h += '</div></article></div>';
  app.innerHTML = h;
  $('#back').onclick = () => { location.hash = ''; };
  const li = $('#listen'); if (li) li.onclick = () => TTS.open();
  document.querySelectorAll('.chnav [data-ch]').forEach(b => b.onclick = () => { location.hash = '#/' + b.dataset.ch; });
  const hm = document.querySelector('.chnav [data-home]'); if (hm) hm.onclick = () => { location.hash = ''; };
  bindTerms();
  const pos = LS.get('pos', null);
  requestAnimationFrame(() => scrollTo(0, (pos && pos.ch === id) ? pos.y : 0));
}
function route(){
  closeSheet();
  const m = location.hash.match(/^#\/(.+)$/);
  if (m) renderChapter(m[1]); else renderHome();
}
window.addEventListener('hashchange', route);
route();
</script>
