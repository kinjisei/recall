:root{
  --bg:#F6F5FA;--surface:#FFFFFF;--soft:#EDECF5;--ink:#232438;--mut:#565870;
  --faint:#8B8CA3;--line:#E2E1EE;--accent:#5F4FD8;--on-accent:#FFFFFF;
  --good:#177A52;--warn:#9A6210;--shadow:0 10px 30px rgba(35,36,56,.10);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161826;--surface:#1E2030;--soft:#252740;--ink:#ECEAF6;--mut:#A9A8C0;
  --faint:#6E6F8A;--line:#2B2D42;--accent:#9184D9;--on-accent:#14151F;
  --good:#63C89B;--warn:#D9A662;--shadow:0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#161826;--surface:#1E2030;--soft:#252740;--ink:#ECEAF6;--mut:#A9A8C0;
  --faint:#6E6F8A;--line:#2B2D42;--accent:#9184D9;--on-accent:#14151F;
  --good:#63C89B;--warn:#D9A662;--shadow:0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#F6F5FA;--surface:#FFFFFF;--soft:#EDECF5;--ink:#232438;--mut:#565870;
  --faint:#8B8CA3;--line:#E2E1EE;--accent:#5F4FD8;--on-accent:#FFFFFF;
  --good:#177A52;--warn:#9A6210;--shadow:0 10px 30px rgba(35,36,56,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Onest V',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:44rem;margin:0 auto;padding:0 20px}

/* ---------- обложка / оглавление ---------- */
.cover{padding:56px 0 28px}
.cover .kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.cover h1{font-size:clamp(2rem,7vw,2.9rem);font-weight:800;letter-spacing:-.02em;margin:.35rem 0 .6rem;text-wrap:balance}
.cover p.sub{font-family:Georgia,'Times New Roman',serif;font-style:italic;color:var(--mut);font-size:1.05rem;margin:0;max-width:34rem}
.progress{margin:26px 0 8px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .4s ease}
.progress .cap{font-size:.85rem;color:var(--mut);margin-top:8px;font-variant-numeric:tabular-nums}
.continue{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--accent);color:var(--on-accent);border-radius:16px;padding:16px 18px;margin:18px 0 6px;box-shadow:var(--shadow)}
.continue .ico{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--on-accent) 18%,transparent)}
.continue b{display:block;font-size:.95rem}
.continue span{display:block;font-size:.8rem;opacity:.85;margin-top:2px}
.part{margin:34px 0 6px;display:flex;align-items:baseline;gap:12px}
.part .rn{font-family:Georgia,serif;font-style:italic;color:var(--accent);font-size:1.05rem;min-width:1.6rem}
.part h2{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:650;margin:0}
.part::after{content:'';flex:1;height:1px;background:var(--line);transform:translateY(-4px)}
.chrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 10px;min-height:48px;border-radius:12px}
.chrow:not(.soon):hover{background:var(--soft)}
.chrow .num{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;min-width:2.1rem;font-size:.95rem}
.chrow .t{flex:1;font-size:.98rem}
.chrow .st{font-size:.78rem;color:var(--faint)}
.chrow .st.done{color:var(--good);font-weight:600}
.chrow.soon{cursor:default}
.chrow.soon .t,.chrow.soon .num{color:var(--faint)}
.foot{margin:44px 0 40px;color:var(--faint);font-size:.8rem;border-top:1px solid var(--line);padding-top:16px}

/* ---------- глава ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{display:flex;align-items:center;gap:8px;max-width:44rem;margin:0 auto;padding:8px 12px}
.tbtn{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:12px;color:var(--mut);gap:6px;padding:0 10px;font-size:.88rem;font-weight:600}
.tbtn:hover{background:var(--soft);color:var(--ink)}
.topbar .title{flex:1;text-align:center;font-size:.85rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
article{padding:30px 0 90px}
article .chnum{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:650}
article h1{font-size:clamp(1.65rem,5.5vw,2.2rem);font-weight:800;letter-spacing:-.015em;line-height:1.2;margin:.4rem 0 1.4rem;text-wrap:balance}
article h2{font-size:1.28rem;font-weight:750;letter-spacing:-.01em;margin:2.2em 0 .6em;text-wrap:balance}
article h3{font-size:1.05rem;font-weight:700;margin:1.8em 0 .5em}
article p,article li{font-family:Georgia,'Times New Roman',serif;font-size:1.06rem;line-height:1.75;color:var(--ink)}
article p{margin:0 0 1.05em}
article ul,article ol{padding-left:1.4em;margin:0 0 1.1em}
article li{margin-bottom:.45em}
article strong{font-weight:700}
article code{font-family:ui-monospace,Consolas,monospace;font-size:.88em;background:var(--soft);padding:.12em .4em;border-radius:6px}
article hr{border:0;height:1px;background:var(--line);margin:2em 0}
.tablewrap{overflow-x:auto;margin:0 0 1.2em;border:1px solid var(--line);border-radius:12px}
article table{border-collapse:collapse;width:100%;font-family:'Onest V',system-ui,sans-serif;font-size:.92rem}
article th,article td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
article th{background:var(--soft);font-weight:650;white-space:nowrap;font-size:.82rem;letter-spacing:.02em}
article tbody tr:last-child td{border-bottom:0}
article td p,article td li{font-family:inherit;font-size:inherit}
.callout{border-radius:14px;padding:14px 16px;margin:0 0 1.1em;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent)}
.callout p{margin:0 0 .7em;font-size:1.01rem}
.callout p:last-child{margin:0}
.callout.c-good{border-left-color:var(--good)}
.callout.c-warn{border-left-color:var(--warn)}
.term{font-family:inherit;font-size:inherit;line-height:inherit;text-align:left;color:var(--accent);border-bottom:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);padding-bottom:1px}
.reading{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:6px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
.chnav{display:flex;gap:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:20px}
.chnav button{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;text-align:left;min-height:56px}
.chnav button:hover{border-color:var(--accent)}

<script>
"use strict";
const PAYLOAD = {"parts":{"I":"До стройки","II":"Стройка","III":"Сдача и эксплуатация","IV":"Дом продаётся","V":"Инструмент"},"chapters":[{"n":"1","id":"01","part":"I","title":"Насмотренность: где брать вкус и идеи","html":"\u003ch1>Насмотренность: где брать вкус и идеи\u003c/h1>\n\u003ch2>Зачем строителю смотреть чужие дома\u003c/h2>\n\u003cp>Опытный строитель отличается от новичка не только тем, что умеет класть кирпич. Он видел сотни домов: жил в неудачных, чинил чужие ошибки, подмечал, почему в одном доме уютно, а в другом — красиво, но жить невозможно. Когда он проектирует свой, он не выдумывает всё с нуля — он собирает дом из решений, которые уже где-то видел работающими.\u003c/p>\n\u003cp>Это и есть насмотренность: библиотека чужих решений у тебя в голове. Вкус — не врождённый талант, а результат того, что ты много и правильно смотрел. Хорошая новость для вайб-кодера: насмотренность качается быстрее, чем умение программировать. Плохая: без неё ИИ тебе не поможет — он предложит «какой-то» вариант, а ты не сможешь отличить хороший от посредственного, потому что тебе не с чем сравнивать.\u003c/p>\n\u003cp>Это первая глава не случайно. Всё, что дальше — планировка, \u003cbutton class=\"term\" data-t=\"mvp\">MVP\u003c/button>, дизайн, цены, — начинается с вопроса «а как это делают другие?». Кто не смотрит по сторонам, тот заново изобретает кривое колесо.\u003c/p>\n\u003ch2>Смотреть глазами строителя, а не жильца\u003c/h2>\n\u003cp>Жилец заходит в дом и чувствует: «уютно» или «что-то не то». Строитель видит, ПОЧЕМУ: окна на юг, потолки три метра, розетки там, где нужны. Разница — в вопросах, которые ты задаёшь, пока смотришь.\u003c/p>\n\u003cp>Открой любой чужой продукт и разбери его на слои, как дом:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Какую \u003cbutton class=\"term\" data-t=\"pain\">боль\u003c/button> он решает и для кого?\u003c/strong> Какая у него \u003cbutton class=\"term\" data-t=\"niche\">ниша\u003c/button>?\u003c/li>\n\u003cli>\u003cstrong>Как он встречает новичка?\u003c/strong> Пройди \u003cbutton class=\"term\" data-t=\"onboarding\">онбординг\u003c/button> с секундомером: сколько шагов до первого «ага, полезно!»? Что тебя бесило?\u003c/li>\n\u003cli>\u003cstrong>Как он берёт деньги?\u003c/strong> Что бесплатно, что платно, где граница и почему именно там?\u003c/li>\n\u003cli>\u003cstrong>Как он выглядит и ощущается?\u003c/strong> Не «красиво/некрасиво», а конкретно: какие \u003cbutton class=\"term\" data-t=\"pattern\">паттерны\u003c/button> использует? Что ты понял без объяснений — и почему?\u003c/li>\n\u003cli>\u003cstrong>Что у него под капотом?\u003c/strong> (Это уже взгляд инженера — вернёмся к нему в главе про фундамент.)\u003c/li>\n\u003c/ol>\n\u003cp>Такой разбор одного продукта занимает 15–20 минут и даёт больше, чем час чтения статей «10 трендов дизайна». Смотреть надо не только на лидеров: неудачные продукты учат не хуже — на них видно, ЧЕГО не делать, а в отзывах прямо написано, за что людям больно.\u003c/p>\n\u003ch2>Где смотреть\u003c/h2>\n\u003cp>Каждой площадке — своя задача. Не «листать всё подряд», а идти за конкретным:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Product Hunt\u003c/strong> (producthunt.com) — витрина новых продуктов, десятки каждый день. Смотри не на победителей, а на то, как продукты себя ОПИСЫВАЮТ: одна фраза «что это и для кого» — готовая школа формулировок для твоего будущего \u003cbutton class=\"term\" data-t=\"landing\">лендинга\u003c/button>.\u003c/li>\n\u003cli>\u003cstrong>Indie Hackers\u003c/strong> (indiehackers.com) — истории маленьких продуктов с настоящими цифрами: сколько зарабатывают, где нашли первых клиентов, что провалилось. Противоядие от иллюзии «нужен миллион пользователей» — там полно продуктов, живущих на 50 платящих.\u003c/li>\n\u003cli>\u003cstrong>Mobbin\u003c/strong> (mobbin.com) — огромная коллекция скриншотов реальных мобильных приложений, разложенных по экранам: «онбординг», «оплата», «пустое состояние». Когда делаешь конкретный экран — смотришь, как этот же экран решили 30 команд с дизайнерами в штате.\u003c/li>\n\u003cli>\u003cstrong>Dribbble / Behance\u003c/strong> — работы дизайнеров. Осторожно: там много «красивого, но нежизнеспособного» — картинки рисуют ради лайков, их никто не проверял на живых пользователях. Бери настроение и стиль, не копируй механику.\u003c/li>\n\u003cli>\u003cstrong>Топы App Store / Google Play в своей категории\u003c/strong> — открой топ-20 «Образование», скачай пять, пройди онбординги. И главное — \u003cstrong>читай отзывы конкурентов\u003c/strong>, особенно на 2–3 звезды: «люблю приложение, но…» — после «но» люди бесплатно диктуют тебе список \u003cbutton class=\"term\" data-t=\"feature\">фич\u003c/button> и болей. Это самый недооценённый источник.\u003c/li>\n\u003cli>\u003cstrong>Каналы и рассылки про продукты\u003c/strong> — любые разборы, где объясняют, ПОЧЕМУ сделано так. Одна статья-разбор «как Duolingo удерживает пользователей» полезнее сотни скриншотов, потому что даёт причины, а не картинки.\u003c/li>\n\u003c/ul>\n\u003ch2>Коллекция референсов, которая работает\u003c/h2>\n\u003cp>Насмотренность испаряется, если её не записывать. Заведи одно место — заметки, папку, доску в Figma, — куда складываешь \u003cbutton class=\"term\" data-t=\"reference\">референсы\u003c/button>. Одно железное правило: \u003cstrong>каждый скриншот подписан — что именно здесь хорошо\u003c/strong>. «Экран оплаты Duolingo: цену показывают ПОСЛЕ бесплатной недели, сначала дают привыкнуть» — рабочий референс. Скриншот без подписи через неделю — мусор, ты не вспомнишь, зачем сохранял.\u003c/p>\n\u003cp>Когда придёт время делать свой экран оплаты, ты не будешь просить ИИ «сделай красиво» — ты дашь ему три референса с подписями и скажешь, что взять из каждого. Разница в результате — как между «построй мне дом» и «вот три дома, отсюда планировку, отсюда крышу».\u003c/p>\n\u003ch2>Разбор на Recall\u003c/h2>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Редизайн по готовому референсу — Nocturne.\u003c/strong> Тёмная тема Recall не выдумывалась с нуля: владелец принёс готовый макет (папка \u003ccode>handoff/\u003c/code> с прототипом и ТЗ), и весь интерфейс перекрашивался по нему — токены цветов, шрифт Onest, анимации. Результат получился цельным именно потому, что был конкретный образец, а не просьба «сделай красиво». Это насмотренность в действии: сначала нашли, КАК должно выглядеть, потом строили.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Заимствование паттернов, которые все знают.\u003c/strong> Колода в Recall сначала была «как в Anki» — четыре кнопки оценки (снова/трудно/хорошо/легко). Новичков это путало. Переделали на свайп-карточку: вправо — помню, влево — ещё раз. Это паттерн, знакомый каждому по Tinder и Duolingo — объяснять стало нечего, обучающий экран сократился до одной картинки. Хороший \u003cbutton class=\"term\" data-t=\"pattern\">паттерн\u003c/button> — это чужая насмотренность, упакованная в жест.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Идея фичи — прямо у конкурента.\u003c/strong> AI-квесты по грамматике в Recall честно родились из разбора Talkpal: там подсмотрена сама механика «текстовая игра, где AI пропускает дальше только за правильную грамматику». Но скопирована не один в один: добавлено то, чего нет у Talkpal и что нужно нашей нише — учитель сам назначает квест, задаёт тему и порог, видит всю переписку ученицы. Формула здорового заимствования: механика чужая, адаптация под свою нишу — своя.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>Чего не хватало: карты конкурентов ДО стройки.\u003c/strong> Recall строился от личной боли (восстановить язык себе, дать инструмент преподавателю) — это хороший источник идеи, но систематического разбора конкурентов (Duolingo, Anki, Quizlet, Talkpal, LinguaLeo) в начале не было. Цена этого: часть решений нашлась поздно и через переделки — те же четыре кнопки Anki переделывались на свайпы уже после того, как код был написан и протестирован. Час разглядывания чужих колод ДО стройки сэкономил бы день переделки. Сравнение цен с аналогами появилось только к моменту лендинга — повезло, что цифры сошлись.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout\">\u003cp>💡 \u003cstrong>Правило на будущее: час насмотренности перед каждой крупной фичей.\u003c/strong> Прежде чем строить новый экран или механику — открыть три продукта, где эта же задача уже решена, и разобрать их по слоям из этой главы. Это самый дешёвый способ «нанять» чужих дизайнеров и продактов: их решения уже проверены на миллионах пользователей.\u003c/p>\u003c/div>\n\u003ch2>Откуда берутся идеи продуктов\u003c/h2>\n\u003cp>Насмотренность отвечает не только «как сделать», но и «что делать». Рабочие источники идей, по убыванию надёжности:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Своя боль.\u003c/strong> Ты сам — первый пользователь, тебе не нужно угадывать, что нужно. Recall родился так: «мой английский просел с B2, хочу восстановить» плюс «моей девушке-преподавателю нужен инструмент для учениц». Минус: надо проверить, что боль есть ещё у кого-то, кроме тебя (об этом — следующая глава).\u003c/li>\n\u003cli>\u003cstrong>Чужая боль, подсмотренная в отзывах и чатах.\u003c/strong> Отзывы конкурентов на 2–3 звезды, профессиональные чаты, форумы: люди прямым текстом пишут, чего им не хватает и за что они бы заплатили.\u003c/li>\n\u003cli>\u003cstrong>Существующее — но для узкой ниши.\u003c/strong> Не «новый Duolingo», а «инструмент репетитора, ведущего учениц»: берёшь проверенную механику и затачиваешь под \u003cbutton class=\"term\" data-t=\"niche\">нишу\u003c/button>, до которой гигантам нет дела. Recall ровно это и делает.\u003c/li>\n\u003cli>\u003cstrong>Волна новой технологии.\u003c/strong> Появился дешёвый AI — стало возможно то, что вчера стоило миллионы (личный собеседник для практики языка). На волне легче взлететь, но и конкурентов туда прибегает толпа.\u003c/li>\n\u003c/ol>\n\u003cp>Если после часа насмотренности идей набралось несколько — не хватайся за все. Прогони каждую по четырём вопросам: насколько острая боль (люди уже платят за решение — или просто «было бы неплохо»)? есть ли у меня преимущество именно в этой нише (я сам оттуда, есть доступ к этим людям)? дотянусь ли я до них (знаю, где они собираются)? и хватит ли меня одного на такую стройку? Побеждает одна идея, остальные — в список «потом». Строить две параллельно — самый надёжный способ не довести ни одну.\u003c/p>\n\u003cp>Идея — ещё не продукт. Прежде чем строить, её надо проверить на спрос — этим займёмся в следующей главе.\u003c/p>\n\u003ch2>Чек-лист для нового проекта\u003c/h2>\n\u003cul>\n\u003cli>Я разобрал минимум 3 продукта-конкурента по слоям: боль, онбординг, деньги, паттерны.\u003c/li>\n\u003cli>Я прочитал отзывы конкурентов на 2–3 звезды и выписал повторяющиеся жалобы.\u003c/li>\n\u003cli>У меня есть коллекция референсов, и каждый подписан: что именно здесь хорошо.\u003c/li>\n\u003cli>Я знаю, из какой боли растёт моя идея и чем моя ниша отличается от «рынка вообще».\u003c/li>\n\u003cli>Перед каждой крупной фичей я час смотрю, как её сделали трое других.\u003c/li>\n\u003cli>Мои референсы — из живых продуктов (не только с Dribbble).\u003c/li>\n\u003c/ul>\n\u003ch2>Вопросы себе\u003c/h2>\n\u003col>\n\u003cli>Чем разбор продукта «глазами строителя» отличается от «глазами жильца»? Назови три слоя разбора.\u003c/li>\n\u003cli>Почему скриншот без подписи — мёртвый референс?\u003c/li>\n\u003cli>Что в AI-квестах Recall заимствовано у Talkpal, а что — своё? Почему такая формула считается здоровой?\u003c/li>\n\u003cli>Какой источник идей самый надёжный и в чём его главная ловушка?\u003c/li>\n\u003cli>Зачем читать отзывы конкурентов именно на 2–3 звезды, а не на 5 и не на 1?\u003c/li>\n\u003c/ol>"},{"n":"2","id":"02","part":"I","title":"Идея и проверка спроса","html":"\u003ch1>Идея и проверка спроса\u003c/h1>\n\u003ch2>Самая дорогая ошибка строителя\u003c/h2>\n\u003cp>Можно построить идеальный дом: ровные стены, тёплые полы, надёжные замки. И обнаружить, что построил его в поле, куда никто не собирался переезжать. В программировании это ошибка номер один: разборы провалившихся стартапов из года в год показывают одну и ту же главную причину смерти — «продукт оказался никому не нужен». Не «плохой код», не «кончились деньги» — именно отсутствие спроса.\u003c/p>\n\u003cp>Коварство в том, что с ИИ строить стало быстро и приятно, поэтому проверку спроса хочется пропустить: «за неделю соберу — там посмотрим». Но неделя стройки превращается в месяц полировки, месяц — в три, и всё это время ты вкладываешься в дом, на который, возможно, никто не приедет смотреть. Проверка спроса — это не бюрократия, а способ потратить три дня, чтобы не потерять три месяца.\u003c/p>\n\u003cp>Важно: идея и спрос — разные вещи. Идея — «приложение для изучения языков с ИИ». Спрос — конкретные люди, которые уже сейчас мучаются без твоего решения и готовы за него платить. Идей — бесконечность, спрос — редкость.\u003c/p>\n\u003ch2>Сначала проверь себя\u003c/h2>\n\u003cp>Прежде чем проверять идею, честно проверь собственные ресурсы. Три вопроса: сколько часов в неделю у меня есть НА САМОМ ДЕЛЕ (не в мечтах)? готов ли я не только строить, но и годами обслуживать построенное — отвечать пользователям, чинить, обновлять? и тяну ли я эту конкретную идею один, или она по-честному требует команды? С ИИ строить стало настолько быстро, что проект легко разрастается за пределы того, что один человек способен сопровождать: стройка — спринт, а владение продуктом — марафон. Идея, которая не проходит по ресурсам, — не «вызов», а будущий недострой.\u003c/p>\n\u003ch2>Как проверить спрос малой кровью\u003c/h2>\n\u003cp>Принцип один: \u003cstrong>добыть доказательства чужими действиями, а не словами\u003c/strong>. Люди врут из вежливости — не со зла, просто «да, прикольно, я бы пользовался» ничего не стоит. Действия не врут: оставить почту, прийти на созвон, заплатить. По нарастанию силы доказательства:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Посмотри на конкурентов.\u003c/strong> Есть живые конкуренты с платящими пользователями — уже хорошо: спрос доказан чужими деньгами, твоя задача — найти \u003cbutton class=\"term\" data-t=\"niche\">нишу\u003c/button>, которую они обслуживают плохо (глава 1 научила читать их отзывы). Пустой рынок — тревожный знак: чаще это «спроса нет», а не «никто не догадался».\u003c/li>\n\u003cli>\u003cstrong>Поговори с людьми из ниши\u003c/strong> — это называется \u003cbutton class=\"term\" data-t=\"custdev\">кастдев\u003c/button>. Пять честных разговоров с репетиторами дадут больше, чем месяц догадок. Главное правило — \u003cbutton class=\"term\" data-t=\"mom-test\">тест мамы\u003c/button>: спрашивай о прошлом, а не о будущем. Не «пользовалась бы ты таким приложением?», а «как ты сейчас даёшь ученикам слова на неделю? сколько времени уходит на проверку? что бесит сильнее всего?». Записывай дословно — их формулировки потом станут текстом твоего \u003cbutton class=\"term\" data-t=\"landing\">лендинга\u003c/button>.\u003c/li>\n\u003cli>\u003cstrong>Лендинг до продукта + \u003cbutton class=\"term\" data-t=\"waitlist\">список ожидания\u003c/button>.\u003c/strong> Страница с обещанием продукта и кнопкой «оставить почту» строится за вечер — задолго до самого продукта. Приведи на неё 100 человек из ниши и посчитай, сколько оставили контакт. Это самый дешёвый измеритель спроса из существующих.\u003c/li>\n\u003cli>\u003cstrong>Предпродажа.\u003c/strong> Высший пилотаж: «первым десяти — полгода за полцены, вот номер для перевода». Деньги вперёд за несуществующий продукт — самое честное доказательство спроса на свете. Страшно предлагать? Это и есть проверка: если сам не веришь настолько, чтобы предложить, — сигнал.\u003c/li>\n\u003cli>\u003cstrong>\u003cbutton class=\"term\" data-t=\"pilot\">Пилот\u003c/button> на живых посторонних людях.\u003c/strong> Не мама и не девушка: у близких боль договорная. 2–3 настоящих пользователя из ниши, которые прошли путь целиком, — фундамент уверенности перед тем, как звать толпу.\u003c/li>\n\u003c/ol>\n\u003cp>И два правила поверх инструментов. Первое — \u003cstrong>прикинь размер ниши хотя бы по порядку величины\u003c/strong>: сколько таких людей ты вообще можешь достать, и сколько из них по опыту конкурентов заплатят (обычно платит от силы несколько процентов дошедших). Сужать нишу правильно, но ниша из тридцати человек при цене 3000 ₸ — это 90 000 ₸ в месяц в НЕДОСТИЖИМОМ максимуме; посчитай это до стройки, а не после. Второе — \u003cstrong>поставь дедлайн и порог заранее\u003c/strong>: «две недели на проверку; если не наберу 5 разговоров и 20 контактов в списке ожидания — идею откладываю». Без записанного порога проверка длится вечно: бросать больно, а строить с ИИ приятно, и «ещё чуть-чуть допилю» побеждает месяцами.\u003c/p>\n\u003cp>Для кого всё это делать? Ищи \u003cbutton class=\"term\" data-t=\"early-adopters\">ранних последователей\u003c/button> — тех, у кого боль острая настолько, что они готовы терпеть сырость. Продукт «для всех репетиторов» на старте не нужен никому; продукт «для репетитора, который тратит воскресенье на проверку тетрадей» — нужен конкретным людям, и они простят кривоватые углы.\u003c/p>\n\u003ch2>Когда строить всё-таки можно до проверки\u003c/h2>\n\u003cp>Есть честное исключение: \u003cstrong>ты сам — пользователь\u003c/strong>. Если строишь инструмент для себя и он тебе реально служит — это уже не ноль спроса, это спрос размером в одного человека, и стройка окупается твоей же пользой. Так родился Recall: владелец восстанавливает язык, его девушка ведёт учениц. Ловушка начинается в момент, когда «инструмент для себя» тихо переименовывается в «продукт для рынка» — а проверка спроса при этом так и не случилась. Для себя можно строить без проверки; для чужих денег — нельзя.\u003c/p>\n\u003ch2>Если строите вдвоём — договоритесь на берегу\u003c/h2>\n\u003cp>Частый случай (и случай Recall): продукт делают двое — один строит, второй приносит экспертизу и живых пользователей. Пока денег нет, всё держится на дружбе, и кажется, что договариваться не о чем. Именно поэтому договориться нужно СЕЙЧАС: полстраницы текста, написанные, пока все в хороших отношениях, стоят дешевле любого будущего спора. Минимум: кто что делает; кто принимает решение, если мнения разошлись; как делятся деньги, когда появятся; что происходит с продуктом, если один из двоих выходит из игры. Это не недоверие — это та же планировка, только для людей.\u003c/p>\n\u003ch2>Разбор на Recall\u003c/h2>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Идея выросла из настоящей боли, и первый пользователь — реальный.\u003c/strong> Recall строился не «для рынка», а для двух конкретных людей: владелец восстанавливает английский, его девушка — преподаватель уровня C1 с настоящими ученицами. Режим «Преподаватель» проектировался под её живой процесс: назначить слова, проверить работы, увидеть прогресс. Это спрос размером в семью — маленький, но честный: продуктом пользуются каждый день не потому, что «надо тестировать», а потому что он нужен.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Цены не выдуманы, а посчитаны и сверены с рынком — с честными пометками о качестве данных.\u003c/strong> Перед тарифами собраны факты (docs/monetization-draft.md): ставки репетиторов Казахстана с бирж, цены аналогов (Talkpal, ProgressMe, Duolingo) — и там, где источники слабые (агрегаторы вместо официальных сайтов), это прямо помечено «⚠️ не верифицировано». Плюс посчитана экономика инфраструктуры (docs/costs.md: когда что упрётся в бесплатные лимиты при 0/50/200/1000 пользователях). Отдельный плюс — заранее записан критерий провала: «не взлетело = 0 платящих при 10+ разговорах». Это дисциплина настоящего строителя: когда критерий записан ДО запуска, себя не обманешь «ну, почти получилось».\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>А вот классической проверки спроса не было — и это главный открытый риск проекта.\u003c/strong> Порядок получился обратным учебному: сначала стройка (продукт готов целиком, тарифы до 30 учениц зафиксированы как «финальные», лендинг написан), а кастдев с посторонними репетиторами, список ожидания, пилот — не случились до сих пор. Регистрация закрыта белым списком, платящих ноль, и вся обратная связь пока — от двух родных людей. Мелкая, но показательная деталь из аудита: лендинг обещает «попробуйте 14 дней бесплатно», а его кнопка ведёт на закрытую регистрацию — и о том, что это закрытый тест, посторонний узнает только упёршись в отказ. Сколько чужих репетиторов готовы платить 3000–12000 ₸ в месяц — сегодня не знает никто: тарифная сетка целиком стоит на ценах конкурентов и прикидках, а не на одном живом «да, плачу».\u003c/p>\u003c/div>\n\u003cdiv class=\"callout\">\u003cp>💡 \u003cstrong>Что делать — уже спланировано, осталось нажать «отправить».\u003c/strong> План пилота в проекте есть: 3 бесплатных места по бартеру (еженедельный фидбек + кейс + рекомендация коллегам, docs/monetization-draft.md) и даже готовый текст личного сообщения репетиторам (docs/tg-launch.md). Не хватает одного — чтобы сообщения ушли живым посторонним людям. Пилот не требует открытой регистрации: белый список позволяет добавить 2–3 репетиторов руками хоть сегодня. Это проверит разом спрос, цены и онбординг чужого человека (который не может спросить владельца за ужином, как что работает) — и только после этого имеет смысл открывать двери и звать трафик на лендинг.\u003c/p>\u003c/div>\n\u003ch2>Чек-лист для нового проекта\u003c/h2>\n\u003cul>\n\u003cli>Я знаю трёх живых конкурентов и понял из их отзывов, чем недовольны их пользователи. Если конкурентов нет — я насторожился, а не обрадовался.\u003c/li>\n\u003cli>Я поговорил минимум с 5 людьми из ниши по правилам теста мамы: о прошлом поведении, не о гипотетическом будущем.\u003c/li>\n\u003cli>У меня есть доказательства спроса ДЕЙСТВИЯМИ: оставленные контакты, предзаказ или пилот, — а не вежливые «прикольно».\u003c/li>\n\u003cli>Я знаю, кто мои ранние последователи и где они собираются (чат, форум, знакомые).\u003c/li>\n\u003cli>Если я строю «для себя» — я честно себе в этом признался и не называю это «продуктом для рынка», пока не проверил на посторонних.\u003c/li>\n\u003cli>Прежде чем строить месяцами, я потратил дни на самый дешёвый тест (лендинг, разговоры, предпродажа).\u003c/li>\n\u003c/ul>\n\u003ch2>Вопросы себе\u003c/h2>\n\u003col>\n\u003cli>Почему «я бы пользовался» от друга почти ничего не доказывает, а оставленная почта — уже кое-что?\u003c/li>\n\u003cli>В чём суть «теста мамы»? Придумай правильный и неправильный вопрос репетитору про проверку домашек.\u003c/li>\n\u003cli>Почему пустой рынок без конкурентов — чаще плохой знак, чем хороший?\u003c/li>\n\u003cli>Какой порядок «проверка → стройка» нарушен в Recall и какой самый дешёвый шаг это исправляет?\u003c/li>\n\u003cli>Когда строить без проверки спроса — нормально?\u003c/li>\n\u003c/ol>"},{"n":"3","id":"03","part":"I","title":"Планировка: требования, сценарии, MVP","html":"\u003ch1>Планировка: требования, сценарии, MVP\u003c/h1>\n\u003ch2>Дом начинается не с фундамента\u003c/h2>\n\u003cp>Строитель Б из нашей истории ставил санузел в спальне не потому, что плохо клал плитку, — плитка как раз ровная. Он просто начал строить без планировки: комнаты добавлялись по вдохновению, куда рука легла. С ИИ этот соблазн умножается: «сделай мне экран с карточками» — и через минуту экран готов. Ещё экран, ещё... Через месяц у тебя пятнадцать экранов, между которыми пользователь блуждает, три из них делают одно и то же, а главное действие спрятано на четвёртом тапе.\u003c/p>\n\u003cp>Планировка — это ответы на три вопроса ДО стройки: \u003cstrong>что строим, для кого и что НЕ строим сейчас\u003c/strong>. Заметь: не «как строим» — про технику будет глава про фундамент. Планировка — про смысл.\u003c/p>\n\u003ch2>Сценарии вместо списка хотелок\u003c/h2>\n\u003cp>Список фич — плохой план: «колода, чат, статистика, уведомления...» — из него не видно, зачем всё это. Хороший план состоит из \u003cbutton class=\"term\" data-t=\"user-story\">пользовательских сценариев\u003c/button>: живой человек с именем и целью проходит путь.\u003c/p>\n\u003cp>«Репетитор Аружан в воскресенье за 15 минут назначает трём ученицам слова и задания на неделю» — это сценарий. Из него сразу видно: нужен список учениц, назначение в пару тапов, и всё это должно работать быстро — у неё таких три, а времени 15 минут. А ещё видно, что НЕ нужно: никакой ленты новостей, никаких бейджиков-достижений — в сценарии их нет.\u003c/p>\n\u003cp>Напиши 3–5 главных сценариев своего продукта. Правило: если фича не встречается ни в одном сценарии — она не строится. Это и есть требования, только в форме, которую понимает и человек, и ИИ: сценарий можно вставить прямо в \u003cbutton class=\"term\" data-t=\"spec\">ТЗ\u003c/button> для Claude, и результат будет несравнимо лучше, чем от «сделай удобно».\u003c/p>\n\u003ch2>MVP: самый маленький дом, в котором уже можно жить\u003c/h2>\n\u003cp>\u003cbutton class=\"term\" data-t=\"mvp\">MVP\u003c/button> — понятие, которое чаще всего понимают неправильно. MVP — это не «всё то же самое, но криво». Это \u003cstrong>самый короткий путь до момента, когда живой пользователь получает пользу\u003c/strong>, — и ни шагом длиннее.\u003c/p>\n\u003cp>Хитрость в том, чтобы резать план не по качеству, а по объёму. Дом из одной комнаты, но с крышей, дверью и туалетом — MVP. Дом из десяти комнат без крыши — не MVP, это недострой. Для языкового приложения «одна колода слов с повторением, которое реально работает» — MVP; «колода + чат + статистика + магазин тем, всё наполовину» — недострой.\u003c/p>\n\u003cp>Проверка простая: возьми главный сценарий из прошлого раздела и вычеркни из продукта всё, без чего сценарий всё ещё проходит. Что осталось — MVP. Что вычеркнул — записывай в список «потом»: идеи не умирают, они встают в очередь.\u003c/p>\n\u003cp>Этот список «потом» — твоя главная защита от \u003cbutton class=\"term\" data-t=\"scope-creep\">расползания скоупа\u003c/button>. Во время стройки идеи будут приходить каждый день (особенно с ИИ, где «а давай ещё вот это» стоит одну фразу). Записанный \u003cbutton class=\"term\" data-t=\"scope\">скоуп\u003c/button> превращает «а давай» из угрозы срокам в пополнение очереди.\u003c/p>\n\u003ch2>Имя: проверь, пока оно не проросло в код\u003c/h2>\n\u003cp>Имя продукта выбирают до стройки — и до неё же проверяют, свободно ли оно. Десять минут: домен (свободен ли хоть в одной приличной зоне), поиск в App Store и Google Play (сколько там уже «таких же»), обычный поиск (не занято ли имя кем-то большим), беглый взгляд на реестр товарных знаков, если целишься всерьёз. Почему до стройки: имя прорастает везде — в код, названия папок, базу, документы, ссылки — и переименование через полгода стоит дней работы и потери узнаваемости.\u003c/p>\n\u003cp>Живой пример: слово «Recall» — очень частотное. Так называется известная функция Windows, и в сторах немало приложений про память с тем же корнем. Для закрытого теста это неважно, но перед публичным запуском придётся проверить, находят ли тебя по имени вообще — и, возможно, добавить к имени отличительную часть.\u003c/p>\n\u003ch2>Чертёж: договорись с собой о конструкции\u003c/h2>\n\u003cp>Когда понятно ЧТО строить, один вечер стоит потратить на чертёж — как это устроено внутри. Не код, а договорённости, они же \u003cbutton class=\"term\" data-t=\"contract\">контракты\u003c/button>: какие сущности есть в системе (пользователь, колода, карточка, назначение), как они связаны, какие папки за что отвечают, какие у базы таблицы. Одна страница текста.\u003c/p>\n\u003cp>Зачем это вайб-кодеру? Затем, что чертёж — общий язык между твоими сессиями с ИИ. Без него каждая новая сессия изобретает свои названия и свою структуру, и через месяц проект — лоскутное одеяло. С ним ты пишешь в ТЗ «по контрактам из ARCHITECTURE.md» — и десятая фича ложится в те же папки и типы, что первая. Чертёж должен жить рядом с кодом и \u003cstrong>обновляться, когда меняется конструкция\u003c/strong> — устаревший чертёж опаснее отсутствующего, потому что ему верят.\u003c/p>\n\u003cp>И вторая часть планировки, которую пропускают чаще всего: \u003cstrong>данные важнее экранов\u003c/strong>. Экран переделать — час; переделать таблицу базы, в которой уже лежат данные живых пользователей, — боль с миграциями и риском всё потерять. Поэтому в чертеже сущности и их связи продумываются раньше и тщательнее, чем кнопки (подробно — в главе про данные).\u003c/p>\n\u003ch2>Планировка одного захода: ТЗ для ИИ\u003c/h2>\n\u003cp>Планировка нужна не только проекту целиком — она нужна каждому рабочему заходу. Формула хорошего ТЗ для ИИ:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Контекст\u003c/strong>: что за проект, где лежат правила (чертёж, контракты).\u003c/li>\n\u003cli>\u003cstrong>Задача\u003c/strong>: что должно появиться/измениться — в форме сценария, а не техники.\u003c/li>\n\u003cli>\u003cstrong>Границы\u003c/strong>: чего НЕ делать, что не трогать.\u003c/li>\n\u003cli>\u003cstrong>Критерий готовности\u003c/strong>: как проверим, что получилось (тест, сценарий прохода, сборка без ошибок).\u003c/li>\n\u003c/ol>\n\u003cp>Расплывчатое ТЗ — «сделай красиво и удобно» — заставляет ИИ угадывать, и он угадает что-то среднестатистическое. Точное ТЗ — «по макету из handoff/, тёмная тема, токены цветов, проверка: все 11 экранов без светлых пятен» — даёт результат с первого раза. Час на планировку захода экономит день переделок: то же правило, что и с домом, только масштаб меньше.\u003c/p>\n\u003ch2>Разбор на Recall\u003c/h2>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Чертёж существует и работает.\u003c/strong> В проекте есть docs/ARCHITECTURE.md — контракты: структура папок (\u003ccode>features/\u003cem>\u003c/code> — по фиче на папку, \u003ccode>lib/\u003c/em>\u003c/code> — по файлу логики), общие типы в \u003ccode>src/types\u003c/code>, схема базы в docs/schema.sql. В правилах проекта записано «не ломать контракты, импортировать типы из src/types» — и десятки сессий с ИИ строили в одной структуре: колода, читалка, речь, преподаватель — всё лежит предсказуемо. Это то, что отличает дом от лоскутного одеяла.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Стройка шла фазами с критериями готовности.\u003c/strong> Recall не строился «всё сразу»: Фаза 1 — фундамент (вход, навигация, база), потом по одной фиче за заход, каждая — со своим E2E-прогоном в конце. Список «потом» тоже жил в явном виде (docs/work-plan.md с готовыми промптами будущих заходов) — идеи вставали в очередь, а не вклинивались в текущую стройку.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>Но чертёж отстал от стройки — и аудит этого захода показал, насколько.\u003c/strong> ARCHITECTURE.md сверили с кодом: устарело примерно \u003cstrong>половина документа\u003c/strong>. Контракты функций точны (их правили недавно), а вот структура — нет: документ описывает навигацию из 5 вкладок, которой нет с редизайна (в коде 4 другие); утверждает «папка practice удалена, /practice ведёт на /flashcards» — в коде ровно наоборот; в схеме базы нет колонок тарифов (plan, trial_until, is_admin) и целых подсистем: квесты, программа обучения, диагностика, план дня, монетизация. Чем это опасно: ИИ-воркер, строящий «по чертежу», станет удалять живую папку practice, воссоздавать несуществующую навигацию и писать фичи, не знающие про квоты и блокировки — то есть врущий чертёж не просто бесполезен, он активно ломает. Урок: чертёж обновляется В ТОТ ЖЕ заход, что и перестройка, иначе он превращается из карты в ловушку. (Находка ушла владельцу в список исправлений.)\u003c/p>\u003c/div>\n\u003cdiv class=\"callout\">\u003cp>💡 \u003cstrong>Планировка захода у Recall выросла в целый ритуал — и это стоит перенять.\u003c/strong> Крупные решения проходят «грилинг»: ИИ задаёт владельцу вопросы по одному, с вариантами и рекомендацией, пока не соберётся полное ТЗ (этот учебник спланирован ровно так). Дешёвая страховка от «построили не то»: полчаса вопросов до стройки вместо переделки после.\u003c/p>\u003c/div>\n\u003ch2>Чек-лист для нового проекта\u003c/h2>\n\u003cul>\n\u003cli>У меня записаны 3–5 главных пользовательских сценариев с живыми людьми и целями.\u003c/li>\n\u003cli>Каждая фича в плане встречается хотя бы в одном сценарии; остальные — в списке «потом».\u003c/li>\n\u003cli>Мой MVP — самый короткий путь до пользы, порезанный по объёму, а не по качеству.\u003c/li>\n\u003cli>Есть чертёж на одну страницу: сущности, связи, папки, таблицы. Он лежит рядом с кодом.\u003c/li>\n\u003cli>Я обновляю чертёж при каждой перестройке — или хотя бы регулярно сверяю его с реальностью.\u003c/li>\n\u003cli>Каждый заход с ИИ начинается с ТЗ: контекст, задача, границы, критерий готовности.\u003c/li>\n\u003cli>Новые идеи во время стройки идут в список «потом», а не в текущий заход.\u003c/li>\n\u003c/ul>\n\u003ch2>Вопросы себе\u003c/h2>\n\u003col>\n\u003cli>Чем сценарий «Аружан за 15 минут назначает задания» лучше строки «сделать назначение заданий» в списке фич?\u003c/li>\n\u003cli>«MVP режут по объёму, а не по качеству» — что это значит? Приведи пример недостроя, замаскированного под MVP.\u003c/li>\n\u003cli>Зачем чертёж проекту, который пишет один человек с ИИ?\u003c/li>\n\u003cli>Почему устаревший чертёж опаснее отсутствующего?\u003c/li>\n\u003cli>Из каких четырёх частей состоит хорошее ТЗ для захода с ИИ? Какой не хватало в «сделай красиво»?\u003c/li>\n\u003c/ol>"},{"n":"4","id":"04","part":"II","title":"Фундамент: стек, структура, типы","html":"\u003ch1>Фундамент: стек, структура, типы\u003c/h1>\n\u003ch2>Самая невидимая и самая дорогая часть дома\u003c/h2>\n\u003cp>Фундамент не показывают гостям. Его вообще не видно — но именно он решает, простоит дом полвека или пойдёт трещинами через год. И главное свойство фундамента: \u003cstrong>менять его под построенным домом — самое дорогое, что бывает в стройке\u003c/strong>. Обои переклеить — вечер; фундамент переложить — разобрать дом.\u003c/p>\n\u003cp>В программировании фундамент — это три вещи: \u003cbutton class=\"term\" data-t=\"stack\">стек\u003c/button> (на чём строим), структура проекта (где что лежит) и \u003cbutton class=\"term\" data-t=\"typing\">типы\u003c/button> (договорённости о форме данных). Все три выбираются в начале и все три почти невозможно дёшево поменять потом. Поэтому эта глава — про решения, которые стоит принять головой, а не «как получится».\u003c/p>\n\u003ch2>Выбор стека: правила для строителя с ИИ\u003c/h2>\n\u003cp>Споры «какой фреймворк лучше» — любимый спорт программистов, но для вайб-кодера ответ проще, чем кажется. Твои критерии отличаются от критериев большой компании:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Бери самое популярное.\u003c/strong> Не потому что «мода», а потому что ИИ учился на публичном коде: чем больше в мире кода на React, тем лучше ИИ пишет React. Экзотичный фреймворк = ИИ чаще галлюцинирует, меньше готовых ответов на ошибки. Популярность стека — это буквально качество твоего главного работника.\u003c/li>\n\u003cli>\u003cstrong>Бери готовое, а не самодельное.\u003c/strong> Свой сервер с нуля — месяцы; \u003cbutton class=\"term\" data-t=\"baas\">BaaS\u003c/button> вроде Supabase даёт базу, вход по паролю и права доступа в первый день. Правило: всё, что не является сутью твоего продукта, — арендуй, а не строй. Суть Recall — методика изучения языков, а не система логинов.\u003c/li>\n\u003cli>\u003cstrong>Считай бесплатные пределы заранее.\u003c/strong> У каждого сервиса есть бесплатный тир и потолок. Пока учишься и проверяешь спрос — бесплатных хватает с запасом; важно лишь знать, где потолки (подробно — глава «Карта сервисов»).\u003c/li>\n\u003cli>\u003cstrong>Скучное лучше модного.\u003c/strong> Технология, которой 10 лет, пережила все детские болезни, и её проблемы гуглятся за минуту. Технология, которой полгода, сломается на тебе первой.\u003c/li>\n\u003c/ol>\n\u003cp>И одно мета-правило: \u003cstrong>стек выбирается один раз на проект\u003c/strong>. Переезд «с React на Vue, потому что посоветовали» — это перекладка фундамента; поводов для неё почти не бывает.\u003c/p>\n\u003ch2>Структура: дом, в котором ИИ не заблудится\u003c/h2>\n\u003cp>Код растёт быстро (с ИИ — очень быстро), и вопрос «где что лежит» становится вопросом выживания. Хорошая структура строится \u003cstrong>по фичам, а не по сортам файлов\u003c/strong>: не «все экраны в одну папку, вся логика в другую свалку», а «всё про колоду — в папке колоды».\u003c/p>\n\u003cp>Рабочая схема (её использует Recall, но она универсальна):\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>features/*\u003c/code> — по папке на фичу: экраны и детали, нужные только ей;\u003c/li>\n\u003cli>\u003ccode>lib/*\u003c/code> — по файлу на подсистему: логика без интерфейса (посчитать расписание, сходить в базу);\u003c/li>\n\u003cli>\u003ccode>types/\u003c/code> — ЕДИНОЕ место общих типов;\u003c/li>\n\u003cli>\u003ccode>components/\u003c/code> — общие кирпичи интерфейса (кнопка, карточка, шапка).\u003c/li>\n\u003c/ul>\n\u003cp>Почему это критично именно при работе с ИИ: у ИИ нет памяти между сессиями. Каждый новый чат заново смотрит на проект — и если структура предсказуема, ему достаточно правила «фича — в свою папку, логика — в свой файл в lib», чтобы десятая фича легла туда же, куда первая. Без правила каждая сессия изобретает свою раскладку, и через месяц проект — свалка, в которой и ИИ, и ты ищете вещи по часу.\u003c/p>\n\u003cp>Второй этаж этой предсказуемости — \u003cbutton class=\"term\" data-t=\"contract\">контракты\u003c/button> из главы про планировку: чертёж (ARCHITECTURE.md) описывает структуру, правила проекта требуют ей следовать. Структура + чертёж = ИИ строит там, где надо, даже когда тебя не было рядом.\u003c/p>\n\u003cp>И одно правило про \u003cstrong>состояние, живущее в браузере\u003c/strong> (какой язык выбран, что уже видел пользователь, черновики): у каждого такого кусочка должен быть ОДИН хозяин-функция, а не прямое обращение из каждого экрана. Иначе два экрана держат копию одного значения и незаметно расходятся — «то работает, то нет», и причину не найти (в разборе Recall ниже это ровно один из сорняков). То же правило «одна вещь — в одном месте», что и для данных, но для клиентского состояния.\u003c/p>\n\u003ch2>Типы: договорённости, которые проверяет машина\u003c/h2>\n\u003cp>\u003cbutton class=\"term\" data-t=\"typing\">Типизация\u003c/button> — то, что отличает TypeScript от JavaScript и что новичку кажется «лишней писаниной». На самом деле это самая дешёвая страховка в проекте. Тип — это записанная договорённость: «карточка — это объект с полями front, back, example». Дальше машина сама проверяет каждую строку кода на соблюдение договорённостей — ДО запуска, за секунды.\u003c/p>\n\u003cp>Для вайб-кодера типы важны вдвойне:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Это поручни для ИИ.\u003c/strong> Когда типы строгие, ИИ физически не может передать «не то не туда» — ошибку покажет проверка (\u003ccode>npm run build\u003c/code>), а не пользователь через неделю.\u003c/li>\n\u003cli>\u003cstrong>Это документация, которая не устаревает.\u003c/strong> Чертёж может отстать от кода (мы это проходили), а типы — нет: они и есть код.\u003c/li>\n\u003c/ul>\n\u003cp>Правила: включить строгий режим (\u003ccode>strict\u003c/code> в tsconfig); общие типы держать в одном месте (\u003ccode>src/types\u003c/code>), а не переобъявлять в каждом файле; \u003cstrong>особое внимание — границам\u003c/strong>: данные из базы, ответы ИИ, содержимое localStorage приходят «снаружи» и типов не имеют — именно там появляется слово \u003ccode>any\u003c/code> («что угодно»), выключающее все проверки. Каждый \u003ccode>any\u003c/code> — дырка в перилах: один раз удобно, потом кто-то падает.\u003c/p>\n\u003ch2>Разбор на Recall\u003c/h2>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Стек собран ровно по правилам выше — и это видно по результату.\u003c/strong> Vite + React + TypeScript + Tailwind — самые массовые инструменты своих ниш (ИИ знает их превосходно); Supabase вместо своего сервера — вход, база и права доступа заработали в первый же день; Vercel — деплой пушем в гит; всё на бесплатных тирах (жёсткое условие владельца). Стек не менялся ни разу за проект — фундамент не перекладывали.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Структура пережила десятки сессий и осталась предсказуемой.\u003c/strong> 20 папок в features/, ~45 файлов в lib/ — и правило «фича в свою папку, логика в свой файл» держится: колода — features/flashcards + lib/fsrs.ts, квесты — features/quests + lib/quests.ts, программа — features/program + lib/studyPlan.ts. Новый экран сегодня ложится по тем же правилам, что первый год назад.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>Аудит структуры этого захода: фундамент крепкий, но сорняки нашлись.\u003c/strong> Сначала хорошее, что подтвердилось проверкой: даже самый большой экран проекта не лезет в базу напрямую — вся логика через свой lib-файл; перемешивание карточек существует в ОДНОМ экземпляре (lib/random.ts) на весь проект — искали вторую копию, не нашли. Теперь сорняки: (1) lib/spanishDict.ts — \u003cstrong>103 строки мёртвого кода\u003c/strong>: ноль импортов, его роль давно забрал contextDict — причём файл продолжали обновлять при рефакторингах, тратя внимание на труп; (2) шаблон «прочитай JSON из localStorage с подстраховкой» переизобретён \u003cstrong>в 12 файлах\u003c/strong> — общего хелпера нет, и поведение при сбое уже разъехалось (где-то вернётся \u003ccode>{}\u003c/code>, где-то \u003ccode>[]\u003c/code>); (3) пара фич пишет в localStorage прямо из экранов, а один ключ делят два экрана без общего хелпера — опечатка в имени ключа молча рассинхронизирует их. Плюс в корне репозитория лежат посторонние файлы, не прикрытые .gitignore, — при случайном \u003ccode>git add -A\u003c/code> уедут в историю. Все находки — в журнале исправлений.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout\">\u003cp>💡 \u003cstrong>Ленивая загрузка — фундамент скорости, заложенный вовремя.\u003c/strong> Стартовый \u003cbutton class=\"term\" data-t=\"bundle\">бандл\u003c/button> Recall когда-то распух до 900 КБ — приложение открывалось заметно дольше. Лечение: тяжёлые куски (словарь на тысячи слов, уроки грамматики, читалка PDF) вынесены в отдельные \u003cbutton class=\"term\" data-t=\"dependency\">куски\u003c/button>, которые скачиваются только когда нужны. Стартовый вес упал втрое. Урок: следить за весом бандла — часть фундамента, а не «полировка потом».\u003c/p>\u003c/div>\n\u003ch2>Чек-лист для нового проекта\u003c/h2>\n\u003cul>\n\u003cli>Мой стек — самые популярные инструменты своих ниш, а не экзотика (ИИ будет писать лучше).\u003c/li>\n\u003cli>Всё, что не суть продукта (вход, база, хостинг, платежи), — арендовано готовым, а не построено с нуля.\u003c/li>\n\u003cli>Я знаю бесплатные пределы каждого сервиса стека и что будет при их превышении.\u003c/li>\n\u003cli>Структура: фича → своя папка, логика → свой файл в lib, общие типы → одно место.\u003c/li>\n\u003cli>В tsconfig включён strict; \u003ccode>any\u003c/code> на границах (база, ИИ, localStorage) заменён на описанные типы.\u003c/li>\n\u003cli>Структура записана в чертеже, и правило проекта требует ей следовать.\u003c/li>\n\u003cli>Стартовый бандл не тащит тяжёлые данные — они грузятся лениво.\u003c/li>\n\u003c/ul>\n\u003ch2>Вопросы себе\u003c/h2>\n\u003col>\n\u003cli>Почему для вайб-кодера популярность технологии важнее её «крутости»? Кто на самом деле выигрывает от популярного стека?\u003c/li>\n\u003cli>«Всё, что не суть продукта, — арендуй». Что было сутью Recall, а что арендовали?\u003c/li>\n\u003cli>Чем структура «по фичам» лучше структуры «все экраны в одну папку», когда код пишет ИИ без памяти между сессиями?\u003c/li>\n\u003cli>Что делает \u003ccode>any\u003c/code> с проверками TypeScript и где \u003ccode>any\u003c/code> чаще всего заводится?\u003c/li>\n\u003cli>Почему смена фреймворка — «перекладка фундамента», а не «ремонт»?\u003c/li>\n\u003c/ol>"},{"n":"5","id":"05","part":"II","title":"Код: почему «работает» ещё не значит «хорошо»","html":"\u003ch1>Код: почему «работает» ещё не значит «хорошо»\u003c/h1>\n\u003ch2>Кривые стены, на которые вешают полки\u003c/h2>\n\u003cp>Дом строителя Б стоит, и в нём даже можно жить. Проблемы начинаются позже: каждая полка на кривой стене висит криво, каждая новая розетка требует долбить бетон в случайном месте, и каждый ремонт стоит вдвое дороже, чем у соседа. Стены-то стоят — но \u003cstrong>цена каждого следующего изменения растёт\u003c/strong>.\u003c/p>\n\u003cp>Это и есть главное определение качества кода, единственное, которое стоит запомнить: \u003cstrong>хороший код — тот, в который дёшево вносить следующее изменение\u003c/strong>. Не «красивый», не «по всем канонам» — дешёвый в изменении. Плохой код тоже работает; он просто делает каждую следующую фичу дороже, пока проект не встаёт совсем.\u003c/p>\n\u003cp>Вайб-кодеру это знание нужно не меньше, чем программисту, — просто применяет он его иначе: ты не пишешь код руками, но ты его \u003cstrong>заказываешь, читаешь и принимаешь\u003c/strong>. Как заказчик дома: сам не кладёшь кирпич, но обязан отличать ровную стену от кривой — иначе примешь что угодно.\u003c/p>\n\u003ch2>Из чего складывается «дёшево изменить»\u003c/h2>\n\u003cp>\u003cstrong>Читаемость.\u003c/strong> Код читают в десятки раз чаще, чем пишут — и человек, и ИИ в каждой новой сессии. Читаемость — это имена, которые говорят правду (\u003ccode>getDueCards\u003c/code> — «дай карточки к повторению», а не \u003ccode>getData\u003c/code>), куски разумного размера (функция на экран, а не на десять), и комментарии, объясняющие ПОЧЕМУ, а не ЧТО (что делает код — видно из кода; почему именно так — знает только автор).\u003c/p>\n\u003cp>\u003cstrong>Одна логика — в одном месте.\u003c/strong> Принцип \u003cbutton class=\"term\" data-t=\"dry\">DRY\u003c/button>: если правило «как сравнивать ответ ученика с правильным» скопировано в три места, однажды поправят одно из трёх — и родится баг «в упражнениях работает, в тренажёре нет». Копипаста — главный сорняк кода, который пишется быстро (а с ИИ — мгновенно). Но есть и обратная ловушка: склеивать РАЗНЫЕ вещи из-за внешней похожести ещё хуже, чем повториться. Правило: повторился второй раз — задумайся, третий — выноси в общее место.\u003c/p>\n\u003cp>\u003cstrong>Предсказуемость.\u003c/strong> Одинаковые вещи делаются одинаково во всём проекте: один способ ходить в базу, один способ показывать ошибки, одна конвенция имён. Скучно? Да. Скучный код — комплимент: его дёшево менять.\u003c/p>\n\u003cp>\u003cstrong>Обработка ошибок.\u003c/strong> Интернет отвалится, ИИ-сервис вернёт мусор, пользователь введёт ерунду — вопрос не «если», а «когда». Разница между «работает» и «хорошо»: что увидит человек в этот момент — белый экран или внятное «не получилось, попробуй ещё раз», и потеряются ли его данные.\u003c/p>\n\u003cp>\u003cstrong>Отсутствие \u003cbutton class=\"term\" data-t=\"dead-code\">мёртвого кода\u003c/button>.\u003c/strong> Остатки переделок — старые экраны, забытые функции — врут каждому читателю: их изучают, боятся сломать, учитывают в решениях. А они мертвы. Находить («кто это импортирует?» — никто) и удалять без жалости: история хранится в гите, вернуть можно всегда.\u003c/p>\n\u003cp>Всё это вместе называется управлением \u003cbutton class=\"term\" data-t=\"tech-debt\">техдолгом\u003c/button>. Срезать углы можно и нужно — скорость тоже ценность; долг становится проблемой, только когда его не замечают и не гасят. Правильный ритм: построил фичу быстро → \u003cbutton class=\"term\" data-t=\"refactoring\">рефакторинг\u003c/button> следом, пока свежо.\u003c/p>\n\u003ch2>Гит: страховка от «ИИ сломал всё»\u003c/h2>\n\u003cp>Прежде чем говорить о качестве, — о выживании. ИИ пишет большие правки за секунды и охотно «улучшает» соседний код, о котором ты не просил. Рано или поздно заход пойдёт не туда и испортит рабочий проект. Единственная настоящая страховка от этого — \u003cbutton class=\"term\" data-t=\"git\">гит\u003c/button>, система контроля версий, и три простых привычки:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Коммить маленькими шагами.\u003c/strong> \u003cbutton class=\"term\" data-t=\"commit\">Коммит\u003c/button> — сохранённая точка, к которой можно вернуться. Работающая фича — коммит. Как этажи с площадками: сорвался — падаешь на этаж, а не в подвал. Один большой коммит раз в неделю — это отсутствие страховки.\u003c/li>\n\u003cli>\u003cstrong>Смотри, ЧТО меняется, до того как принять.\u003c/strong> Прежде чем сказать ИИ «применяй» на большой правке — глянь diff (список изменений). Это тот же приёмочный контроль, что и «спрашивай почему», только для объёма: ИИ мог тронуть то, о чём ты не просил.\u003c/li>\n\u003cli>\u003cstrong>Рискованное — в отдельной \u003cbutton class=\"term\" data-t=\"branch\">ветке\u003c/button>.\u003c/strong> Просишь большой рефакторинг — сделай его в ветке. Получилось — влил; сломал — выбросил ветку целиком, рабочая версия цела.\u003c/li>\n\u003c/ol>\n\u003cp>Без этого новичок живёт в страхе трогать код (вдруг сломается безвозвратно) — а с гитом «сломать» перестаёт быть страшным словом: всегда есть куда откатиться.\u003c/p>\n\u003ch2>Как понять, ПОЧЕМУ не работает\u003c/h2>\n\u003cp>Навык, который отличает «жду, пока ИИ угадает» от «чиню за минуту»: \u003cstrong>дать ИИ точный симптом, а не „не работает“\u003c/strong>. Когда что-то сломалось, не пиши «почини, не работает» — сначала посмотри сам:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Консоль браузера\u003c/strong> (\u003cbutton class=\"term\" data-t=\"devtools\">F12\u003c/button> → Console): красная ошибка с текстом и стек-трейсом — это прямое указание, где и что упало. Скопируй её ИИ целиком.\u003c/li>\n\u003cli>\u003cstrong>Вкладка Network:\u003c/strong> если не грузятся данные — виден упавший запрос (красный, с кодом ошибки). Это отвечает на вопрос «проблема на клиенте или на сервере».\u003c/li>\n\u003c/ul>\n\u003cp>«Вот ошибка из консоли: \u003ccode>TypeError: cannot read 'back' of undefined\u003c/code> в файле X» — и ИИ чинит с первого раза. «Не работают карточки» — и он гадает. Десять секунд на копирование ошибки экономят десять раундов угадывания.\u003c/p>\n\u003cp>И оговорка к правилу «проверяй сборкой»: \u003ccode>npm run build\u003c/code> ловит только опечатки и несовпадения типов. \u003cstrong>Собралось ≠ работает\u003c/strong> — логические и рантайм-ошибки сборка не видит; их ловят тесты (глава 8) и вот эта диагностика.\u003c/p>\n\u003ch2>Как заказчику получать хороший код от ИИ\u003c/h2>\n\u003cp>Практические приёмы — все проверены на Recall:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Не принимай «работает» как критерий.\u003c/strong> После «готово, работает» — второй вопрос: «а теперь посмотри на свой код глазами ревьюера: дубли? мёртвое? имена честные? ошибки обработаны?» ИИ отлично критикует сам себя, если попросить.\u003c/li>\n\u003cli>\u003cstrong>Проси ревью другим агентом.\u003c/strong> Свежая сессия без контекста читает диff, как чужой человек, — и находит то, к чему автор привык. Recall так живёт постоянно: ревью-заходы находили от гонок до дыр безопасности.\u003c/li>\n\u003cli>\u003cstrong>Проверяй сборкой, а не глазами.\u003c/strong> \u003ccode>npm run build\u003c/code> после каждого изменения — типы и синтаксис проверит машина. Это дешевле любого разглядывания.\u003c/li>\n\u003cli>\u003cstrong>Спрашивай «почему».\u003c/strong> «Почему здесь так?» — либо получишь причину (и научишься), либо ИИ сам увидит, что причины нет, и починит. Вопрос «почему» — твой главный инструмент приёмки.\u003c/li>\n\u003cli>\u003cstrong>Заказывай уборку регулярно.\u003c/strong> Раз в несколько фич: «найди дубли и мёртвый код, предложи что вынести в общее». Дом надо подметать.\u003c/li>\n\u003c/ol>\n\u003ch2>Разбор на Recall\u003c/h2>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Формально код очень строгий — и местами образцовый.\u003c/strong> Аудит прогнал поиск по всем «дыркам в перилах»: \u003ccode>any\u003c/code>, \u003ccode>as any\u003c/code>, \u003ccode>@ts-ignore\u003c/code> — \u003cstrong>ноль совпадений\u003c/strong> во всём src/ и api/; строгий режим включён с дополнительными проверками. Три места — образцы, на которых стоит учиться: карта AI-задач (api/_tasks.ts) устроена так, что забыть настроить новую задачу невозможно — сборка не пройдёт; движок упражнений (components/exercises.tsx) описан «размеченным объединением» типов и переиспользуется грамматикой И материалами преподавателя без копипасты; а lib/studyPlan.ts после ответа ИИ прогоняет \u003ccode>sanitize()\u003c/code> — проверяет каждое поле, вычищает выдуманные ИИ идентификаторы. Граница «ИИ → приложение» закрыта по-взрослому.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>Но под строгим фасадом аудит нашёл системную дыру: база данных подключена без типов.\u003c/strong> Клиент Supabase создан без описания схемы (lib/supabase.ts) — и все запросы к базе возвращают «что угодно», которое код молча объявляет нужным типом: \u003ccode>data as Deck\u003c/code>, \u003ccode>data as Card\u003c/code> — \u003cstrong>31 такое место в 11 файлах\u003c/strong>. Если колонку в базе переименуют, проверка типов не заметит НИЧЕГО — поломка всплывёт только у пользователя. Это невидимая копия проблемы \u003ccode>any\u003c/code>: формально его нет, фактически — вся граница с базой без перил. Лечится одной командой генерации типов из схемы. Вторая находка того же сорта: lib/batchWords.ts — единственное место, где ответ ИИ пишется в базу БЕЗ проверки структуры (в отличие от образцового studyPlan): вернёт Gemini мусор — мусор ляжет в карточки пользователя. Обе находки — в журнале исправлений.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout\">\u003cp>💡 \u003cstrong>И классика жанра: «бог-файл».\u003c/strong> Самый большой файл проекта — экран материалов преподавателя: 805 строк, шесть компонентов в одном файле (форма → план → предпросмотр → детали). Он работает — но любая правка одного шага требует держать в голове все шесть. Это не баг, а \u003cbutton class=\"term\" data-t=\"tech-debt\">техдолг\u003c/button> в чистом виде: резать по уже существующим границам дёшево сейчас и дорого потом, когда шаги переплетутся сильнее.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout\">\u003cp>💡 \u003cstrong>Ритм «фича → ревью → уборка» дал измеримый результат.\u003c/strong> За жизнь проекта отдельными заходами прошли: три аудита багов (26 находок), ревью безопасности, пентест, аудиты доступности (155 замечаний → 1). Почти каждый нашёл то, что «работало» — и что стало бы дорогим позже. Урок: качество — не состояние, а регулярная процедура, как уборка.\u003c/p>\u003c/div>\n\u003ch2>Чек-лист для нового проекта\u003c/h2>\n\u003cul>\n\u003cli>Я знаю определение: хороший код = дешёвое следующее изменение, и оцениваю код только так.\u003c/li>\n\u003cli>После каждой фичи ИИ делает самопроверку: дубли, мёртвое, имена, обработка ошибок.\u003c/li>\n\u003cli>Одна логика живёт в одном месте; повторился третий раз — вынес в общее.\u003c/li>\n\u003cli>Ошибки обработаны: пользователь при сбое видит внятное сообщение, данные не теряются.\u003c/li>\n\u003cli>\u003ccode>npm run build\u003c/code> (или аналог) гоняется после каждого изменения.\u003c/li>\n\u003cli>Раз в несколько фич — заход-уборка: мёртвый код удалён, дубли сведены.\u003c/li>\n\u003cli>Я спрашиваю «почему так?» про решения, которые не понимаю.\u003c/li>\n\u003c/ul>\n\u003ch2>Вопросы себе\u003c/h2>\n\u003col>\n\u003cli>Сформулируй главное определение качества кода. Почему «красиво» — не критерий?\u003c/li>\n\u003cli>Чем опасна копипаста логики? А чем опасно преждевременное склеивание разных вещей?\u003c/li>\n\u003cli>Почему мёртвый код вреден, если он «просто лежит и не мешает»?\u003c/li>\n\u003cli>Какие пять приёмов помогают заказчику получать хороший код от ИИ? Какой используешь ты?\u003c/li>\n\u003cli>Что такое техдолг и когда он превращается из инструмента в проблему?\u003c/li>\n\u003c/ol>"},{"n":"6","id":"06","part":"II","title":"Безопасность: двери и замки","html":"\u003ch1>Безопасность: двери и замки\u003c/h1>\n\u003ch2>Дом, в который может войти любой\u003c/h2>\n\u003cp>Дом строителя Б стоит красиво — пока не выясняется, что входная дверь открывается снаружи любым, замок на сейфе нарисован, а ключ от всех комнат лежит под ковриком с надписью «ключ». Жить можно, ровно до первого прохожего с дурными намерениями.\u003c/p>\n\u003cp>В программировании эта дверь незаметнее, чем в доме: приложение выглядит защищённым, ведь на экране есть вход по паролю. Но пароль на входе — это дверь, а безопасность — это ещё стены, замки на каждой комнате и сейф для ценностей. Новичок с ИИ особенно уязвим: ИИ радостно пишет работающий код, и «работает» тут снова обманывает — дырявый в плане безопасности код работает точно так же, как надёжный, до того самого прохожего.\u003c/p>\n\u003cp>Хорошая новость: тебе не нужно знать всё про безопасность. Нужно понять модель угроз своего масштаба и несколько железных правил. Этого хватает, чтобы не оставить дверь нараспашку.\u003c/p>\n\u003ch2>От кого ты защищаешься\u003c/h2>\n\u003cp>\u003cbutton class=\"term\" data-t=\"threat-model\">Модель угроз\u003c/button> — это честный ответ, от кого ты защищаешься. Для маленького продукта это НЕ хакеры из кино. Это три реальных персонажа:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Любопытный пользователь с \u003cbutton class=\"term\" data-t=\"devtools\">F12\u003c/button>.\u003c/strong> Любой посетитель видит весь код твоего фронтенда и все запросы к серверу — и может отправить свой запрос с любыми данными. Не со зла, часто из интереса: «а что будет, если попросить чужие данные / поставить себе роль учителя / оценку 100?»\u003c/li>\n\u003cli>\u003cstrong>Скрипт, выжигающий твои деньги.\u003c/strong> Твой ИИ-сервис платный (или бесплатный с лимитом). Автоматический скрипт, дёргающий его тысячу раз, либо разорит тебя, либо исчерпает лимит для всех настоящих пользователей.\u003c/li>\n\u003cli>\u003cstrong>Жулик, желающий платное бесплатно.\u003c/strong> Как только появляются тарифы, появляется и желающий получить премиум, не заплатив, — накрутить себе план, продлить триал, притвориться учителем.\u003c/li>\n\u003c/ol>\n\u003cp>От этих троих и строится защита. Спецслужбы, промышленный шпионаж, взлом шифрования — не твоя модель угроз на старте, и тратить на них силы — то же самое, что ставить бронедверь в чистом поле.\u003c/p>\n\u003ch2>Железные правила\u003c/h2>\n\u003cp>\u003cstrong>Правило 1: клиенту нельзя верить ни в чём.\u003c/strong> Всё, что приходит из браузера, могло быть подделано через \u003cbutton class=\"term\" data-t=\"devtools\">DevTools\u003c/button> — это фундамент всей веб-безопасности. Из него следует: любую важную проверку делает \u003cbutton class=\"term\" data-t=\"backend\">сервер\u003c/button>, а не фронтенд. Фронтенд может спрятать кнопку «купить» от неоплатившего — для удобства; но РЕШАЕТ, дать ли премиум, только сервер. «Проверили на клиенте» = «не проверили».\u003c/p>\n\u003cp>\u003cstrong>Правило 2: \u003cbutton class=\"term\" data-t=\"secret\">секреты\u003c/button> живут только на сервере.\u003c/strong> Ключ от платного ИИ-сервиса, ключ базы с полным доступом — всё это в код фронтенда попадать не должно НИКОГДА: там оно видно любому. Правильно: фронтенд зовёт свой маленький серверный обработчик, а тот уже ходит к ИИ со спрятанным ключом. Ключ — на сервере, в переменных окружения, вне гита.\u003c/p>\n\u003cp>\u003cstrong>Правило 3: каждый видит только своё.\u003c/strong> В базе должно быть правило, что пользователь читает и меняет только свои строки. В Postgres это \u003cbutton class=\"term\" data-t=\"rls\">RLS\u003c/button> — защита на уровне строк, встроенная в саму базу. Критично, что она в базе, а не в коде приложения: даже запрос напрямую, в обход твоего интерфейса, упрётся в неё.\u003c/p>\n\u003cp>\u003cstrong>Правило 4: чувствительное пишется только через \u003cbutton class=\"term\" data-t=\"rpc\">серверные функции\u003c/button>.\u003c/strong> Тут тонкость, которую легко пропустить (и Recall однажды пропустил): RLS разрешает пользователю писать в СВОЮ строку — но не проверяет, ЧТО он туда пишет. Значит, теоретически можно вписать себе в свою строку оценку «100» или роль «учитель». Поэтому всё ценное — баллы, роли, оплаты — пишется не напрямую, а через серверную функцию, которая внутри проверяет права и правила. А прямую запись в эти поля — запрещают.\u003c/p>\n\u003cp>\u003cstrong>Правило 5: лимиты на всё, что стоит денег.\u003c/strong> Каждый вызов платного сервиса — под счётчиком: сколько раз в час, в день, на пользователя. Без лимита один скрипт (или один зациклившийся баг) сжигает месячную квоту за минуты.\u003c/p>\n\u003cp>\u003cstrong>Правило 6: следи за чужим кодом в своём доме.\u003c/strong> Твой проект исполняет десятки чужих \u003cbutton class=\"term\" data-t=\"dependency\">библиотек\u003c/button>, которые ты не писал и не читал, — а ИИ ставит их пачками не задумываясь. Это тот же периметр безопасности, только снаружи: (а) периодически проверяй их на известные дыры (\u003ccode>npm audit\u003c/code> показывает уязвимые зависимости); (б) не обновляй «мажорные» версии не глядя — обновление патча обычно безопасно, смена крупной версии может сломать половину проекта; (в) коммить lock-файл (фиксирует точные версии, чтобы у тебя и в проде был один и тот же код). Меньше зависимостей — меньше чужих дверей в доме.\u003c/p>\n\u003cp>\u003cstrong>Правило 7: безопасность — это ревизия, а не галочка.\u003c/strong> Дыры находят, специально их выискивая, — своими проверками и чужими глазами (в том числе отдельной сессией ИИ, которой прямо сказано «атакуй это»). Один раз «сделал безопасно» не бывает; бывает «регулярно проверяем».\u003c/p>\n\u003ch2>Разбор на Recall\u003c/h2>\n\u003cp>Безопасность — самая сильная и самая поучительная часть истории Recall: почти все правила выше он узнал НЕ из учебника, а набив шишку. Это делает его честным пособием.\u003c/p>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Правило 2 соблюдено с самого начала.\u003c/strong> Ключ Gemini никогда не был в коде фронта: браузер зовёт свой \u003ccode>/api/gemini\u003c/code>, а тот ходит к Google со спрятанным ключом. Это заложили в фундамент — и правильно, потому что вытащить ключ из фронтенда уже утёкшего приложения нельзя, только менять.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>А вот правила 1 и 4 достались через реальные дыры — и это самое ценное в разборе.\u003c/strong> История, задокументированная в проекте: (а) AI-прокси поначалу был открыт — любой мог звать его без входа и жечь квоту; закрыли токеном. (б) Оценки за работы клиент присылал сам — можно было прислать себе «отлично»; теперь балл считает сервер. (в) Роль «учитель» и план тарифа можно было выставить себе прямой записью в профиль; закрыли запретом на прямую запись этих полей. (г) Код-приглашение учителя утекал ученице целиком вместе с его тарифом — потому что RLS отдаёт строку целиком, а не по колонкам. Каждая дыра — иллюстрация правила, которое без неё звучало бы абстрактно.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>Свежий аудит нашёл новую дыру — и она учит важнейшему нюансу правила 4.\u003c/strong> В базе есть тонкость грантов: когда создаёшь серверную функцию, право её вызывать по умолчанию получают ВСЕ, включая незалогиненных. Написать «разрешить вызов вошедшим» этого не отменяет — такое разрешение только добавляет, убирает лишь явный запрет. Recall закрыл так две функции, но не сделал это правилом. В итоге функция привязки по коду-приглашению учителя вызывается вообще без входа — и отвечает по-разному на верный и неверный код. Это «оракул»: перебором можно нащупать действующие коды учителей, не заходя в приложение. Дыра подтверждена разбором кода (проверка «а вошёл ли вообще пользователь?» в функции отсутствует). Урок для новичка: правило 4 — это не только «пиши через серверные функции», но и «поставь первой строкой каждой такой функции проверку, что вызывающий вообще залогинен, и запрети вызов анониму по умолчанию». Находка — в журнале, помечена как подтверждённая.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>И самое коварное — правило 1 подвело там, где на кону деньги продукта.\u003c/strong> Аудит клиента показал: расписание повторений (когда показать слово снова, сколько раз ошибся) приложение считает В БРАУЗЕРЕ и записывает в базу готовым — база принимает любые числа. То же со стрик-логом: день и тип занятия приходят от клиента. Проверил лично: так и есть. Почему это важнее, чем кажется: именно из этих данных строятся диагностическая карта ученицы и отчёт родителям — то, чем репетитор оправдывает оплату. Ученица через инструменты разработчика может в один запрос «выучить» всю колоду и нарисовать себе идеальный стрик — и отчёт, за который платит родитель, станет враньём, которого никто не заметит. Это ровно правило 1 («клиент считает — сервер проверяет»), просто в таблицах, до которых прошлые проверки не дошли. Плюс отдельная находка про приватность: при выходе из аккаунта на общем телефоне чистится только один кэш из полутора десятков — следующий вошедший видит чужие личные тексты и уровень. Всё — в журнале с пометкой «подтверждено».\u003c/p>\u003c/div>\n\u003cdiv class=\"callout\">\u003cp>💡 \u003cstrong>Ревизия как процесс — правило 7 в действии.\u003c/strong> Recall прошёл ревью безопасности, отдельный пентест (заход 18), и продолжает: этот учебник каждую главу запускает свежий аудит. Находки этого захода — восемь новых, поверх уже закрытых раньше — ушли в журнал docs/findings.md. Урок: даже над многократно проверенным кодом новый внимательный проход находит что-то ещё. Безопасность не «достигается», а поддерживается.\u003c/p>\u003c/div>\n\u003ch2>Чек-лист для нового проекта\u003c/h2>\n\u003cul>\n\u003cli>Я записал свою модель угроз: любопытный с F12, скрипт-выжигатель, жулик за платным. Не абстрактные «хакеры».\u003c/li>\n\u003cli>Ни одного секретного ключа в коде фронтенда — всё на сервере, вне гита.\u003c/li>\n\u003cli>Каждая важная проверка (оплата, права, оценка) — на сервере; клиент только показывает.\u003c/li>\n\u003cli>В базе включена защита на уровне строк: каждый видит только своё, даже в обход интерфейса.\u003c/li>\n\u003cli>Ценные поля (роль, план, баллы) пишутся только через серверные функции; прямая запись запрещена.\u003c/li>\n\u003cli>На каждый платный вызов есть лимит по пользователю и по времени.\u003c/li>\n\u003cli>Я слежу за зависимостями: \u003ccode>npm audit\u003c/code>, не обновляю мажорные версии вслепую, коммичу lock-файл.\u003c/li>\n\u003cli>Я хотя бы раз натравил на свой продукт «атакующую» сессию ИИ и завёл журнал находок.\u003c/li>\n\u003c/ul>\n\u003ch2>Вопросы себе\u003c/h2>\n\u003col>\n\u003cli>Кто три реальных персонажа в модели угроз маленького продукта? Почему «хакеры из кино» — не они?\u003c/li>\n\u003cli>Почему «мы проверили это на клиенте» почти всегда означает «мы не проверили»?\u003c/li>\n\u003cli>RLS даёт каждому доступ к своим строкам. Почему этого НЕ достаточно, чтобы запретить пользователю поставить себе оценку 100 — и что закрывает эту дыру?\u003c/li>\n\u003cli>Почему секретный ключ в коде фронтенда нельзя «просто спрятать поаккуратнее»?\u003c/li>\n\u003cli>Какую дыру Recall иллюстрирует правило «клиенту нельзя верить»? Расскажи своими словами.\u003c/li>\n\u003c/ol>"},{"n":"7","id":"07","part":"II","title":"Данные и база","html":"\u003ch1>Данные и база\u003c/h1>\n\u003ch2>Почему стены переставить легко, а фундамент под ними — нет\u003c/h2>\n\u003cp>Вернёмся к дому. Передвинуть шкаф — минута. Перекрасить стену — вечер. А вот перенести несущую стену, когда на ней уже держатся два этажа, — это проект с риском обрушить всё. В приложении роль несущей стены играют \u003cstrong>данные\u003c/strong>: то, что лежит в базе у живых пользователей.\u003c/p>\n\u003cp>Экран переделать — час: старый выбросил, новый нарисовал, никто не пострадал. А база, в которой уже лежат карточки, прогресс, оплаты сотни людей, так не переделывается. Меняешь её — и должен сохранить всё, что там накопилось, ничего не потеряв и не сломав. Отсюда золотое правило главы: \u003cstrong>данные важнее экранов, и продумывать их надо раньше и тщательнее\u003c/strong>. Ошибку в экране увидишь сразу и починишь; ошибку в структуре данных обнаружишь через полгода, когда исправить её будет стоить как ту самую несущую стену.\u003c/p>\n\u003ch2>Схема — это чертёж данных\u003c/h2>\n\u003cp>Схема базы — это описание всех «ящиков» (таблиц) и что в каждом лежит: таблица пользователей, таблица карточек, таблица оплат. У каждой таблицы — колонки (поля) с типами: имя — текст, дата рождения — дата, оплачено ли — да/нет.\u003c/p>\n\u003cp>Два принципа, которые отличают продуманную схему от свалки:\u003c/p>\n\u003cp>\u003cstrong>Одна вещь — в одном месте.\u003c/strong> Уровень языка пользователя хранится в одной колонке одной таблицы, а не переписывается в пяти местах. Иначе однажды обновишь одно из пяти — и данные начнут противоречить сами себе (та же болезнь дублей, что в коде, но опаснее: код чинится, разъехавшиеся данные — нет).\u003c/p>\n\u003cp>\u003cstrong>Связи охраняет \u003cbutton class=\"term\" data-t=\"foreign-key\">сама база\u003c/button>.\u003c/strong> Карточка принадлежит колоде — и база следит, чтобы не осталось карточки без колоды. Это \u003cbutton class=\"term\" data-t=\"foreign-key\">внешний ключ\u003c/button>. Его продолжение — каскадное удаление: удалил колоду, и все её карточки ушли следом автоматически, сирот не осталось. База умеет охранять целостность лучше любого твоего кода — надо только ей это поручить, описав связи.\u003c/p>\n\u003cp>Ещё одна часть продуманной схемы — \u003cstrong>скорость на объёме\u003c/strong>. Пока в таблице 10 строк, любой запрос мгновенен; на десяти тысячах строк база начинает перечитывать всю таблицу, и экран висит. Лечит это \u003cbutton class=\"term\" data-t=\"db-index\">индекс\u003c/button> — «алфавитный указатель» на колонки, по которым часто ищут, фильтруют или сортируют (у кого какой пользователь, за какой день). Родственная утечка скорости живёт в коде: \u003cbutton class=\"term\" data-t=\"n-plus-1\">лишние запросы\u003c/button> — когда вместо «взять всё разом» код ходит в базу по разу на каждый элемент. И то, и другое незаметно на тесте с тремя строками и больно у живого пользователя со ста — поэтому «работает медленно» это тот же «работает, но плохо» из главы про код, только про скорость.\u003c/p>\n\u003cp>Важное следствие для вайб-кодера: \u003cstrong>схема — источник правды о данных, и она должна быть в одном файле\u003c/strong>, который ты заливаешь в базу. Не «накликал колонок мышкой в панели и забыл», а записанный скрипт схемы, по которому базу можно воссоздать с нуля. У этого скрипта есть чудесное свойство — \u003cbutton class=\"term\" data-t=\"idempotent\">идемпотентность\u003c/button>: он написан так, что его можно залить повторно, и он не сломает существующее, а лишь досоздаст недостающее. Это твоя страховка и твоя документация одновременно.\u003c/p>\n\u003ch2>Изменения на живых данных: миграции\u003c/h2>\n\u003cp>Рано или поздно схему нужно поменять: добавить колонку «тариф», новую таблицу «квесты». На пустой базе — тривиально. На базе с живыми данными это называется \u003cbutton class=\"term\" data-t=\"migration\">миграция\u003c/button>, и здесь свои правила:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Только добавлять безопасно.\u003c/strong> Новая колонка со значением по умолчанию, новая таблица — почти безвредны. А вот удалить или переименовать колонку, в которой лежат данные, — операция с риском потери; трижды подумай.\u003c/li>\n\u003cli>\u003cstrong>Сначала база, потом код.\u003c/strong> Если новый код зовёт колонку, которой в базе ещё нет, — всё падает. Поэтому порядок жёсткий: сперва миграция в базе, потом выкладка кода, который на неё рассчитывает. (Recall набил на этом шишку — об это
