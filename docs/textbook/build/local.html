м ниже.)\u003c/li>\n\u003cli>\u003cstrong>\u003cbutton class=\"term\" data-t=\"backup\">Бэкап\u003c/button> перед серьёзной миграцией — не паранойя, а норма.\u003c/strong> И проверенный бэкап: копия, из которой ты ни разу не восстанавливался, — не бэкап, а надежда.\u003c/li>\n\u003c/ul>\n\u003ch2>Всё или ничего: транзакции\u003c/h2>\n\u003cp>Представь: учитель заменяет ученице программу обучения. Это два шага — убрать старую, поставить новую. Что если между ними оборвётся связь? Старой уже нет, новой ещё нет — ученица осталась без программы. Разорванное состояние.\u003c/p>\n\u003cp>Лечит это \u003cbutton class=\"term\" data-t=\"transaction\">транзакция\u003c/button>: группа операций «всё или ничего». Оба шага выполняются как одно целое; сорвалось на середине — откатывается всё, будто и не начинали. Правило простое: \u003cstrong>если осмысленность данных требует, чтобы несколько изменений случились вместе, — заворачивай их в транзакцию\u003c/strong>. Перевод денег, замена связанных записей, создание объекта с зависимостями — всё это «всё или ничего».\u003c/p>\n\u003cp>Родственная беда — \u003cbutton class=\"term\" data-t=\"race\">гонка\u003c/button>: два запроса выполняются одновременно и мешают друг другу (оба увидели «использовано 4 из 5», оба прошли, стало 6). Гонки не видны в ручных тестах — только под параллельной нагрузкой; лечатся блокировками, которые выстраивают одновременные запросы в очередь.\u003c/p>\n\u003ch2>Разбор на Recall\u003c/h2>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Схема живёт правильно: один идемпотентный файл — источник правды.\u003c/strong> Вся база Recall описана в docs/schema.sql: таблицы, связи, права, серверные функции — один файл, заливается целиком и повторно без вреда. Перед заливкой гоняется проверочный скрипт (check-schema.mjs). Это ровно то, как надо: базу можно воссоздать с нуля, а сам файл служит документацией. Связи и каскады расставлены — удаление пользователя каскадом уносит его колоды, карточки, расписание, не оставляя мусора.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Транзакции и блокировки появились там, где данные могли разъехаться — и это зрелость.\u003c/strong> Замена программы обучения обёрнута в транзакцию (одна серверная функция: архивировать старую + вставить новую — «всё или ничего»); выдача набора слов ученице — тоже (колода + карточки + назначение атомарно, иначе при обрыве плодились колоды-сироты). Гонки квоты и привязки к учителю закрыты блокировками. Всё это — не изначально, а по итогам ревью: реальные баги «данные в разорванном состоянии» нашли и вылечили правильным инструментом.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>Но аудит этого захода поймал недосмотр того же класса — и это отличный урок.\u003c/strong> Правильный приём (запретить прямую запись в таблицу, разрешив только через серверную функцию с транзакцией) Recall применил к нескольким таблицам — и забыл про таблицу программ обучения. То есть транзакционная функция для неё написана, но НЕ обязательна: старый код или прямой запрос всё ещё может сделать два шага порознь и вернуть ту самую дыру, которую функцию писали закрыть. Урок: приём защищает, только если ЗАКРЫТ обходной путь; «сделали правильную функцию» и «запретили делать неправильно» — два разных дела, и второе забывается чаще. (В журнале.)\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>И ещё про «сначала база, потом код».\u003c/strong> В истории Recall это записано отдельным правилом, выстраданным на практике: если запушить код, который зовёт новую серверную функцию, ДО того как выполнил миграцию в базе, — приложение падает, потому что функции ещё нет. Поэтому в проекте железный порядок: сначала залить schema.sql в базу, потом пушить код. Нарушишь — прод лежит.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout\">\u003cp>💡 \u003cstrong>Осознанный мёртвый груз: таблица, которую забыли.\u003c/strong> В схеме есть таблица content_items — задумывалась под тексты для чтения, но контент переехал в статические файлы, и таблица не используется ничем. Она честно помечена «устарело», но живёт в схеме. Мелочь — но иллюстрация: данные накапливают свой \u003cbutton class=\"term\" data-t=\"dead-code\">мёртвый код\u003c/button> так же, как программный, и его так же стоит вычищать, чтобы схема не врала о том, что в проекте важно.\u003c/p>\u003c/div>\n\u003ch2>Чек-лист для нового проекта\u003c/h2>\n\u003cul>\n\u003cli>Структуру данных я продумал раньше и тщательнее, чем экраны, — её дороже всего менять потом.\u003c/li>\n\u003cli>Схема базы — в одном идемпотентном файле-скрипте, а не «накликана мышкой».\u003c/li>\n\u003cli>Одна сущность хранится в одном месте; связи между таблицами описаны внешними ключами.\u003c/li>\n\u003cli>Миграции: только добавлять безопасно; сначала база, потом код; бэкап перед серьёзной.\u003c/li>\n\u003cli>У меня есть бэкап, и я хотя бы раз пробовал из него восстановиться.\u003c/li>\n\u003cli>Изменения, которые обязаны случиться вместе, завёрнуты в транзакцию «всё или ничего».\u003c/li>\n\u003cli>Где данные пишутся только через серверную функцию — прямая запись в эти таблицы запрещена (иначе функция необязательна).\u003c/li>\n\u003c/ul>\n\u003ch2>Вопросы себе\u003c/h2>\n\u003col>\n\u003cli>Почему «данные важнее экранов»? Что дешевле переделать — экран или структуру таблицы, и почему?\u003c/li>\n\u003cli>Что такое внешний ключ и каскадное удаление? Какую работу они снимают с твоего кода?\u003c/li>\n\u003cli>Зачем схему держать в одном идемпотентном файле, а не настраивать базу мышкой в панели?\u003c/li>\n\u003cli>Приведи пример операции, которую обязательно заворачивать в транзакцию, и объясни, чем грозит обрыв на середине без неё.\u003c/li>\n\u003cli>Recall написал транзакционную функцию для программ обучения, но дыра осталась. Почему? Чего не хватило?\u003c/li>\n\u003c/ol>"},{"n":"8","id":"08","part":"II","title":"Тесты и ревью","html":"\u003ch1>Тесты и ревью\u003c/h1>\n\u003ch2>Осмотр перед заселением\u003c/h2>\n\u003cp>Дом достроен. Прежде чем въезжать, хороший строитель проходит его с осмотром: включает каждый кран, щёлкает каждым выключателем, проверяет, держат ли перила, не течёт ли крыша под шлангом. Не потому что не доверяет себе — а потому что дешевле найти протечку сейчас, чем когда мебель уже расставлена.\u003c/p>\n\u003cp>Тесты в программировании — это тот самый осмотр, только автоматический и повторяемый. Их главная ценность не в том, чтобы «проверить, что работает сегодня» (это ты и руками увидишь), а в том, чтобы \u003cstrong>ловить \u003cbutton class=\"term\" data-t=\"regression\">регрессию\u003c/button> — когда новое изменение ломает то, что раньше работало\u003c/strong>. Это ошибка номер один растущего проекта: чинишь одно — незаметно ломаешь другое. С ИИ регрессия особенно коварна: он с радостью «улучшит» соседний код, о котором ты не просил, и ты об этом не узнаешь — пока не узнает пользователь.\u003c/p>\n\u003cp>Тест — это записанный однажды осмотр, который можно прогнать за секунды сколько угодно раз. Без него каждое изменение — это ставка «вроде ничего не сломал».\u003c/p>\n\u003ch2>Виды осмотра: от детали до всего дома\u003c/h2>\n\u003cp>Тесты бывают разной глубины, и у каждого своя работа:\u003c/p>\n\u003cp>\u003cstrong>\u003cbutton class=\"term\" data-t=\"unit-test\">Юнит-тест\u003c/button>\u003c/strong> проверяет одну деталь в изоляции: дал функции вход — сверил выход. «Калькулятор: 2+2 должно быть 4». Быстрый, точный, показывает пальцем на сломанное место. Идеален для чистой логики: подсчёт баллов, расписание повторений, сборка плана дня.\u003c/p>\n\u003cp>\u003cstrong>\u003cbutton class=\"term\" data-t=\"integration-test\">Интеграционный тест\u003c/button>\u003c/strong> проверяет, что части работают ВМЕСТЕ: код + база + права доступа. Медленнее, но ловит то, чего юнит не видит, — например, что защита базы реально не пускает чужого к твоим данным. В Recall это \u003cbutton class=\"term\" data-t=\"smoke-test\">смоуки\u003c/button>: скрипт заводит тестовый аккаунт, проходит сценарий, удаляет его.\u003c/p>\n\u003cp>\u003cstrong>\u003cbutton class=\"term\" data-t=\"e2e\">E2E-тест\u003c/button>\u003c/strong> («из конца в конец») проходит весь путь пользователя как живой человек в настоящем браузере: открыл экран, нажал, проверил результат. Самый близкий к жизни и самый медленный.\u003c/p>\n\u003cp>Мудрость не в том, чтобы писать все три на всё. Мудрость — \u003cstrong>тестировать дорогое, а не всё подряд\u003c/strong>. \u003cbutton class=\"term\" data-t=\"coverage\">Покрытие\u003c/button> 100% никому не нужно и недостижимо. Нужно покрыть то, где баг стоит дороже всего: деньги, безопасность, данные пользователей. Опечатку в подписи кнопки поймает и глаз; дыру, через которую ученица подделывает оплату, — только тест, специально это проверяющий.\u003c/p>\n\u003ch2>Чего тесты в принципе не ловят\u003c/h2>\n\u003cp>Честная глава — это и про границы метода. Даже зелёные тесты НЕ гарантируют:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Что продукт нужен людям\u003c/strong> (это глава 2, а не тест);\u003c/li>\n\u003cli>\u003cstrong>Смысловое качество ответа ИИ\u003c/strong> — тест проверит, что ответ ПРИШЁЛ и по форме верный, но не что он умный и по делу; это проверяется живым прогоном и глазами;\u003c/li>\n\u003cli>\u003cstrong>Красоту и удобство\u003c/strong> — визуальные баги, кривые отступы, «неудобно» ловит только человек (и частично автоматический аудит верстки);\u003c/li>\n\u003cli>\u003cstrong>\u003cbutton class=\"term\" data-t=\"edge-case\">Крайние случаи\u003c/button>, про которые ты не подумал\u003c/strong> — тест проверяет то, что ты в него заложил; про пустой список из нуля элементов ты либо вспомнил, либо нет.\u003c/li>\n\u003c/ul>\n\u003cp>Поэтому тесты — не замена внимательности, а её усилитель: они держат уже проверенное проверенным, освобождая твоё внимание для нового.\u003c/p>\n\u003ch2>Ревью: вторая пара глаз\u003c/h2>\n\u003cp>Тесты проверяют, что код ДЕЛАЕТ; \u003cstrong>ревью\u003c/strong> проверяет, как он сделан, и находит то, для чего теста ещё нет. Классически ревью — это когда твой код читает другой человек перед тем, как он попадёт в проект. У вайб-кодера-одиночки людей нет — но есть приём мощнее, чем кажется: \u003cstrong>свежая сессия ИИ, которой прямо сказано „ты придирчивый ревьюер, найди, что сломается или что оставили открытым“\u003c/strong>.\u003c/p>\n\u003cp>Работает это потому, что автор кода (и человек, и И, который его писал) слеп к собственным допущениям. Другой И, читающий диф без этого контекста, видит его как чужой — и находит гонки, дыры, забытые случаи. В этом учебнике так проверялась каждая находка безопасности: один агент искал, другой пытался опровергнуть.\u003c/p>\n\u003cp>Практика на каждый заход:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Проверяй сборкой\u003c/strong> после каждого изменения — самый дешёвый тест, ловит опечатки и несовпадения типов за секунды.\u003c/li>\n\u003cli>\u003cstrong>Прогоняй смоуки, которые задевает изменение\u003c/strong> — не все, а относящиеся.\u003c/li>\n\u003cli>\u003cstrong>Раз в несколько заходов — ревью-проход\u003c/strong>: свежий агент атакует твой диф.\u003c/li>\n\u003cli>\u003cstrong>Флаки-тесты чини или удаляй.\u003c/strong> \u003cbutton class=\"term\" data-t=\"flaky\">Тест, который мигает\u003c/button> без причины, приучает игнорировать красное — и однажды пропустишь настоящую поломку.\u003c/li>\n\u003c/ol>\n\u003ch2>Разбор на Recall\u003c/h2>\n\u003cp>Тестирование — сильная сторона Recall, и это видно по тому, как часто тесты ловили реальное.\u003c/p>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Смоуки — станок безопасности проекта.\u003c/strong> Почти каждая teacher-фича имеет смоук, проверяющий не «работает ли кнопка», а инварианты доступа: чужой не читает, экс-учитель после отвязки теряет доступ, подделка балла отклонена. Именно смоук поймал, что серверный revoke не закрывал анонима (тот самый урок из главы 6), и подтвердил, что закрыл после фикса. Это интеграционные тесты в лучшем виде: они проверяют то, чего на глаз не увидишь.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Чистая логика вынесена и покрыта юнитами.\u003c/strong> Подсчёт баллов, план дня, динамика за месяц, обманки в играх — вынесены в отдельные «чистые» модули без базы и покрыты быстрыми node-тестами. Когда в этом заходе включали строгую проверку границ массивов, именно эти 5 юнит-тестов за секунды подтвердили, что логика не поехала. Дешёвая уверенность.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>А вот карта покрытия этого захода показала честные дыры — и они закономерны.\u003c/strong> Аудит сопоставил тесты с фичами: плотно покрыто дешёвое-в-написании и опасное (права доступа, квоты, чистая логика), а слабо — то, что тестировать ТРУДНО. Без единого автотеста: генерация материалов и программы обучения от ИИ (платная модель, сложный ответ уходит ученице — проверялось только «живым прогоном руками»), распознавание речи, биллинг и админка (реальные деньги!), смысл переписки в квестах. И показательная находка: \u003ccode>answerMatches\u003c/code> — единственная точка, где сверяется КАЖДЫЙ ответ ученика (грамматика, глаголы, задания, баллы), — не имеет ни одного юнит-теста, хотя баг в ней тихо исказил бы баллы разом по всему продукту. Урок ровно из этой главы: непокрытым остаётся не случайное, а ТРУДНОЕ — ИИ-ответы, деньги, речь. Именно там и надо сознательно достраивать проверки в первую очередь. (Дыры — в журнале docs/findings.md.)\u003c/p>\u003c/div>\n\u003cdiv class=\"callout\">\u003cp>💡 \u003cstrong>Ревью как процесс — не одноразовое действие.\u003c/strong> За жизнь Recall: три захода аудита багов, ревью безопасности, пентест, и этот учебник, каждую главу запускающий свежий аудит по своей теме. Почти каждый находил то, что «работало». Урок главы: качество — это не состояние «протестировано», а привычка регулярно натравливать на свой код свежие внимательные глаза, в том числе искусственные.\u003c/p>\u003c/div>\n\u003ch2>Чек-лист для нового проекта\u003c/h2>\n\u003cul>\n\u003cli>Я понимаю: главная работа тестов — ловить регрессию, а не «проверить сегодня».\u003c/li>\n\u003cli>Дорогое (деньги, безопасность, данные) покрыто тестом; на дешёвое трачусь по минимуму.\u003c/li>\n\u003cli>Чистую логику я выношу в отдельные функции и покрываю быстрыми юнитами.\u003c/li>\n\u003cli>Сборка гоняется после каждого изменения; относящиеся смоуки — после каждой фичи.\u003c/li>\n\u003cli>Раз в несколько заходов свежая сессия ИИ ревьюит мой диф как придирчивый чужой.\u003c/li>\n\u003cli>Я помню, чего тесты не ловят (смысл ИИ-ответа, красоту, спрос) — и проверяю это иначе.\u003c/li>\n\u003cli>Флаки-тесты я чиню или удаляю, а не привыкаю к мигающему красному.\u003c/li>\n\u003c/ul>\n\u003ch2>Вопросы себе\u003c/h2>\n\u003col>\n\u003cli>Почему главная ценность теста — ловить регрессию, а не «проверить, что работает сейчас»?\u003c/li>\n\u003cli>Чем юнит-тест отличается от интеграционного? Что из них поймало бы дыру «чужой читает мои данные»?\u003c/li>\n\u003cli>«Тестируй дорогое, а не всё» — как решить, что дорогое? Приведи пример из своего проекта.\u003c/li>\n\u003cli>Почему свежая сессия ИИ находит в твоём коде то, что не видит сессия-автор?\u003c/li>\n\u003cli>Назови три вещи, которые зелёные тесты НЕ гарантируют.\u003c/li>\n\u003c/ol>"},{"n":"9","id":"09","part":"II","title":"Дизайн и UX","html":"\u003ch1>Дизайн и UX\u003c/h1>\n\u003ch2>Фасад, в котором удобно жить\u003c/h2>\n\u003cp>Дом строителя А красив не потому, что на фасаде лепнина. Он красив потому, что в нём ПРОДУМАНО: свет падает куда надо, дверные ручки на нужной высоте, дорожка ведёт ко входу сама собой. Гость не разглядывает фасад — он просто чувствует «здесь хорошо» и не понимает почему. Это и есть цель дизайна: не украсить, а сделать так, чтобы человеку было \u003cstrong>понятно и удобно\u003c/strong>, и он этого даже не заметил.\u003c/p>\n\u003cp>Здесь живёт ловушка, обратная всем прошлым главам. Раньше опасность была «работает, но криво внутри». В дизайне опасность зеркальная: \u003cstrong>красиво в макете, но неудобно в руках\u003c/strong>. Вайб-кодер с ИИ легко получает «красивую картинку» — ИИ отлично рисует модные экраны. Но картинка на дизайнерском сайте и продукт, которым пользуются пальцем на солнце одной рукой, — разные вещи.\u003c/p>\n\u003cp>Ключевое различие, которое надо развести в голове: \u003cstrong>\u003cbutton class=\"term\" data-t=\"ui\">UI\u003c/button> — как выглядит; \u003cbutton class=\"term\" data-t=\"ux\">UX\u003c/button> — как работает\u003c/strong>. Красивый UI с плохим UX — это красивая дверь, которая открывается не в ту сторону. Дизайн — это в первую очередь UX, и только потом красота.\u003c/p>\n\u003ch2>Система вместо покраски\u003c/h2>\n\u003cp>Первое правило дизайна для одиночки с ИИ: \u003cstrong>не крась кнопки по одной — построй систему\u003c/strong>. Разница как между «подобрать краску для каждой стены отдельно» и «выбрать палитру дома». Система — это \u003cbutton class=\"term\" data-t=\"design-system\">дизайн-система\u003c/button>: цвета, шрифты, отступы, вид кнопок и карточек, описанные ОДИН раз и переиспользуемые везде.\u003c/p>\n\u003cp>Технически это делается через \u003cstrong>токены\u003c/strong> — переменные вроде «основной цвет», «цвет фона», «крупный отступ». В коде ты пишешь не «синий #3B82F6», а «основной цвет»; поменял значение токена в одном месте — перекрасился весь продукт согласованно. Без токенов каждый экран красится вручную, оттенки разъезжаются, и через месяц продукт выглядит собранным из кусков.\u003c/p>\n\u003cp>Для работы с ИИ система даёт то же, что чертёж из главы про фундамент: \u003cstrong>общий язык между сессиями\u003c/strong>. «Сделай экран по нашим токенам, кнопки — наш компонент Button» — и десятый экран выглядит как первый. Без системы каждая сессия изобретает свои цвета, и получается лоскутное одеяло — но уже визуальное.\u003c/p>\n\u003ch2>Невидимое правило: \u003cbutton class=\"term\" data-t=\"design-consistency\">согласованность\u003c/button>\u003c/h2>\n\u003cp>Хороший интерфейс \u003cstrong>предсказуем\u003c/strong>: одинаковые вещи выглядят и ведут себя одинаково по всему продукту. Кнопка «назад» всегда в одном месте, «сохранить» всегда одного цвета, ошибки всегда показываются одинаково. Пользователь один раз научился — и дальше всё узнаёт без раздумий.\u003c/p>\n\u003cp>Непоследовательность утомляет незаметно: тут кнопка слева, там справа; здесь «Удалить» красная, там серая. Каждое такое различие — микро-заминка, человек тратит долю секунды на «а это то же самое?». По отдельности мелочь, вместе — ощущение «неудобно», причину которого пользователь даже не сформулирует.\u003c/p>\n\u003ch2>Доступность — это не «для инвалидов»\u003c/h2>\n\u003cp>Самая недооценённая часть дизайна — \u003cstrong>\u003cbutton class=\"term\" data-t=\"a11y\">доступность\u003c/button>\u003c/strong>. Звучит как «для людей с ограничениями», но на деле это про ВСЕХ в неудобных условиях: на ярком солнце, уставшими глазами вечером, одной рукой в транспорте, с треснувшим экраном. Три вещи, которые проверяются числом, а не «на глаз»:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>\u003cbutton class=\"term\" data-t=\"contrast\">Контраст\u003c/button>\u003c/strong> текста к фону. Бледно-серый текст на белом красив в макете и нечитаем на солнце. Есть измеримая норма (обычно 4.5:1) — её можно посчитать, а не спорить.\u003c/li>\n\u003cli>\u003cstrong>\u003cbutton class=\"term\" data-t=\"touch-target\">Размер тач-целей\u003c/button>.\u003c/strong> Кнопка должна ловить палец: не меньше ~44×44 пикселей кликабельной зоны. Визуально элемент может быть мелким — важна область вокруг.\u003c/li>\n\u003cli>\u003cstrong>Подписи к полям.\u003c/strong> Каждое поле ввода связано со своей подписью, чтобы было понятно, что вводить.\u003c/li>\n\u003c/ul>\n\u003cp>Прелесть в том, что всё это \u003cstrong>измеримо\u003c/strong>: можно написать скрипт, который обойдёт экраны и замерит контраст и размеры в реальных пикселях — и споры «нормально/ненормально» заменятся числом.\u003c/p>\n\u003ch2>И ещё: \u003cbutton class=\"term\" data-t=\"responsive\">адаптивность\u003c/button> и честная обратная связь\u003c/h2>\n\u003cp>\u003cstrong>Адаптивность\u003c/strong> — интерфейс подстраивается под экран: на телефоне одна колонка, на компе шире, ничего не вылезает за край и не требует горизонтальной прокрутки. Делается гибкой сеткой и относительными размерами, а не фиксированными пикселями.\u003c/p>\n\u003cp>\u003cstrong>Обратная связь\u003c/strong> — интерфейс всегда отвечает на действие: нажал — кнопка отозвалась, идёт загрузка — виден индикатор, случилась ошибка — понятное сообщение, а не тишина. Молчащий интерфейс заставляет гадать «нажалось или нет?» и жать повторно. И \u003cbutton class=\"term\" data-t=\"affordance\">аффорданс\u003c/button>: по виду элемента должно быть понятно, что с ним делать, — кнопка выглядит нажимаемой, поле заполняемым.\u003c/p>\n\u003cp>И третье, самое забываемое состояние экрана — \u003cstrong>\u003cbutton class=\"term\" data-t=\"empty-state\">пустое\u003c/button>\u003c/strong>. Ты всегда разрабатываешь на заполненном экране (сам же что-то добавил), а первый живой пользователь видит НОЛЬ: пустую колоду, ноль карточек, «заданий нет». Загрузку и ошибку помнят все; пустой экран без единой подсказки «что делать дальше» — предсказуемо испорченное первое впечатление. У каждого списка спроектируй, как он выглядит пустым, и что там написано вместо тишины: «Добавь первое слово →».\u003c/p>\n\u003ch2>Разбор на Recall\u003c/h2>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Дизайн-система есть, и она настоящая.\u003c/strong> Redizайн «Nocturne» построен на токенах (\u003ccode>--night-*\u003c/code> в одном файле), общих компонентах (\u003ccode>Button\u003c/code>, \u003ccode>Card\u003c/code>, \u003ccode>RowCard\u003c/code> — база всех списков), едином шрифте и наборе иконок. Поэтому 26 экранов выглядят «одной рукой»: новый экран собирается из готовых кирпичей и автоматически согласован. Это разница между системой и покраской по одной кнопке.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Доступность проверяется числом, а не мнением.\u003c/strong> В проекте есть скрипт (\u003ccode>scripts/ux-audit.mjs\u003c/code>), который обходит 15+ экранов в реальном браузере и ЗАМЕРЯЕТ контраст и размеры тач-целей. Однажды он нашёл 155 нарушений — и это не абстракция: токены вторичного текста давали контраст 3.57:1 и даже 2.08:1 при норме 4.5. Их пересчитали под реальный фон до 8.4:1 и 5.3:1; десятки мелких кнопок расширили до 44px. Стало 155 → 1. Прогон ux-audit в ЭТОМ заходе — снова чисто (0 замечаний; единственное исключение — отдельные слова предложения на экране «Речь», сделанные тапаемыми для шэдоуинга: инлайн-слово не может быть 44px, это допустимое исключение стандарта). Урок: доступность — не вкусовщина, а измеримая величина, и её стоит гонять скриптом после правок вёрстки.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>Но у автоматической проверки есть честная граница.\u003c/strong> ux-audit меряет ровно два числа — контраст и размер. Он НЕ видит сломанную вёрстку, наложение элементов, кривые отступы, битую анимацию — это ловит только человеческий глаз (в Recall — скриншотами после редизайна). И весь автоматический осмотр идёт через один браузер на одном размере экрана; специфику iPhone/Safari он не покрывает — а она в истории проекта уже минимум раз давала реальный баг (обновления приложения неделями не доезжали до айфонов). Урок из прошлой главы, повторённый здесь: измеримое — измеряй числом, но помни, что глаз и живое устройство измеримым не заменить.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout\">\u003cp>💡 \u003cstrong>Насмотренность и здесь — фундамент.\u003c/strong> Nocturne не выдумывался с чистого листа: был готовый макет-референс (глава 1!), по которому строили токены и экраны. Дизайн-система получилась цельной именно потому, что сначала нашли, КАК должно выглядеть, а потом системно это закодировали. Круг замкнулся: хороший дизайн начинается с насмотренности и заканчивается системой.\u003c/p>\u003c/div>\n\u003ch2>Чек-лист для нового проекта\u003c/h2>\n\u003cul>\n\u003cli>Я развожу UI (как выглядит) и UX (как работает) и помню, что дизайн — сначала про удобство.\u003c/li>\n\u003cli>У меня есть дизайн-система на токенах, а не покраска каждого экрана вручную.\u003c/li>\n\u003cli>Одинаковые вещи выглядят и ведут себя одинаково во всём продукте.\u003c/li>\n\u003cli>Контраст текста и размер тач-целей (≥44px) я проверяю числом (скриптом), а не на глаз.\u003c/li>\n\u003cli>Интерфейс адаптивен: на телефоне ничего не вылезает и не требует горизонтальной прокрутки.\u003c/li>\n\u003cli>На каждое действие есть отклик: загрузка, успех, понятная ошибка — не тишина.\u003c/li>\n\u003cli>Автопроверку контраста/целей я дополняю осмотром глазами и на реальном телефоне.\u003c/li>\n\u003c/ul>\n\u003ch2>Вопросы себе\u003c/h2>\n\u003col>\n\u003cli>В чём разница UI и UX? Приведи пример «красиво, но неудобно».\u003c/li>\n\u003cli>Чем дизайн-система на токенах лучше покраски каждого экрана? Что общего у неё с чертежом из главы про фундамент?\u003c/li>\n\u003cli>Почему доступность — это «для всех», а не «для людей с ограничениями»? Назови две вещи, которые измеряются числом.\u003c/li>\n\u003cli>Что автоматический аудит верстки НЕ поймает? Чем это надо дополнять?\u003c/li>\n\u003cli>Как насмотренность (глава 1) связана с дизайн-системой (эта глава)?\u003c/li>\n\u003c/ol>"},{"n":"10","id":"10","part":"III","title":"Карта сервисов: поставщики, тарифы, выбор","html":"\u003ch1>Карта сервисов: поставщики, тарифы, выбор\u003c/h1>\n\u003ch2>Дом собирают из чужих материалов\u003c/h2>\n\u003cp>Ни один строитель не варит сталь и не обжигает кирпич сам — он покупает готовые материалы и ставит готовые окна. Умение строителя не в том, чтобы всё делать с нуля, а в том, чтобы знать, ГДЕ брать хорошее и недорогое, и как это стыкуется.\u003c/p>\n\u003cp>В веб-продукте роль материалов и подрядчиков играют \u003cstrong>сервисы\u003c/strong>: \u003cbutton class=\"term\" data-t=\"hosting\">хостинг\u003c/button> держит продукт в сети, \u003cbutton class=\"term\" data-t=\"baas\">база\u003c/button> хранит данные и пускает по паролю, ИИ-сервис отвечает на запросы, платёжный принимает деньги. Ты их не пишешь — арендуешь готовыми. Это продолжение правила из главы про фундамент: \u003cstrong>всё, что не суть продукта, — арендуй, а не строй\u003c/strong>. Суть Recall — методика изучения языков; вход по паролю, рассылка, хранилище — чужие материалы.\u003c/p>\n\u003cp>Эта глава — карта таких материалов: какие бывают, сколько стоят, где у бесплатного потолок и по каким признакам выбирать. Для одиночки с ИИ это не «скучная закупка», а решения, от которых зависит, взлетит ли продукт за ноль денег и не упрётся ли в стену на сотом пользователе.\u003c/p>\n\u003ch2>Слои сервисов: кто за что\u003c/h2>\n\u003cp>Продукт собирается из нескольких слоёв, и на каждом — свои популярные поставщики:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Хостинг\u003c/strong> — где живёт продукт и раздаётся пользователям. Обычно с \u003cbutton class=\"term\" data-t=\"cdn\">CDN\u003c/button> (быстро по всему миру) и \u003cbutton class=\"term\" data-t=\"serverless\">serverless\u003c/button> (кусочки серверного кода без аренды целого сервера). Варианты: Vercel, Netlify, Cloudflare Pages.\u003c/li>\n\u003cli>\u003cstrong>База + вход\u003c/strong> — хранение данных и авторизация. Проще всего взять \u003cbutton class=\"term\" data-t=\"baas\">BaaS\u003c/button> (готовый бэкенд): Supabase, Firebase. Он же обычно даёт права доступа (\u003cbutton class=\"term\" data-t=\"rls\">RLS\u003c/button>).\u003c/li>\n\u003cli>\u003cstrong>ИИ\u003c/strong> — генерация, перевод, распознавание. Google Gemini, OpenAI, Anthropic, Groq. У каждого свои модели, цены и бесплатные пределы.\u003c/li>\n\u003cli>\u003cstrong>Вспомогательные\u003c/strong> — по потребности: словарь (Free Dictionary), \u003cbutton class=\"term\" data-t=\"analytics\">аналитика\u003c/button> посещений (Vercel Analytics, Plausible), почтовые рассылки (Resend), платежи (Stripe, а в Казахстане — Kaspi вручную), \u003cbutton class=\"term\" data-t=\"error-tracking\">сбор ошибок\u003c/button> (Sentry).\u003c/li>\n\u003c/ul>\n\u003cp>Правило склейки: \u003cstrong>бери сервисы одного «мира», которые дружат из коробки\u003c/strong>. Vercel + Supabase стыкуются в пару кликов — это экономит дни. Экзотическая связка «модный хостинг + редкая база» может потребовать возни, которую ИИ тоже плохо знает.\u003c/p>\n\u003ch2>Бесплатные тарифы: где потолок\u003c/h2>\n\u003cp>Магия старта в том, что почти всё это имеет \u003cstrong>\u003cbutton class=\"term\" data-t=\"free-tier\">бесплатный тариф\u003c/button>\u003c/strong>, и небольшой продукт целиком помещается в ноль денег. Но бесплатный — не «безлимитный»: у каждого есть потолок, и важно знать ГДЕ он и что случится при достижении — продукт остановится, замедлится или сервис попросит денег.\u003c/p>\n\u003cp>Вот бесплатные пределы стека Recall (проверено 07.2026; ⚠️ цифры волатильны — сервисы меняют тарифы без предупреждения, перед стартом сверься сам):\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Сервис\u003c/th>\u003cth>Что бесплатно\u003c/th>\u003cth>Потолок / когда платить\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Vercel\u003c/strong> (хостинг)\u003c/td>\u003ctd>100 ГБ трафика, 1 млн вызовов функций/мес, функция до 300 сек\u003c/td>\u003ctd>Не по нагрузке, а по ПРАВИЛУ: приём оплаты = коммерция → нужен Pro ($20/мес). См. ниже\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Supabase\u003c/strong> (база+вход)\u003c/td>\u003ctd>База 500 МБ, 50 000 активных \u003cbutton class=\"term\" data-t=\"mau\">за месяц\u003c/button>, 2 проекта\u003c/td>\u003ctd>Проект засыпает после недели без активности; 500 МБ — жёсткая стена; дальше Pro ($25/мес) с ежедневными бэкапами\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Google Gemini\u003c/strong> (AI)\u003c/td>\u003ctd>Модели flash/lite/Gemma бесплатны, пока к проекту не привязана карта\u003c/td>\u003ctd>Лимиты по числу запросов В ДЕНЬ (у каждой модели свой, узкий); привязал карту — проект молча стал платным\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Groq\u003c/strong> (речь)\u003c/td>\u003ctd>Whisper: ~2000 распознаваний/день; llama: ~14 000/день\u003c/td>\u003ctd>Whisper упирается раньше всего — узкое место «Речи»\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Free Dictionary\u003c/strong> (словарь EN)\u003c/td>\u003ctd>Без ключа, без лимитов\u003c/td>\u003ctd>Нет платного плана; риск иной — это community-проект без гарантий, что не ляжет\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Два коварных нюанса бесплатных тарифов, о которых новичок узнаёт поздно:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Потолки помесячные и «сбрасываются»\u003c/strong> — но если упёрся в середине месяца, продукт может лежать до сброса. Считать пределы под ожидаемую нагрузку надо заранее (это глава про нагрузку, следующая).\u003c/li>\n\u003cli>\u003cstrong>«Бесплатно» у ИИ устроено хитрее всех.\u003c/strong> У Google, например, бесплатный тир — свойство ПРОЕКТА, и стоит привязать к нему платёжную карту, как модели молча переходят на платный тариф. Про такие ловушки — ниже в разборе.\u003c/li>\n\u003c/ol>\n\u003ch2>Как выбирать сервис\u003c/h2>\n\u003cp>Критерии для одиночки с ИИ отличаются от критериев большой компании:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Есть щедрый бесплатный тир\u003c/strong> — чтобы построить и проверить спрос за ноль.\u003c/li>\n\u003cli>\u003cstrong>Популярность = качество твоего ИИ-работника.\u003c/strong> То же правило, что для стека (глава 4): чем больше сервис используют, тем лучше ИИ умеет с ним работать и тем быстрее гуглятся ошибки. Redкий сервис = ИИ галлюцинирует.\u003c/li>\n\u003cli>\u003cstrong>Дружит с остальным стеком\u003c/strong> из коробки.\u003c/li>\n\u003cli>\u003cstrong>Стандарт под капотом, а не проприетарщина\u003c/strong> — чтобы уменьшить \u003cbutton class=\"term\" data-t=\"vendor-lock-in\">привязку\u003c/button> (следующий раздел).\u003c/li>\n\u003cli>\u003cstrong>Простота важнее мощности.\u003c/strong> Тебе не нужен сервис «для энтерпрайза» с сотней настроек — нужен тот, что заведётся за вечер.\u003c/li>\n\u003c/ol>\n\u003ch2>Привязка к поставщику\u003c/h2>\n\u003cp>\u003cbutton class=\"term\" data-t=\"vendor-lock-in\">Привязка к поставщику\u003c/button> — когда продукт так завязан на сервис, что уйти дорого или невозможно. Это не всегда зло: взамен привязки ты получаешь скорость, и на старте это выгодный обмен. Но знать о ней надо, чтобы не загнать себя в угол.\u003c/p>\n\u003cp>Ключ к смягчению — \u003cstrong>стандарт под капотом\u003c/strong>. Данные в обычной базе (Postgres, как у Supabase) вывезти можно — это открытый стандарт, куча инструментов. Данные в закрытом фирменном хранилище — заложник. Поэтому «BaaS на стандартной базе» безопаснее «BaaS на своём формате»: пользуешься удобством сервиса, но дверь на выход не заперта.\u003c/p>\n\u003ch2>Разбор на Recall\u003c/h2>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Стек собран по правилам этой главы — и весь на бесплатном.\u003c/strong> Vercel (хостинг с CDN и serverless), Supabase (база + вход + права), Gemini и Groq (AI), Free Dictionary (словарь EN) — всё популярное, всё дружит из коробки, всё в ноль денег. Ни одна «суть продукта» не отдана на аутсорс, ни один «не-суть» (вход, хостинг, распознавание речи) не написан руками. Это ровно «арендуй, а не строй» в действии.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>AI-провайдеры спрятаны за одной дверью — привязка к ним почти нулевая.\u003c/strong> И Gemini, и Groq вызываются через единый серверный слой (\u003ccode>api/_core.ts\u003c/code>) с цепочкой запасных моделей. Захочешь сменить провайдера — меняешь в ОДНОМ месте, остальной код не знает, откуда берётся ответ. Так и надо изолировать сервис, к которому не хочешь привязываться.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>Самая сильная привязка — к Supabase, и это осознанный компромисс.\u003c/strong> Recall использует не просто «Postgres как базу», а фирменные возможности: права доступа (RLS), серверные функции, вход с токенами, генерацию типов из схемы. Уехать отсюда на «голую» базу — недели работы (переписать весь вход и все политики), а не смена одной настройки. Аудит признал: риск реальный, но приемлемый — Supabase под капотом стоит стандартный Postgres (данные вывезти можно), а на текущем масштабе переезжать незачем. Vercel и AI, наоборот, сменить легко. Урок: привязка не зло, но знать, ГДЕ она сильнее всего, надо заранее.\u003c/p>\u003c/div>\n\u003ch2>Коммерческое использование: когда «бесплатно» кончается по-другому\u003c/h2>\n\u003cp>Отдельная ловушка не про объём, а про ПРАВИЛА. Бесплатные тарифы часто разрешены только для некоммерческого использования. Как только продукт начинает принимать деньги — даже маленькие, даже вручную, — он становится бизнесом, и правила меняются, независимо от того, сколько у тебя трафика.\u003c/p>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>Живой пример на Recall: приём Kaspi-оплаты уже нарушает бесплатный тариф Vercel.\u003c/strong> По правилам Vercel, бесплатный тариф Hobby — только для некоммерческого личного использования, и «любой способ приёма или обработки оплаты от посетителей» прямо назван коммерцией — независимо от трафика. Recall принимает переводы за тарифы — значит формально требует платный Vercel Pro ($20/мес) уже сейчас, хотя по нагрузке до лимитов Hobby далеко. Это самый ранний потолок всего стека: он срабатывает не от числа пользователей, а от факта первой оплаты. Первая обязательная трата продукта — не сервер, а право легально брать деньги.\u003c/p>\u003c/div>\n\u003cp>Урок: \u003cstrong>прежде чем взять первую оплату — перечитай правила бесплатных тарифов своих сервисов\u003c/strong>. Первая обязательная трата продукта — почти всегда не сервер под нагрузкой, а право легально принимать деньги.\u003c/p>\n\u003ch2>Чек-лист для нового проекта\u003c/h2>\n\u003cul>\n\u003cli>Я знаю все сервисы своего стека и за что каждый отвечает.\u003c/li>\n\u003cli>Для каждого я знаю бесплатный потолок и что произойдёт при его достижении.\u003c/li>\n\u003cli>Сервисы выбраны популярные, дружащие между собой, со стандартом под капотом.\u003c/li>\n\u003cli>Я понимаю, где в стеке самая сильная привязка к поставщику и насколько это рискованно.\u003c/li>\n\u003cli>Мои данные лежат в открытом стандарте (их можно вывезти), а не в закрытом формате.\u003c/li>\n\u003cli>Перед первой оплатой я проверил, что мои тарифы разрешают коммерческое использование.\u003c/li>\n\u003cli>Я не привязывал платёжную карту к бесплатным ИИ-проектам, не поняв последствий.\u003c/li>\n\u003c/ul>\n\u003ch2>Вопросы себе\u003c/h2>\n\u003col>\n\u003cli>Почему «арендуй, а не строй» касается и сервисов? Что было бы глупо строить самому для языкового приложения?\u003c/li>\n\u003cli>Что значит «популярность сервиса = качество твоего ИИ-работника»?\u003c/li>\n\u003cli>Что такое привязка к поставщику и почему «стандартная база под капотом» её смягчает?\u003c/li>\n\u003cli>Чем «бесплатно» у ИИ-сервисов отличается от «бесплатно» у хостинга — какая там ловушка?\u003c/li>\n\u003cli>Почему приём первой же оплаты может потребовать перейти на платный тариф, даже если трафика почти нет?\u003c/li>\n\u003c/ol>"},{"n":"11","id":"11","part":"III","title":"Деплой и эксплуатация","html":"\u003ch1>Деплой и эксплуатация\u003c/h1>\n\u003ch2>Сдать дом — не значит забыть про него\u003c/h2>\n\u003cp>Строитель Б думает, что стройка кончается, когда вбит последний гвоздь. Строитель А знает: с этого момента дом начинает ЖИТЬ — и его надо обслуживать. Крыша даёт течь, батарея шумит, замок заедает. Дом без присмотра ветшает; дом, за которым следят и чинят по мелочи, стоит десятилетиями.\u003c/p>\n\u003cp>В продукте то же самое. \u003cstrong>\u003cbutton class=\"term\" data-t=\"deploy\">Деплой\u003c/button> — не финиш, а старт эксплуатации.\u003c/strong> Выложил в \u003cbutton class=\"term\" data-t=\"production\">прод\u003c/button> — и теперь у тебя есть живой продукт, за которым надо следить: не сломался ли, не сыплются ли ошибки у пользователей, есть ли откуда восстановиться, если что-то пойдёт не так. Эта глава — про то, что происходит ПОСЛЕ того, как код готов, и про дыры, в которые новичок проваливается именно здесь, потому что «вроде же работает».\u003c/p>\n\u003ch2>Деплой: момент, когда всё всерьёз\u003c/h2>\n\u003cp>Деплой — это перенос новой версии кода в прод, где её видят настоящие люди. У маленького продукта он обычно \u003cstrong>автоматический\u003c/strong>: отправил код в гит — хостинг сам пересобрал и выложил. Удобно, но именно поэтому опасно: \u003cstrong>деплой — это момент, когда сломанный код доезжает до пользователя\u003c/strong>. На своём компьютере ошибка тронула тебя; в проде — всех.\u003c/p>\n\u003cp>Отсюда дисциплина деплоя:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Проверяй перед выкаткой.\u003c/strong> Сборка прошла, тесты зелёные, относящиеся смоуки пройдены — только потом пуш.\u003c/li>\n\u003cli>\u003cstrong>Соблюдай порядок зависимостей.\u003c/strong> Если новый код рассчитывает на изменение в базе, сперва меняй базу, потом выкатывай код (глава про данные). Нарушишь — прод ляжет: код зовёт то, чего в базе ещё нет.\u003c/li>\n\u003cli>\u003cstrong>Знай, что прод — всерьёз.\u003c/strong> Здесь нет «черновика»: ошибка видна людям, потерянные данные потеряны по-настоящему.\u003c/li>\n\u003c/ul>\n\u003cp>Взрослые команды ставят между «готово» и «прод» промежуточную ступень — \u003cbutton class=\"term\" data-t=\"staging\">стейджинг\u003c/button> (копию боевого, куда не ходят живые пользователи), чтобы потрогать изменение «как в бою» до людей. У одиночки его часто нет, и он проверяет сразу в проде — это работает на малых масштабах, но с ростом рисков стоит завести хотя бы preview-версию.\u003c/p>\n\u003ch2>Почему пользователь застревает на старой версии\u003c/h2>\n\u003cp>Коварная особенность веб-приложений (особенно устанавливаемых \u003cbutton class=\"term\" data-t=\"pwa\">PWA\u003c/button>): выложил новую версию — а у пользователя всё ещё старая. Браузер и телефон кэшируют приложение, чтобы оно открывалось быстро и работало офлайн, — и не спешат проверять, не появилось ли обновление. Человек может неделями сидеть на старом коде и жаловаться на баг, который ты давно починил.\u003c/p>\n\u003cp>Поэтому приложение должно \u003cstrong>уметь замечать обновление и обновляться само\u003c/strong> — проверять новую версию при возвращении на экран, мягко подтягивать её. Это не «полировка», а часть эксплуатации: без неё твои фиксы просто не доезжают до людей.\u003c/p>\n\u003ch2>Наблюдаемость: как узнать, что сломалось\u003c/h2>\n\u003cp>Вопрос, который новичок не задаёт, пока не обожжётся: \u003cstrong>откуда я узнаю, что прод сломался, если пользователь не пожаловался?\u003c/strong> Правильный ответ — от системы, а не от разозлённого человека. Здесь живут два разных инструмента, которые часто путают:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>\u003cbutton class=\"term\" data-t=\"analytics\">Аналитика\u003c/button> посещений\u003c/strong> (сколько зашло, что смотрят) отвечает на «что делают люди». Она НЕ покажет тебе сбой.\u003c/li>\n\u003cli>\u003cstrong>\u003cbutton class=\"term\" data-t=\"error-tracking\">Сбор ошибок\u003c/button>\u003c/strong> (Sentry и аналоги) отвечает на «что ломается»: собирает ошибки, случившиеся у РЕАЛЬНЫХ пользователей в их браузерах, и присылает тебе с деталями.\u003c/li>\n\u003c/ul>\n\u003cp>Без сбора ошибок каждая ошибка живёт только в консоли пользователя — ты её не увидишь НИКОГДА. Пользователь не пишет баг-репорт; он молча уходит. \u003cbutton class=\"term\" data-t=\"monitoring\">Мониторинг\u003c/button> переворачивает это: система говорит «у трёх человек упал экран оплаты» раньше, чем они успели разочароваться. Для продукта, который берёт деньги, это не роскошь — это разница между «починил за час» и «потерял клиента и не понял почему».\u003c/p>\n\u003ch2>Бэкапы: страховка, которую проверяют\u003c/h2>\n\u003cp>\u003cbutton class=\"term\" data-t=\"backup\">Бэкап\u003c/button> — резервная копия данных, из которой можно восстановиться после катастрофы: ошибочная миграция, баг, стёрший чужое, взлом. Про бэкапы два железных факта:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>У бесплатных тарифов бэкапов часто нет вообще\u003c/strong> — это надо проверить, а не предположить. «База же в облаке, там наверняка бэкапится» — опасная догадка.\u003c/li>\n\u003cli>\u003cstrong>Бэкап, который ни разу не пробовали восстановить, — не бэкап, а надежда.\u003c/strong> Копия может оказаться битой, неполной, невосстановимой — и ты узнаешь это в худший момент. Восстановление надо прорепетировать хоть раз.\u003c/li>\n\u003c/ol>\n\u003cp>Почему это критично именно для данных: код откатить легко (об этом ниже), а данные живых пользователей — нет. Стёр карточки сотни людей ошибочным запросом — без бэкапа они пропали навсегда.\u003c/p>\n\u003ch2>Откат: план Б на случай беды\u003c/h2>\n\u003cp>\u003cbutton class=\"term\" data-t=\"rollback\">Откат\u003c/button> — возврат прода к предыдущей рабочей версии. Хорошие хостинги хранят прошлые сборки и откатывают код в один клик — это спасает от «сломал пушем». Но помни асимметрию: \u003cstrong>код откатывается легко, данные — нет\u003c/strong>. Откатил код — вернул как было; а если поломка успела испортить данные, код-откат их не воскресит — только бэкап. Поэтому «план Б» — это две разные вещи: откат кода (просто) и восстановление данных (только если есть бэкап).\u003c/p>\n\u003ch2>Разбор на Recall\u003c/h2>\n\u003cp>Эксплуатация — та часть, где Recall силён в «выкатке» и честно дыряв в «наблюдении». Аудит этого захода разложил это по полочкам.\u003c/p>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Деплой и обновления сделаны зрело.\u003c/strong> Автодеплой (пуш в main → Vercel пересобирает), железное правило «сначала SQL в Supabase, потом код» (иначе прод падает на несуществующей функции), и — что редко у новичков — миграции только аддитивные: проверка показала ноль удалений таблиц/колонок в схеме, то есть выкатка почти не может потерять данные структурно. Плюс продуманное обновление PWA: приложение проверяет новую версию при возврате на экран и раз в час — это выстрадано реальным багом, когда на айфонах неделями жил старый код. И ErrorBoundary, который на типовой сбой «старая вкладка не догрузила новый кусок после деплоя» делает один аккуратный авто-перезагруз. Это уровень выше среднего вайб-кодера.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>Но наблюдаемости нет — и это самая опасная дыра проекта перед платящими.\u003c/strong> Аудит честен: \u003cstrong>сбора ошибок с прода нет вообще\u003c/strong> (ноль Sentry и аналогов; \u003ccode>console.error\u003c/code> встречается во всём коде один раз). Vercel Analytics стоит — но это счётчик посещений, а не ошибок; сбой он не покажет. Значит владелец узнаёт о поломке единственным способом — когда пожалуется пользователь (сейчас это девушка; с клиентами — заплативший человек). И рядом — \u003cstrong>бэкапов базы фактически нет\u003c/strong>: бесплатный тариф Supabase ежедневных бэкапов не даёт, своего процесса экспорта в проекте не заведено, восстановление ни разу не репетировали. Аудит назвал связку прямо: молчаливый сбой + невосстановимая потеря данных. Для продукта, берущего деньги, это самое дорогое сочетание — потому что бьёт именно тогда, когда на кону чужие деньги и доверие. Всё — в журнале docs/findings.md; это то, что стоит закрыть до пилота с чужими.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout\">\u003cp>💡 \u003cstrong>Что делать (дёшево и до платящих):\u003c/strong> подключить бесплатный сбор ошибок (у Sentry есть free-тариф) — чтобы узнавать о сбоях от системы, а не от клиента; и завести простейший бэкап — регулярный экспорт базы в отдельное место плюс ОДНА репетиция восстановления. Две небольшие настройки закрывают самую опасную дыру эксплуатации.\u003c/p>\u003c/div>\n\u003ch2>Чек-лист для нового проекта\u003c/h2>\n\u003cul>\n\u003cli>Я понимаю: деплой — старт эксплуатации, а не финиш; прод — всё всерьёз.\u003c/li>\n\u003cli>Перед выкаткой: сборка, тесты, смоуки; порядок зависимостей (база раньше кода) соблюдён.\u003c/li>\n\u003cli>Приложение умеет замечать своё обновление — фиксы доезжают до пользователей.\u003c/li>\n\u003cli>У меня подключён сбор ошибок с прода — я узнаю о сбое от системы, а не от клиента.\u003c/li>\n\u003cli>Я проверил, есть ли бэкапы у моих сервисов; если нет — завёл свой.\u003c/li>\n\u003cli>Я хотя бы раз восстановился из бэкапа, а не просто «он вроде делается».\u003c/li>\n\u003cli>Я знаю, как откатить код, и помню, что данные так не откатятся — только из бэкапа.\u003c/li>\n\u003c/ul>\n\u003ch2>Вопросы себе\u003c/h2>\n\u003col>\n\u003cli>Почему деплой — самый опасный момент, хотя код уже «работал»?\u003c/li>\n\u003cli>В чём разница аналитики посещений и сбора ошибок? Какой из них скажет тебе, что у пользователя упал экран?\u003c/li>\n\u003cli>«Бэкап, который не пробовали восстановить, — надежда, а не бэкап.» Почему?\u003c/li>\n\u003cli>Почему откатить код легко, а данные — нет? Что из этого следует для порядка «база раньше кода»?\u003c/li>\n\u003cli>Какую самую опасную дыру эксплуатации нашли у Recall и почему она особенно страшна перед платящими?\u003c/li>\n\u003c/ol>"},{"n":"12","id":"12","part":"III","title":"Нагрузка и карта трат","html":null},{"n":"13","id":"13","part":"III","title":"Юридика, налоги, оформление","html":null},{"n":"14","id":"14","part":"IV","title":"Цена, тарифы и юнит-экономика","html":null},{"n":"15","id":"15","part":"IV","title":"Лендинг и продающие тексты","html":null},{"n":"16","id":"16","part":"IV","title":"Запуск и первые клиенты","html":null},{"n":"17","id":"17","part":"IV","title":"Продажи и CRM","html":null},{"n":"18","id":"18","part":"IV","title":"Удержание и метрики","html":null},{"n":"19","id":"19","part":"IV","title":"Поддержка и обратная связь","html":null},{"n":"20а","id":"20a","part":"V","title":"Как разговаривать с ИИ","html":null},{"n":"20б","id":"20b","part":"V","title":"Оркестр из ИИ","html":null}],"glossary":[{"id":"pattern","term":"Паттерн","def":"Готовое, много раз проверенное решение типовой задачи. В интерфейсах — узнаваемый приём: свайп карточки вправо-влево, лента с прокруткой, нижняя панель вкладок. Использовать паттерн — не «украсть», а говорить с пользователем на языке, который он уже знает."},{"id":"onboarding","term":"Онбординг","def":"Первые минуты пользователя в продукте: экраны приветствия, подсказки, первый успешный результат. Задача онбординга — довести новичка до момента «ага, вот зачем это мне» раньше, чем он заскучает и уйдёт."},{"id":"mvp","term":"MVP","def":"Minimum Viable Product — «минимальный жизнеспособный продукт». Самая маленькая версия, которой уже можно пользоваться и по которой видно, нужен ли продукт людям. Строится, чтобы проверить спрос малой кровью, а не чтобы «сделать всё, но попроще»."},{"id":"reference","term":"Референс","def":"Конкретный чужой пример, на который ты ориентируешься: скриншот экрана, лендинг, механика игры. Хороший референс всегда с подписью, ЧТО именно в нём хорошо — иначе через неделю забудешь, зачем сохранял."},{"id":"prototype","term":"Прототип","def":"Черновая, но живая версия интерфейса или фичи: по ней можно кликать и понять, как оно будет ощущаться, до того как писать настоящий код. Прототип разрешено выбросить — в этом его сила."},{"id":"mockup","term":"Макет","def":"Картинка будущего экрана: как он выглядит, где какая кнопка. В отличие от прототипа обычно некликабельный. Макет отвечает на вопрос «как это выглядит», прототип — «как это ощущается»."},{"id":"ux","term":"UX","def":"User Experience — опыт пользователя: удобно ли, понятно ли, сколько шагов до цели, где человек застревает и злится. UX — это про поведение, а не про красоту."},{"id":"ui","term":"UI","def":"User Interface — сам интерфейс: кнопки, цвета, шрифты, отступы. UI — как выглядит; UX — как работает. Красивый UI с плохим UX — красивая дверь, которая открывается не в ту сторону."},{"id":"design-system","term":"Дизайн-система","def":"Единый набор правил и деталей интерфейса: цвета, шрифты, кнопки, отступы — описанные один раз и переиспользуемые везде. Благодаря ей все экраны выглядят «одной рукой нарисованными», а новые собираются быстрее."},{"id":"niche","term":"Ниша","def":"Узкая группа людей с общей потребностью, для которой ты делаешь продукт. «Приложение для изучения языков» — рынок; «инструмент для репетитора английского, ведущего учениц в Казахстане» — ниша. Маленьким продуктам ниша — друг: легче найти своих и обойти гигантов."},{"id":"feature","term":"Фича","def":"Отдельная функция продукта: «свайп-колода», «AI-диалог», «отчёт для родителей». От английского feature — «возможность»."},{"id":"landing","term":"Лендинг","def":"Одностраничный сайт с одной задачей — убедить посетителя сделать одно действие: зарегистрироваться, оставить заявку, купить. Обычно первое, что видит будущий клиент."},{"id":"fsrs","term":"FSRS","def":"Алгоритм интервальных повторений (Free Spaced Repetition Scheduler): вычисляет, когда показать карточку со словом снова, чтобы ты повторил её прямо перед тем, как забудешь. Используется в колоде Recall."},{"id":"competitor-analysis","term":"Конкурентный анализ","def":"Систематический разбор продуктов, решающих ту же боль, что и твой: что у них есть, сколько стоит, что пользователи хвалят и на что жалуются в отзывах. Даёт готовую карту «что обязательно, что можно лучше, что никому не нужно»."},{"id":"pain","term":"Боль","def":"Проблема, которая реально мешает человеку жить или работать — настолько, что он готов тратить время или деньги на решение. Продукты, выросшие из настоящей боли, продаются легче, чем «прикольные идеи»."},{"id":"custdev","term":"Кастдев","def":"Customer development — разговоры с людьми из твоей ниши ДО и ВО ВРЕМЯ стройки: как они решают проблему сейчас, что их бесит, за что платят. Цель — проверить, что боль настоящая, до того как потратишь месяцы на код."},{"id":"mom-test","term":"Тест мамы","def":"Правило хороших интервью (по книге Роба Фитцпатрика): задавай вопросы, на которые даже мама не сможет ответить приятной ложью. Не «купил бы ты такое приложение?» (все вежливо скажут «да»), а «как ты решал эту проблему в прошлом месяце и сколько это стоило?» — о прошлом поведении врать труднее."},{"id":"waitlist","term":"Список ожидания","def":"Страница «продукт скоро выйдет — оставь почту». Дешёвый способ измерить спрос до стройки: если из 100 посетителей почту оставляют 30 — спрос есть; если 2 — повод задуматься. Оставленный контакт — маленькое, но действие, а действия честнее слов."},{"id":"early-adopters","term":"Ранние последователи","def":"Первые пользователи, готовые терпеть сырой продукт, потому что боль у них острее всех. Они прощают баги, дают обратную связь и становятся первыми платящими. Искать надо именно их, а не «всех»."},{"id":"user-story","term":"Пользовательский сценарий","def":"Описание фичи через человека: «Репетитор назначает ученице слова на неделю и видит, что она их прошла». Не «сделать таблицу назначений», а кто, что делает и зачем. Сценарии не дают построить экран, которым никто не пользуется."},{"id":"scope","term":"Скоуп","def":"Границы версии: что входит в стройку сейчас, а что осознанно откладывается. Записанный скоуп — главная защита от вечной стройки."},{"id":"scope-creep","term":"Расползание скоупа","def":"Scope creep — когда во время стройки в план тихо вползают «ещё одна фишечка» за другой, и дом, который строили месяц, строится год. Лечится записанным скоупом и словом «потом»: идея не выбрасывается, а откладывается в список."},{"id":"spec","term":"ТЗ","def":"Техническое задание — записанный до стройки ответ на вопросы: что делаем, для кого, что входит и не входит, как поймём, что готово. Для работы с ИИ это главный инструмент: качество результата упирается в качество ТЗ сильнее, чем в качество модели."},{"id":"contract","term":"Контракт","def":"Зафиксированная договорённость между частями системы: имена папок, типы данных, сигнатуры функций, схема базы. Пока контракт соблюдается, части можно менять независимо — как розетки можно переставлять, не трогая проводку в стенах."},{"id":"pilot","term":"Пилот","def":"Первый запуск продукта на небольшой группе настоящих посторонних пользователей — до открытия дверей для всех. Задача пилота — найти, где продукт ломается о реальную жизнь, и получить первые честные «плачу» или «не плачу»."},{"id":"stack","term":"Стек","def":"Набор технологий, из которых собран проект: язык, фреймворк, база данных, хостинг. «Стек Recall» = React + TypeScript + Supabase + Vercel. Слово от английского stack — «стопка»: технологии лежат слоями одна на другой."},{"id":"framework","term":"Фреймворк","def":"Готовый каркас, внутри которого пишут приложение: он решает типовые задачи (экраны, обновление данных, навигация), а ты дописываешь своё. React — фреймворк для интерфейсов. Каркас дома вместо стройки с нуля из брёвен."},{"id":"frontend","term":"Фронтенд","def":"Часть приложения, которая работает у пользователя в браузере или на телефоне: экраны, кнопки, анимации. Всё, что видно и можно потрогать."},{"id":"backend","term":"Бэкенд","def":"Невидимая часть на сервере: база данных, проверка прав, обработка платежей, секретные ключи. Пользователь её не видит, но без неё фронтенд — красивая пустышка. Важно: всему, что приходит с фронтенда, бэкенд не доверяет — там сидят и честные пользователи, и жулики."},{"id":"baas","term":"BaaS","def":"Backend-as-a-Service — «бэкенд как услуга»: готовый сервер с базой, входом по паролю и правами доступа, который берут в аренду вместо того, чтобы писать свой. Supabase в Recall — ровно это. Экономит месяцы, но привязывает к поставщику."},{"id":"typing","term":"Типизация","def":"Явное описание формы данных в коде: «эта функция принимает строку и возвращает число». TypeScript проверяет соблюдение этих описаний ДО запуска — целый класс ошибок («передал не то») ловится за секунды, а не находится пользователем. Для работы с ИИ типы — ещё и контракт: по ним ИИ понимает, что куда передавать."},{"id":"refactoring","term":"Рефакторинг","def":"Перестройка кода без изменения поведения: разбить огромный файл, вынести повторяющееся в одно место, переименовать понятнее. Дом выглядит так же, но проводку привели в порядок — следующий ремонт станет дешевле."},{"id":"dry","term":"DRY","def":"Don't Repeat Yourself — «не повторяйся»: одна логика должна жить в одном месте. Если правило проверки ответа скопировано в три файла, однажды исправят одно из трёх — и появится баг «здесь работает, там нет». Но фанатизм вреден: склеивать разные вещи из-за внешней похожести хуже, чем повториться."},{"id":"dead-code","term":"Мёртвый код","def":"Код, который больше ниоткуда не вызывается: остатки переделок, старые версии экранов. Вреден не тем, что «занимает место», а тем, что врёт читателю (человеку и ИИ): его изучают, учитывают, боятся сломать — а он давно мёртв. Находится поиском «кто это импортирует» и удаляется без жалости — история остаётся в гите."},{"id":"tech-debt","term":"Техдолг","def":"Технический долг — накопленные «потом починю»: срезанные углы, устаревшие документы, дубли. Как кредит: взять можно и нужно (скорость!), но по нему капают проценты — каждая новая фича в захламлённом коде стоит дороже. Долг надо периодически гасить, иначе проценты съедают всю скорость."},{"id":"dependency","term":"Зависимость","def":"Чужая библиотека, которую твой проект использует: ts-fsrs считает расписание повторений, pdfjs читает PDF. Экономит недели, но каждая зависимость — чужой код в твоём доме: она может содержать дыры, сломаться при обновлении или перестать поддерживаться."},{"id":"bundle","term":"Бандл","def":"Итоговый «свёрток» кода, который браузер скачивает при открытии приложения. Чем он тяжелее, тем дольше первый экран. Лечится ленивой загрузкой: тяжёлые куски (словарь на 4000 слов, читалка PDF) скачиваются не при старте, а когда реально понадобились."},{"id":"threat-model","term":"Модель угроз","def":"Ответ на вопрос «от кого и от чего я защищаюсь». Для маленького продукта это не «хакеры из фильмов», а: любопытный пользователь с открытыми инструментами разработчика, скрипт, выжигающий твои платные лимиты, и жулик, желающий получить платное бесплатно. Защита строится от них, а не от спецслужб."},{"id":"devtools","term":"DevTools","def":"Инструменты разработчика, встроенные в каждый браузер (F12). Любой пользователь видит в них весь код фронтенда, все запросы к серверу — и может отправить свои запросы с любыми данными. Поэтому «спрятать в коде страницы» = «оставить на виду»."},{"id":"secret","term":"Секрет (ключ API)","def":"Строка-пароль, дающая доступ к платному сервису (ключ Gemini, ключ базы). Секреты живут ТОЛЬКО на сервере: всё, что попало в код фронтенда, доступно любому через DevTools. Утёкший ключ = кто-то жжёт твои лимиты и деньги."},{"id":"token","term":"Токен (JWT)","def":"Подписанный «пропуск», который сервер выдаёт после входа по паролю. Дальше каждый запрос предъявляет токен, и сервер знает, КТО пришёл, не спрашивая пароль заново. Подделать нельзя — подпись сойдётся только у настоящего. Именно по токену сервер Recall понимает, чью квоту списывать."},{"id":"rls","term":"RLS","def":"Row Level Security — «защита на уровне строк» в базе Postgres: правило, какие СТРОКИ таблицы видит и меняет каждый пользователь («свои карточки — да, чужие — нет»). Работает в самой базе, поэтому её не обойти хитрым запросом с клиента. Важное ограничение: RLS решает про строки целиком — спрятать отдельные КОЛОНКИ строки она не умеет."},{"id":"rpc","term":"RPC (серверная функция)","def":"Remote Procedure Call — функция, живущая в базе/на сервере, которую клиент может только вызвать, но не изменить. Внутри неё — проверки прав и правил, которые пользователь не может обойти. Всё чувствительное (баллы, роли, оплаты) в Recall пишется только через такие функции."},{"id":"injection","term":"Инъекция","def":"Атака, при которой в данные подсовывают команды: строка из формы попадает в запрос к базе и выполняется как код (SQL-инъекция) или вставляется в страницу и выполняется как скрипт (XSS). Защита — никогда не смешивать данные с кодом: параметризованные запросы, экранирование при выводе."},{"id":"migration","term":"Миграция","def":"Изменение схемы базы данных на живых данных: добавить колонку, таблицу, правило — не потеряв то, что уже лежит. Пишется скриптом, который можно запускать повторно без вреда. Ошибка в миграции опаснее ошибки в коде: код откатывается легко, потерянные данные — нет."},{"id":"transaction","term":"Транзакция","def":"Группа операций с базой, которая выполняется «всё или ничего»: перевод денег = снять с одного счёта И положить на другой; если между шагами что-то упало — откатываются оба. Без транзакции сбой на середине оставляет данные в разорванном состоянии."},{"id":"race","term":"Гонка","def":"Race condition — два запроса выполняются одновременно и мешают друг другу: оба прочитали «использовано 4 из 5», оба прошли проверку, стало 6 из 5. Возникает только под параллельной нагрузкой, поэтому в ручных тестах не видна. Лечится блокировками: одновременные запросы одного пользователя выстраиваются в очередь."},{"id":"backup","term":"Бэкап","def":"Резервная копия данных, из которой можно восстановиться после катастрофы: ошибочная миграция, удалённая таблица, взлом. Правило: бэкап, который ни разу не пробовали восстановить, — это не бэкап, а надежда."},{"id":"foreign-key","term":"Внешний ключ","def":"Связь между таблицами, которую охраняет сама база: карточка ссылается на колоду, и базу нельзя привести в состояние «карточка есть, колоды нет». Каскадное удаление — продолжение той же связи: удалил колоду — карточки ушли вместе с ней, сирот не осталось."},{"id":"idempotent","term":"Идемпотентность","def":"Свойство операции: выполнить её дважды — то же самое, что один раз. Идемпотентный скрипт схемы можно заливать повторно без страха что-то задвоить или сломать; идемпотентная кнопка «оплатить» не спишет деньги дважды при двойном клике."},{"id":"unit-test","term":"Юнит-тест","def":"Проверка одной маленькой «детали» кода в изоляции: дал функции вход — сверил выход. Быстрый, точный, ловит ошибку в конкретном месте. «Подставил в калькулятор 2+2 — ждём 4»."},{"id":"integration-test","term":"Интеграционный тест","def":"Проверка, что несколько частей работают ВМЕСТЕ: код + база + права доступа. Медленнее юнита, но ловит то, что юнит не видит — например, что защита базы реально не пускает чужого. Смоуки Recall — это они."},{"id":"smoke-test","term":"Смоук-тест","def":"Быстрая проверка «дым не идёт»: работают ли главные сценарии вообще, до тонкостей. Название — от электроники: включил плату, не задымилась — уже хорошо. В Recall смоук создаёт тестовый аккаунт, прогоняет сценарий и удаляет его."},{"id":"regression","term":"Регрессия","def":"Когда новое изменение ломает то, что раньше работало. Самый частый и коварный баг: чинил одно — сломал другое, и не заметил. Главная причина, зачем вообще нужны тесты: они ловят регрессию до пользователя."},{"id":"e2e","term":"E2E-тест","def":"End-to-end — «из конца в конец»: тест проходит весь путь пользователя как настоящий человек (открыл экран, нажал, проверил результат), обычно в реальном браузере. Самый близкий к жизни и самый медленный вид теста."},{"id":"coverage","term":"Покрытие","def":"Какая часть кода проверяется тестами. «Покрыто» — на этот кусок есть тест, регрессию поймают; «не покрыто» — меняешь вслепую. 100% не нужно и не бывает; важно покрыть ДОРОГОЕ (безопасность, деньги, данные)."},{"id":"flaky","term":"Флаки-тест","def":"Тест, который то проходит, то падает без изменений в коде — из-за случайности, времени, гонок, состояния окружения. Опасен тем, что приучает игнорировать красное («да он всегда мигает»), и тогда пропускают настоящую поломку."},{"id":"edge-case","term":"Крайний случай","def":"Редкая, но реальная ситуация на границе: пустой список, ноль элементов, очень длинный текст, два клика подряд, обрыв сети на середине. Обычный сценарий все проверяют; баги живут в крайних случаях, потому что про них забывают."},{"id":"ci","term":"CI/CD","def":"Continuous Integration / Delivery — «конвейер»: при каждом изменении автоматически прогоняются проверки (сборка, тесты), и при успехе код сам выкатывается. У Recall роль CD играет Vercel (пуш в main → автодеплой); полноценного авто-прогона тестов на каждый пуш пока нет."},{"id":"a11y","term":"Доступность (a11y)","def":"Accessibility — насколько продуктом могут пользоваться ВСЕ, включая людей со слабым зрением, моторикой, на солнце, одной рукой. Это не «для инвалидов», а для всех в неудобных условиях: контраст текста, размер кнопок, подписи. a11y = «a» + 11 букв + «y»."},{"id":"contrast","term":"Контраст","def":"Разница в яркости между текстом и фоном. Слишком бледный текст красив в макете, но не читается на солнце или слабым зрением. Есть измеримая норма (обычно 4.5:1 для обычного текста) — её можно и нужно проверять числом, а не на глаз."},{"id":"touch-target","term":"Тач-цель","def":"Область, в которую нужно попасть пальцем: кнопка, ссылка, чекбокс. Норма — не меньше ~44×44 пикселей, иначе на телефоне промахиваешься и злишься. Визуально элемент может быть мелким — важна кликабельная зона вокруг."},{"id":"responsive","term":"Адаптивность","def":"Responsive — интерфейс подстраивается под размер экрана: на телефоне одна колонка, на компе — несколько, ничего не вылезает и не требует горизонтальной прокрутки. Делается относительными размерами и гибкой сеткой, а не фиксированными пикселями."},{"id":"affordance","term":"Аффорданс","def":"Подсказка формой: кнопка выглядит нажимаемой, ссылка — кликаемой, поле — заполняемым. Хороший интерфейс не нужно объяснять: по виду понятно, что с элементом делать. Плохой аффорданс — когда не ясно, кликабельно оно или нет."},{"id":"git","term":"Гит","def":"Система контроля версий: сохраняет историю всех изменений кода точками-«коммитами», к которым можно вернуться. Для работы с ИИ это спасательный круг: ИИ пишет большие правки за секунды, и если заход пошёл не туда — откатываешься к последнему хорошему коммиту, не потеряв недели работы."},{"id":"commit","term":"Коммит","def":"Сохранённая точка в истории гита: снимок кода с подписью «что сделал». Частые маленькие коммиты — как этажи с площадками: сорвался — падаешь на этаж, а не в подвал. Смотреть, что именно меняется (diff), стоит ДО того, как принять правку ИИ."},{"id":"branch","term":"Ветка","def":"Параллельная линия истории в гите: можно рискованно перестраивать код в отдельной ветке, не трогая рабочую версию. Получилось — вливаешь; сломал — выбрасываешь ветку целиком. Идеально для «а давай ИИ большой рефакторинг»."},{"id":"empty-state","term":"Пустое состояние","def":"Как выглядит экран, когда данных ЕЩЁ нет: список повторений пуст, у новичка ноль карточек. Третье состояние наравне с «загрузка» и «ошибка», и самое забываемое — разработчик всегда тестирует на заполненном экране. Пустой экран без подсказки «что делать» — испорченное первое впечатление."},{"id":"db-index","term":"Индекс (в базе)","def":"Как алфавитный указатель в конце книги: помогает базе быстро найти нужные строки, не перечитывая всю таблицу. Без индекса на 10 строках незаметно, на миллионе — экран висит. Ставится на колонки, по которым часто ищут, фильтруют, сортируют."},{"id":"n-plus-1","term":"Лишние запросы (N+1)","def":"Классическая утечка скорости: вместо одного запроса за всеми данными код делает по запросу на каждый элемент — 1 список + N деталей. На тесте с тремя элементами незаметно, у живого пользователя со ста — заметная тормознутость. Лечится «взять всё разом»."},{"id":"design-consistency","term":"Согласованность","def":"Одинаковые вещи выглядят и ведут себя одинаково по всему продукту: «назад» всегда на месте, «сохранить» всегда одного цвета, ошибки показываются единообразно. Пользователь один раз научился — дальше узнаёт без раздумий. Непоследовательность утомляет незаметно, микро-заминкой на каждом «а это то же самое?»."},{"id":"hosting","term":"Хостинг","def":"Сервис, на компьютерах которого живёт твой продукт, чтобы он был доступен в интернете круглосуточно. Свой продукт ты не держишь на своём ноутбуке — арендуешь место у хостинга (у Recall это Vercel). Как аренда участка под дом вместо стройки посреди дороги."},{"id":"serverless","term":"Serverless","def":"«Бессерверный» — способ запускать кусочек серверного кода без аренды целого сервера: код лежит и «просыпается» только на время запроса, платишь за вызовы, а не за круглосуточную аренду. Идеально для маленького продукта. У Recall так работает прокси к ИИ (/api/gemini). Сервер, конечно, есть — просто им управляет хостинг, не ты."},{"id":"free-tier","term":"Бесплатный тариф","def":"Free tier — уровень сервиса, бесплатный до какого-то потолка (объём, число запросов, размер базы). Позволяет построить и проверить продукт за ноль денег. Важно знать ГДЕ потолок и что происходит при его достижении: продукт останавливается, замедляется или сервис просит денег."},{"id":"vendor-lock-in","term":"Привязка к поставщику","def":"Vendor lock-in — когда продукт так завязан на конкретный сервис, что уйти с него дорого или почти невозможно. Не всегда зло (взамен — скорость), но знать о ней надо: чем глубже используешь фирменные возможности сервиса, тем сильнее привязка. Данные в стандартной базе (как Postgres у Supabase) вывезти легче, чем из закрытого фирменного хранилища."},{"id":"cdn","term":"CDN","def":"Content Delivery Network — сеть серверов по всему миру, которые раздают твой сайт с ближайшего к пользователю, чтобы грузилось быстро хоть в Алматы, хоть в Лондоне. Современные хостинги (Vercel) дают CDN из коробки — тебе о нём думать почти не надо."},{"id":"mau","term":"MAU","def":"Monthly Active Users — сколько РАЗНЫХ людей заходили за месяц. Частая единица измерения в тарифах (особенно у сервисов входа): бесплатно до N активных в месяц, дальше платно. Не путать с общим числом регистраций — считаются только реально заходившие."},{"id":"deploy","term":"Деплой","def":"Выкладка — процесс переноса новой версии кода «на боевой» (в прод), где её видят пользователи. У Recall деплой автоматический: отправил код в гит — хостинг сам пересобрал и выложил. Момент риска: именно при деплое сломанный код доезжает до людей."},{"id":"production","term":"Прод","def":"Production — «боевая» версия продукта, та, которой пользуются настоящие люди. Противоположность — среда разработки на твоём компьютере. Правило: в проде всё всерьёз — ошибка видна пользователям, потерянные данные потеряны по-настоящему."},{"id":"staging","term":"Стейджинг","def":"Промежуточная «копия боевого» для проверки перед выкаткой в прод: то же, что у пользователей, но никто настоящий туда не ходит. Позволяет потрогать изменение «как в бою» до того, как его увидят люди. У маленьких продуктов часто заменяется preview-версией или отсутствует — с риском проверять сразу в проде."},{"id":"rollback","term":"Откат","def":"Возврат прода к предыдущей рабочей версии, когда выкатка что-то сломала. Хостинги вроде Vercel хранят прошлые сборки и умеют откатить в один клик. Важное «но»: откат кода легко, а откат ПОТЕРЯННЫХ ДАННЫХ — только из бэкапа, если он есть."},{"id":"monitoring","term":"Мониторинг","def":"Автоматическое наблюдение за живым продуктом: работает ли он, не сыплются ли ошибки, не лёг ли сервер. Без мониторинга ты узнаёшь о поломке от разозлённого пользователя (или не узнаёшь вовсе, а он просто уходит). С мониторингом — от системы, часто раньше пользователя."},{"id":"error-tracking","term":"Сбор ошибок","def":"Сервис (например Sentry), который собирает ошибки, случившиеся у РЕАЛЬНЫХ пользователей в их браузерах, и присылает тебе со всеми деталями. Без него ошибка живёт только в консоли пользователя — ты её никогда не увидишь. Ключевой инструмент наблюдаемости."},{"id":"analytics","term":"Аналитика","def":"Сбор данных о поведении пользователей: сколько зашло, какие экраны смотрят, где уходят. Отвечает на «что делают люди», в отличие от мониторинга ошибок («что ломается»). Это разные вещи: аналитика посещений НЕ покажет тебе сбой — нужен отдельный сбор ошибок."},{"id":"pwa","term":"PWA","def":"Progressive Web App — обычный сайт, который умеет вести себя как приложение: устанавливается на телефон иконкой, работает офлайн, открывается на весь экран. Один код на все платформы, без магазинов приложений. Recall — это PWA. Обратная сторона: обновления доходят до пользователя не мгновенно (телефон кэширует приложение)."}]};
