:root{
  --bg:#F6F5FA;--surface:#FFFFFF;--soft:#EDECF5;--ink:#232438;--mut:#565870;
  --faint:#8B8CA3;--line:#E2E1EE;--accent:#5F4FD8;--on-accent:#FFFFFF;
  --good:#177A52;--warn:#9A6210;--shadow:0 10px 30px rgba(35,36,56,.10);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161826;--surface:#1E2030;--soft:#252740;--ink:#ECEAF6;--mut:#A9A8C0;
  --faint:#6E6F8A;--line:#2B2D42;--accent:#9184D9;--on-accent:#14151F;
  --good:#63C89B;--warn:#D9A662;--shadow:0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#161826;--surface:#1E2030;--soft:#252740;--ink:#ECEAF6;--mut:#A9A8C0;
  --faint:#6E6F8A;--line:#2B2D42;--accent:#9184D9;--on-accent:#14151F;
  --good:#63C89B;--warn:#D9A662;--shadow:0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#F6F5FA;--surface:#FFFFFF;--soft:#EDECF5;--ink:#232438;--mut:#565870;
  --faint:#8B8CA3;--line:#E2E1EE;--accent:#5F4FD8;--on-accent:#FFFFFF;
  --good:#177A52;--warn:#9A6210;--shadow:0 10px 30px rgba(35,36,56,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Onest V',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:44rem;margin:0 auto;padding:0 20px}

/* ---------- обложка / оглавление ---------- */
.cover{padding:56px 0 28px}
.cover .kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.cover h1{font-size:clamp(2rem,7vw,2.9rem);font-weight:800;letter-spacing:-.02em;margin:.35rem 0 .6rem;text-wrap:balance}
.cover p.sub{font-family:Georgia,'Times New Roman',serif;font-style:italic;color:var(--mut);font-size:1.05rem;margin:0;max-width:34rem}
.progress{margin:26px 0 8px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .4s ease}
.progress .cap{font-size:.85rem;color:var(--mut);margin-top:8px;font-variant-numeric:tabular-nums}
.continue{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--accent);color:var(--on-accent);border-radius:16px;padding:16px 18px;margin:18px 0 6px;box-shadow:var(--shadow)}
.continue .ico{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--on-accent) 18%,transparent)}
.continue b{display:block;font-size:.95rem}
.continue span{display:block;font-size:.8rem;opacity:.85;margin-top:2px}
.part{margin:34px 0 6px;display:flex;align-items:baseline;gap:12px}
.part .rn{font-family:Georgia,serif;font-style:italic;color:var(--accent);font-size:1.05rem;min-width:1.6rem}
.part h2{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:650;margin:0}
.part::after{content:'';flex:1;height:1px;background:var(--line);transform:translateY(-4px)}
.chrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 10px;min-height:48px;border-radius:12px}
.chrow:not(.soon):hover{background:var(--soft)}
.chrow .num{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;min-width:2.1rem;font-size:.95rem}
.chrow .t{flex:1;font-size:.98rem}
.chrow .st{font-size:.78rem;color:var(--faint)}
.chrow .st.done{color:var(--good);font-weight:600}
.chrow.soon{cursor:default}
.chrow.soon .t,.chrow.soon .num{color:var(--faint)}
.foot{margin:44px 0 40px;color:var(--faint);font-size:.8rem;border-top:1px solid var(--line);padding-top:16px}

/* ---------- глава ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{display:flex;align-items:center;gap:8px;max-width:44rem;margin:0 auto;padding:8px 12px}
.tbtn{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:12px;color:var(--mut);gap:6px;padding:0 10px;font-size:.88rem;font-weight:600}
.tbtn:hover{background:var(--soft);color:var(--ink)}
.topbar .title{flex:1;text-align:center;font-size:.85rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
article{padding:30px 0 90px}
article .chnum{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:650}
article h1{font-size:clamp(1.65rem,5.5vw,2.2rem);font-weight:800;letter-spacing:-.015em;line-height:1.2;margin:.4rem 0 1.4rem;text-wrap:balance}
article h2{font-size:1.28rem;font-weight:750;letter-spacing:-.01em;margin:2.2em 0 .6em;text-wrap:balance}
article h3{font-size:1.05rem;font-weight:700;margin:1.8em 0 .5em}
article p,article li{font-family:Georgia,'Times New Roman',serif;font-size:1.06rem;line-height:1.75;color:var(--ink)}
article p{margin:0 0 1.05em}
article ul,article ol{padding-left:1.4em;margin:0 0 1.1em}
article li{margin-bottom:.45em}
article strong{font-weight:700}
article code{font-family:ui-monospace,Consolas,monospace;font-size:.88em;background:var(--soft);padding:.12em .4em;border-radius:6px}
article hr{border:0;height:1px;background:var(--line);margin:2em 0}
.callout{border-radius:14px;padding:14px 16px;margin:0 0 1.1em;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent)}
.callout p{margin:0 0 .7em;font-size:1.01rem}
.callout p:last-child{margin:0}
.callout.c-good{border-left-color:var(--good)}
.callout.c-warn{border-left-color:var(--warn)}
.term{font-family:inherit;font-size:inherit;line-height:inherit;text-align:left;color:var(--accent);border-bottom:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);padding-bottom:1px}
.reading{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:6px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
.chnav{display:flex;gap:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:20px}
.chnav button{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;text-align:left;min-height:56px}
.chnav button:hover{border-color:var(--accent)}
.chnav .lbl{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:3px}
.chnav .nx{text-align:right}
.chnav .nm{font-size:.92rem;font-weight:650}

/* ---------- плеер ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.player .in{max-width:44rem;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px}
.pbtn{display:grid;place-items:center;min-width:44px;min-height:44px;border-radius:12px;color:var(--ink)}
.pbtn:hover{background:var(--soft)}
.pbtn.main{background:var(--accent);color:var(--on-accent);border-radius:50%;width:48px;height:48px;margin:0 4px}
.pbtn svg{display:block}
.rate{font-variant-numeric:tabular-nums;font-weight:700;font-size:.85rem;color:var(--mut);min-width:52px}
.pspacer{flex:1;font-size:.78rem;color:var(--faint);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}

/* ---------- глоссарий ---------- */
.sheetwrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(10,10,20,.45)}
.sheet{position:relative;width:100%;max-width:34rem;background:var(--surface);border-radius:20px 20px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .gl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:650}
.sheet h3{margin:.3rem 0 .5rem;font-size:1.25rem;font-weight:750}
.sheet p{font-family:Georgia,serif;font-size:1rem;line-height:1.65;color:var(--ink);margin:0}
.sheet .x{position:absolute;top:10px;right:10px;min-width:44px;min-height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mut)}
.sheet .x:hover{background:var(--soft)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

<script>
"use strict";
const PAYLOAD = {"parts":{"I":"До стройки","II":"Стройка","III":"Сдача и эксплуатация","IV":"Дом продаётся","V":"Инструмент"},"chapters":[{"n":"1","id":"01","part":"I","title":"Насмотренность: где брать вкус и идеи","html":"\u003ch1>Насмотренность: где брать вкус и идеи\u003c/h1>\n\u003ch2>Зачем строителю смотреть чужие дома\u003c/h2>\n\u003cp>Опытный строитель отличается от новичка не только тем, что умеет класть кирпич. Он видел сотни домов: жил в неудачных, чинил чужие ошибки, подмечал, почему в одном доме уютно, а в другом — красиво, но жить невозможно. Когда он проектирует свой, он не выдумывает всё с нуля — он собирает дом из решений, которые уже где-то видел работающими.\u003c/p>\n\u003cp>Это и есть насмотренность: библиотека чужих решений у тебя в голове. Вкус — не врождённый талант, а результат того, что ты много и правильно смотрел. Хорошая новость для вайб-кодера: насмотренность качается быстрее, чем умение программировать. Плохая: без неё ИИ тебе не поможет — он предложит «какой-то» вариант, а ты не сможешь отличить хороший от посредственного, потому что тебе не с чем сравнивать.\u003c/p>\n\u003cp>Это первая глава не случайно. Всё, что дальше — планировка, \u003cbutton class=\"term\" data-t=\"mvp\">MVP\u003c/button>, дизайн, цены, — начинается с вопроса «а как это делают другие?». Кто не смотрит по сторонам, тот заново изобретает кривое колесо.\u003c/p>\n\u003ch2>Смотреть глазами строителя, а не жильца\u003c/h2>\n\u003cp>Жилец заходит в дом и чувствует: «уютно» или «что-то не то». Строитель видит, ПОЧЕМУ: окна на юг, потолки три метра, розетки там, где нужны. Разница — в вопросах, которые ты задаёшь, пока смотришь.\u003c/p>\n\u003cp>Открой любой чужой продукт и разбери его на слои, как дом:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Какую \u003cbutton class=\"term\" data-t=\"pain\">боль\u003c/button> он решает и для кого?\u003c/strong> Какая у него \u003cbutton class=\"term\" data-t=\"niche\">ниша\u003c/button>?\u003c/li>\n\u003cli>\u003cstrong>Как он встречает новичка?\u003c/strong> Пройди \u003cbutton class=\"term\" data-t=\"onboarding\">онбординг\u003c/button> с секундомером: сколько шагов до первого «ага, полезно!»? Что тебя бесило?\u003c/li>\n\u003cli>\u003cstrong>Как он берёт деньги?\u003c/strong> Что бесплатно, что платно, где граница и почему именно там?\u003c/li>\n\u003cli>\u003cstrong>Как он выглядит и ощущается?\u003c/strong> Не «красиво/некрасиво», а конкретно: какие \u003cbutton class=\"term\" data-t=\"pattern\">паттерны\u003c/button> использует? Что ты понял без объяснений — и почему?\u003c/li>\n\u003cli>\u003cstrong>Что у него под капотом?\u003c/strong> (Это уже взгляд инженера — вернёмся к нему в главе про фундамент.)\u003c/li>\n\u003c/ol>\n\u003cp>Такой разбор одного продукта занимает 15–20 минут и даёт больше, чем час чтения статей «10 трендов дизайна». Смотреть надо не только на лидеров: неудачные продукты учат не хуже — на них видно, ЧЕГО не делать, а в отзывах прямо написано, за что людям больно.\u003c/p>\n\u003ch2>Где смотреть\u003c/h2>\n\u003cp>Каждой площадке — своя задача. Не «листать всё подряд», а идти за конкретным:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Product Hunt\u003c/strong> (producthunt.com) — витрина новых продуктов, десятки каждый день. Смотри не на победителей, а на то, как продукты себя ОПИСЫВАЮТ: одна фраза «что это и для кого» — готовая школа формулировок для твоего будущего \u003cbutton class=\"term\" data-t=\"landing\">лендинга\u003c/button>.\u003c/li>\n\u003cli>\u003cstrong>Indie Hackers\u003c/strong> (indiehackers.com) — истории маленьких продуктов с настоящими цифрами: сколько зарабатывают, где нашли первых клиентов, что провалилось. Противоядие от иллюзии «нужен миллион пользователей» — там полно продуктов, живущих на 50 платящих.\u003c/li>\n\u003cli>\u003cstrong>Mobbin\u003c/strong> (mobbin.com) — огромная коллекция скриншотов реальных мобильных приложений, разложенных по экранам: «онбординг», «оплата», «пустое состояние». Когда делаешь конкретный экран — смотришь, как этот же экран решили 30 команд с дизайнерами в штате.\u003c/li>\n\u003cli>\u003cstrong>Dribbble / Behance\u003c/strong> — работы дизайнеров. Осторожно: там много «красивого, но нежизнеспособного» — картинки рисуют ради лайков, их никто не проверял на живых пользователях. Бери настроение и стиль, не копируй механику.\u003c/li>\n\u003cli>\u003cstrong>Топы App Store / Google Play в своей категории\u003c/strong> — открой топ-20 «Образование», скачай пять, пройди онбординги. И главное — \u003cstrong>читай отзывы конкурентов\u003c/strong>, особенно на 2–3 звезды: «люблю приложение, но…» — после «но» люди бесплатно диктуют тебе список \u003cbutton class=\"term\" data-t=\"feature\">фич\u003c/button> и болей. Это самый недооценённый источник.\u003c/li>\n\u003cli>\u003cstrong>Каналы и рассылки про продукты\u003c/strong> — любые разборы, где объясняют, ПОЧЕМУ сделано так. Одна статья-разбор «как Duolingo удерживает пользователей» полезнее сотни скриншотов, потому что даёт причины, а не картинки.\u003c/li>\n\u003c/ul>\n\u003ch2>Коллекция референсов, которая работает\u003c/h2>\n\u003cp>Насмотренность испаряется, если её не записывать. Заведи одно место — заметки, папку, доску в Figma, — куда складываешь \u003cbutton class=\"term\" data-t=\"reference\">референсы\u003c/button>. Одно железное правило: \u003cstrong>каждый скриншот подписан — что именно здесь хорошо\u003c/strong>. «Экран оплаты Duolingo: цену показывают ПОСЛЕ бесплатной недели, сначала дают привыкнуть» — рабочий референс. Скриншот без подписи через неделю — мусор, ты не вспомнишь, зачем сохранял.\u003c/p>\n\u003cp>Когда придёт время делать свой экран оплаты, ты не будешь просить ИИ «сделай красиво» — ты дашь ему три референса с подписями и скажешь, что взять из каждого. Разница в результате — как между «построй мне дом» и «вот три дома, отсюда планировку, отсюда крышу».\u003c/p>\n\u003ch2>Разбор на Recall\u003c/h2>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Редизайн по готовому референсу — Nocturne.\u003c/strong> Тёмная тема Recall не выдумывалась с нуля: владелец принёс готовый макет (папка \u003ccode>handoff/\u003c/code> с прототипом и ТЗ), и весь интерфейс перекрашивался по нему — токены цветов, шрифт Onest, анимации. Результат получился цельным именно потому, что был конкретный образец, а не просьба «сделай красиво». Это насмотренность в действии: сначала нашли, КАК должно выглядеть, потом строили.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Заимствование паттернов, которые все знают.\u003c/strong> Колода в Recall сначала была «как в Anki» — четыре кнопки оценки (снова/трудно/хорошо/легко). Новичков это путало. Переделали на свайп-карточку: вправо — помню, влево — ещё раз. Это паттерн, знакомый каждому по Tinder и Duolingo — объяснять стало нечего, обучающий экран сократился до одной картинки. Хороший \u003cbutton class=\"term\" data-t=\"pattern\">паттерн\u003c/button> — это чужая насмотренность, упакованная в жест.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-good\">\u003cp>✅ \u003cstrong>Идея фичи — прямо у конкурента.\u003c/strong> AI-квесты по грамматике в Recall честно родились из разбора Talkpal: там подсмотрена сама механика «текстовая игра, где AI пропускает дальше только за правильную грамматику». Но скопирована не один в один: добавлено то, чего нет у Talkpal и что нужно нашей нише — учитель сам назначает квест, задаёт тему и порог, видит всю переписку ученицы. Формула здорового заимствования: механика чужая, адаптация под свою нишу — своя.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout c-warn\">\u003cp>⚠️ \u003cstrong>Чего не хватало: карты конкурентов ДО стройки.\u003c/strong> Recall строился от личной боли (восстановить язык себе, дать инструмент преподавателю) — это хороший источник идеи, но систематического разбора конкурентов (Duolingo, Anki, Quizlet, Talkpal, LinguaLeo) в начале не было. Цена этого: часть решений нашлась поздно и через переделки — те же четыре кнопки Anki переделывались на свайпы уже после того, как код был написан и протестирован. Час разглядывания чужих колод ДО стройки сэкономил бы день переделки. Сравнение цен с аналогами появилось только к моменту лендинга — повезло, что цифры сошлись.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout\">\u003cp>💡 \u003cstrong>Правило на будущее: час насмотренности перед каждой крупной фичей.\u003c/strong> Прежде чем строить новый экран или механику — открыть три продукта, где эта же задача уже решена, и разобрать их по слоям из этой главы. Это самый дешёвый способ «нанять» чужих дизайнеров и продактов: их решения уже проверены на миллионах пользователей.\u003c/p>\u003c/div>\n\u003ch2>Откуда берутся идеи продуктов\u003c/h2>\n\u003cp>Насмотренность отвечает не только «как сделать», но и «что делать». Рабочие источники идей, по убыванию надёжности:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Своя боль.\u003c/strong> Ты сам — первый пользователь, тебе не нужно угадывать, что нужно. Recall родился так: «мой английский просел с B2, хочу восстановить» плюс «моей девушке-преподавателю нужен инструмент для учениц». Минус: надо проверить, что боль есть ещё у кого-то, кроме тебя (об этом — следующая глава).\u003c/li>\n\u003cli>\u003cstrong>Чужая боль, подсмотренная в отзывах и чатах.\u003c/strong> Отзывы конкурентов на 2–3 звезды, профессиональные чаты, форумы: люди прямым текстом пишут, чего им не хватает и за что они бы заплатили.\u003c/li>\n\u003cli>\u003cstrong>Существующее — но для узкой ниши.\u003c/strong> Не «новый Duolingo», а «инструмент репетитора, ведущего учениц»: берёшь проверенную механику и затачиваешь под \u003cbutton class=\"term\" data-t=\"niche\">нишу\u003c/button>, до которой гигантам нет дела. Recall ровно это и делает.\u003c/li>\n\u003cli>\u003cstrong>Волна новой технологии.\u003c/strong> Появился дешёвый AI — стало возможно то, что вчера стоило миллионы (личный собеседник для практики языка). На волне легче взлететь, но и конкурентов туда прибегает толпа.\u003c/li>\n\u003c/ol>\n\u003cp>Идея — ещё не продукт. Прежде чем строить, её надо проверить на спрос — этим займёмся в следующей главе.\u003c/p>\n\u003ch2>Чек-лист для нового проекта\u003c/h2>\n\u003cul>\n\u003cli>Я разобрал минимум 3 продукта-конкурента по слоям: боль, онбординг, деньги, паттерны.\u003c/li>\n\u003cli>Я прочитал отзывы конкурентов на 2–3 звезды и выписал повторяющиеся жалобы.\u003c/li>\n\u003cli>У меня есть коллекция референсов, и каждый подписан: что именно здесь хорошо.\u003c/li>\n\u003cli>Я знаю, из какой боли растёт моя идея и чем моя ниша отличается от «рынка вообще».\u003c/li>\n\u003cli>Перед каждой крупной фичей я час смотрю, как её сделали трое других.\u003c/li>\n\u003cli>Мои референсы — из живых продуктов (не только с Dribbble).\u003c/li>\n\u003c/ul>\n\u003ch2>Вопросы себе\u003c/h2>\n\u003col>\n\u003cli>Чем разбор продукта «глазами строителя» отличается от «глазами жильца»? Назови три слоя разбора.\u003c/li>\n\u003cli>Почему скриншот без подписи — мёртвый референс?\u003c/li>\n\u003cli>Что в AI-квестах Recall заимствовано у Talkpal, а что — своё? Почему такая формула считается здоровой?\u003c/li>\n\u003cli>Какой источник идей самый надёжный и в чём его главная ловушка?\u003c/li>\n\u003cli>Зачем читать отзывы конкурентов именно на 2–3 звезды, а не на 5 и не на 1?\u003c/li>\n\u003c/ol>"},{"n":"2","id":"02","part":"I","title":"Идея и проверка спроса","html":null},{"n":"3","id":"03","part":"I","title":"Планировка: требования, сценарии, MVP","html":null},{"n":"4","id":"04","part":"II","title":"Фундамент: стек, структура, типы","html":null},{"n":"5","id":"05","part":"II","title":"Код: почему «работает» ещё не значит «хорошо»","html":null},{"n":"6","id":"06","part":"II","title":"Безопасность: двери и замки","html":null},{"n":"7","id":"07","part":"II","title":"Данные и база","html":null},{"n":"8","id":"08","part":"II","title":"Тесты и ревью","html":null},{"n":"9","id":"09","part":"II","title":"Дизайн и UX","html":null},{"n":"10","id":"10","part":"III","title":"Карта сервисов: поставщики, тарифы, выбор","html":null},{"n":"11","id":"11","part":"III","title":"Деплой и эксплуатация","html":null},{"n":"12","id":"12","part":"III","title":"Нагрузка и карта трат","html":null},{"n":"13","id":"13","part":"III","title":"Юридика, налоги, оформление","html":null},{"n":"14","id":"14","part":"IV","title":"Цена, тарифы и юнит-экономика","html":null},{"n":"15","id":"15","part":"IV","title":"Лендинг и продающие тексты","html":null},{"n":"16","id":"16","part":"IV","title":"Запуск и первые клиенты","html":null},{"n":"17","id":"17","part":"IV","title":"Продажи и CRM","html":null},{"n":"18","id":"18","part":"IV","title":"Удержание и метрики","html":null},{"n":"19","id":"19","part":"IV","title":"Поддержка и обратная связь","html":null},{"n":"20а","id":"20a","part":"V","title":"Как разговаривать с ИИ","html":null},{"n":"20б","id":"20b","part":"V","title":"Оркестр из ИИ","html":null}],"glossary":[{"id":"pattern","term":"Паттерн","def":"Готовое, много раз проверенное решение типовой задачи. В интерфейсах — узнаваемый приём: свайп карточки вправо-влево, лента с прокруткой, нижняя панель вкладок. Использовать паттерн — не «украсть», а говорить с пользователем на языке, который он уже знает."},{"id":"onboarding","term":"Онбординг","def":"Первые минуты пользователя в продукте: экраны приветствия, подсказки, первый успешный результат. Задача онбординга — довести новичка до момента «ага, вот зачем это мне» раньше, чем он заскучает и уйдёт."},{"id":"mvp","term":"MVP","def":"Minimum Viable Product — «минимальный жизнеспособный продукт». Самая маленькая версия, которой уже можно пользоваться и по которой видно, нужен ли продукт людям. Строится, чтобы проверить спрос малой кровью, а не чтобы «сделать всё, но попроще»."},{"id":"reference","term":"Референс","def":"Конкретный чужой пример, на который ты ориентируешься: скриншот экрана, лендинг, механика игры. Хороший референс всегда с подписью, ЧТО именно в нём хорошо — иначе через неделю забудешь, зачем сохранял."},{"id":"prototype","term":"Прототип","def":"Черновая, но живая версия интерфейса или фичи: по ней можно кликать и понять, как оно будет ощущаться, до того как писать настоящий код. Прототип разрешено выбросить — в этом его сила."},{"id":"mockup","term":"Макет","def":"Картинка будущего экрана: как он выглядит, где какая кнопка. В отличие от прототипа обычно некликабельный. Макет отвечает на вопрос «как это выглядит», прототип — «как это ощущается»."},{"id":"ux","term":"UX","def":"User Experience — опыт пользователя: удобно ли, понятно ли, сколько шагов до цели, где человек застревает и злится. UX — это про поведение, а не про красоту."},{"id":"ui","term":"UI","def":"User Interface — сам интерфейс: кнопки, цвета, шрифты, отступы. UI — как выглядит; UX — как работает. Красивый UI с плохим UX — красивая дверь, которая открывается не в ту сторону."},{"id":"design-system","term":"Дизайн-система","def":"Единый набор правил и деталей интерфейса: цвета, шрифты, кнопки, отступы — описанные один раз и переиспользуемые везде. Благодаря ей все экраны выглядят «одной рукой нарисованными», а новые собираются быстрее."},{"id":"niche","term":"Ниша","def":"Узкая группа людей с общей потребностью, для которой ты делаешь продукт. «Приложение для изучения языков» — рынок; «инструмент для репетитора английского, ведущего учениц в Казахстане» — ниша. Маленьким продуктам ниша — друг: легче найти своих и обойти гигантов."},{"id":"feature","term":"Фича","def":"Отдельная функция продукта: «свайп-колода», «AI-диалог», «отчёт для родителей». От английского feature — «возможность»."},{"id":"landing","term":"Лендинг","def":"Одностраничный сайт с одной задачей — убедить посетителя сделать одно действие: зарегистрироваться, оставить заявку, купить. Обычно первое, что видит будущий клиент."},{"id":"fsrs","term":"FSRS","def":"Алгоритм интервальных повторений (Free Spaced Repetition Scheduler): вычисляет, когда показать карточку со словом снова, чтобы ты повторил её прямо перед тем, как забудешь. Используется в колоде Recall."},{"id":"competitor-analysis","term":"Конкурентный анализ","def":"Систематический разбор продуктов, решающих ту же боль, что и твой: что у них есть, сколько стоит, что пользователи хвалят и на что жалуются в отзывах. Даёт готовую карту «что обязательно, что можно лучше, что никому не нужно»."},{"id":"pain","term":"Боль","def":"Проблема, которая реально мешает человеку жить или работать — настолько, что он готов тратить время или деньги на решение. Продукты, выросшие из настоящей боли, продаются легче, чем «прикольные идеи»."}]};
const CH = PAYLOAD.chapters, GLOSS = PAYLOAD.glossary, PARTS = PAYLOAD.parts;
const $ = s => document.querySelector(s);
const app = document.getElementById('app');
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('sab.'+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('sab.'+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const smooth = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
const SVG = {
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  play:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pause:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>',
  prev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17 5.5v13l-9-6.5z"/><rect x="6" y="5.5" width="2.2" height="13" rx="1"/></svg>',
  next:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5.5v13l9-6.5z"/><rect x="15.8" y="5.5" width="2.2" height="13" rx="1"/></svg>',
  x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  speak:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"/></svg>',
  book:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5z"/></svg>'
};

/* ---------- озвучка ---------- */
const TTS = ('speechSynthesis' in window) ? {
  q: [], i: 0, on: false, seq: 0,
  rate: LS.get('rate', 1),
  voice: null,
  pick(){
    const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
    this.voice = vs.find(v => /google/i.test(v.name)) || vs.find(v => /milena|katya|premium|enhanced/i.test(v.name)) || vs[0] || null;
  },
  build(){
    this.q = []; this.i = 0;
    document.querySelectorAll('article p, article li, article h1, article h2, article h3').forEach(el => {
      const txt = el.textContent.trim();
      if (!txt) return;
      const parts = txt.match(/[^.!?…]+[.!?…]+["»”)\]]*\s*|[^.!?…]+$/g) || [txt];
      parts.forEach(s => { s = s.trim(); if (s) this.q.push({ el, s }); });
    });
  },
  speak(){
    const mySeq = ++this.seq;
    speechSynthesis.cancel();
    const item = this.q[this.i];
    if (!item) { this.stop(); return; }
    this.mark(item.el);
    const u = new SpeechSynthesisUtterance(item.s);
    u.lang = 'ru-RU';
    if (this.voice) u.voice = this.voice;
    u.rate = this.rate;
    u.onend = () => {
      if (!this.on || mySeq !== this.seq) return;
      if (this.i < this.q.length - 1) { this.i++; this.speak(); }
      else this.stop();
    };
    speechSynthesis.speak(u);
  },
  mark(el){
    document.querySelectorAll('.reading').forEach(e => e.classList.remove('reading'));
    if (el) { el.classList.add('reading'); el.scrollIntoView({ block: 'center', behavior: smooth() }); }
  },
  toggle(){
    if (this.on) { this.on = false; this.seq++; speechSynthesis.cancel(); }
    else {
      if (!this.q.length) this.build();
      this.on = true; this.speak();
    }
    this.ui();
  },
  step(d){
    this.i = Math.max(0, Math.min(this.q.length - 1, this.i + d));
    if (this.on) this.speak(); else this.mark(this.q[this.i] && this.q[this.i].el);
    this.ui();
  },
  cycle(){
    const R = [0.5, 0.75, 1, 1.25, 1.5, 2];
    this.rate = R[(R.indexOf(this.rate) + 1) % R.length] || 1;
    LS.set('rate', this.rate);
    if (this.on) this.speak();
    this.ui();
  },
  stop(){
    this.on = false; this.seq++; speechSynthesis.cancel();
    this.mark(null); this.q = []; this.i = 0;
    const p = $('#player'); if (p) p.remove();
  },
  open(){
    if ($('#player')) { this.toggle(); return; }
    this.build();
    const bar = document.createElement('div');
    bar.id = 'player'; bar.className = 'player';
    bar.innerHTML = '<div class="in">' +
      '<button class="pbtn" id="pPrev" aria-label="Назад на предложение">' + SVG.prev + '</button>' +
      '<button class="pbtn main" id="pPlay" aria-label="Пауза">' + SVG.pause + '</button>' +
      '<button class="pbtn" id="pNext" aria-label="Вперёд на предложение">' + SVG.next + '</button>' +
      '<button class="pbtn rate" id="pRate" aria-label="Скорость озвучки"></button>' +
      '<span class="pspacer">Экран не выключай — озвучка прервётся</span>' +
      '<button class="pbtn" id="pStop" aria-label="Закрыть плеер">' + SVG.x + '</button></div>';
    document.body.appendChild(bar);
    $('#pPlay').onclick = () => this.toggle();
    $('#pPrev').onclick = () => this.step(-1);
    $('#pNext').onclick = () => this.step(1);
    $('#pRate').onclick = () => this.cycle();
    $('#pStop').onclick = () => this.stop();
    this.on = true; this.speak(); this.ui();
  },
  ui(){
    const b = $('#pPlay'); if (!b) return;
    b.innerHTML = this.on ? SVG.pause : SVG.play;
    b.setAttribute('aria-label', this.on ? 'Пауза' : 'Продолжить');
    $('#pRate').textContent = String(this.rate).replace('.', ',') + '×';
  }
} : null;
if (TTS) {
  TTS.pick();
  if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = () => TTS.pick();
}

/* ---------- глоссарий ---------- */
function openTerm(id){
  const g = GLOSS.find(x => x.id === id);
  if (!g) return;
  closeSheet();
  const w = document.createElement('div');
  w.className = 'sheetwrap'; w.id = 'sheet';
  w.innerHTML = '<div class="backdrop"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Глоссарий: ' + esc(g.term) + '">' +
    '<div class="gl">Глоссарий</div><h3>' + esc(g.term) + '</h3><p>' + esc(g.def) + '</p>' +
    '<button class="x" aria-label="Закрыть">' + SVG.x + '</button></div>';
  document.body.appendChild(w);
  w.querySelector('.backdrop').onclick = closeSheet;
  w.querySelector('.x').onclick = closeSheet;
}
function closeSheet(){ const s = $('#sheet'); if (s) s.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- закладка и прогресс ---------- */
let curId = null, saveT = 0;
window.addEventListener('scroll', () => {
  if (!curId) return;
  const now = Date.now();
  if (now - saveT > 400) {
    saveT = now;
    LS.set('pos', { ch: curId, y: Math.round(scrollY) });
  }
  const h = document.documentElement;
  if (h.scrollHeight - scrollY - innerHeight < h.clientHeight * 0.08) {
    const done = LS.get('done', {});
    if (!done[curId]) { done[curId] = 1; LS.set('done', done); }
  }
}, { passive: true });

/* ---------- рендер ---------- */
function bindTerms(){
  document.querySelectorAll('.term').forEach(b => b.onclick = () => openTerm(b.dataset.t));
}
function renderHome(){
  if (TTS) TTS.stop();
  curId = null;
  document.title = 'Строитель А+Б';
  const done = LS.get('done', {});
  const pos = LS.get('pos', null);
  const ready = CH.filter(c => c.html);
  const readDone = ready.filter(c => done[c.id]).length;
  let h = '<div class="wrap"><header class="cover">' +
    '<div class="kicker">Учебник · на примере Recall</div>' +
    '<h1>Строитель А+Б</h1>' +
    '<p class="sub">Как делать с помощью ИИ продукты, в которых хочется жить: от идеи до денег и постоянных клиентов.</p>' +
    '<div class="progress"><div class="bar"><i style="width:' + Math.round(100 * ready.length / CH.length) + '%"></i></div>' +
    '<div class="cap">Опубликовано глав: ' + ready.length + ' из ' + CH.length + ' · прочитано: ' + readDone + '</div></div>';
  if (pos && CH.some(c => c.id === pos.ch && c.html)) {
    const c = CH.find(x => x.id === pos.ch);
    h += '<button class="continue" id="cont"><span class="ico">' + SVG.book + '</span>' +
      '<span><b>Продолжить чтение</b><span>Глава ' + c.n + ' · ' + esc(c.title) + '</span></span></button>';
  }
  h += '</header><nav aria-label="Оглавление">';
  let lastPart = '';
  CH.forEach(c => {
    if (c.part !== lastPart) {
      lastPart = c.part;
      h += '<div class="part"><span class="rn">' + c.part + '</span><h2>' + esc(PARTS[c.part]) + '</h2></div>';
    }
    if (c.html) {
      h += '<button class="chrow" data-ch="' + c.id + '"><span class="num">' + c.n + '</span>' +
        '<span class="t">' + esc(c.title) + '</span>' +
        '<span class="st' + (done[c.id] ? ' done">✓ прочитана' : '">читать') + '</span></button>';
    } else {
      h += '<div class="chrow soon"><span class="num">' + c.n + '</span><span class="t">' + esc(c.title) + '</span><span class="st">скоро</span></div>';
    }
  });
  h += '</nav><div class="foot">Закладка, прогресс и скорость озвучки хранятся в этом браузере. Термины с пунктиром — тап открывает объяснение.</div></div>';
  app.innerHTML = h;
  const cont = $('#cont');
  if (cont) cont.onclick = () => { location.hash = '#/' + pos.ch; };
  document.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { location.hash = '#/' + b.dataset.ch; });
  scrollTo(0, 0);
}
function renderChapter(id){
  const c = CH.find(x => x.id === id && x.html);
  if (!c) { location.hash = ''; return; }
  if (TTS) TTS.stop();
  curId = id;
  document.title = 'Гл. ' + c.n + ' — ' + c.title;
  const idx = CH.indexOf(c);
  const prev = CH.slice(0, idx).reverse().find(x => x.html);
  const next = CH.slice(idx + 1).find(x => x.html);
  let h = '<div class="topbar"><div class="in">' +
    '<button class="tbtn" id="back" aria-label="К оглавлению">' + SVG.back + '</button>' +
    '<div class="title">Глава ' + c.n + ' · ' + esc(PARTS[c.part]) + '</div>' +
    (TTS ? '<button class="tbtn" id="listen">' + SVG.speak + ' Слушать</button>' : '') +
    '</div></div><div class="wrap"><article>' +
    '<div class="chnum">Глава ' + c.n + '</div>' + c.html;
  h += '<div class="chnav">';
  h += prev
    ? '<button data-ch="' + prev.id + '"><span class="lbl">← Назад</span><span class="nm">' + esc(prev.title) + '</span></button>'
    : '<button data-home="1"><span class="lbl">←</span><span class="nm">Оглавление</span></button>';
  if (next) h += '<button class="nx" data-ch="' + next.id + '"><span class="lbl">Дальше →</span><span class="nm">' + esc(next.title) + '</span></button>';
  h += '</div></article></div>';
  app.innerHTML = h;
  $('#back').onclick = () => { location.hash = ''; };
  const li = $('#listen'); if (li) li.onclick = () => TTS.open();
  document.querySelectorAll('.chnav [data-ch]').forEach(b => b.onclick = () => { location.hash = '#/' + b.dataset.ch; });
  const hm = document.querySelector('.chnav [data-home]'); if (hm) hm.onclick = () => { location.hash = ''; };
  bindTerms();
  const pos = LS.get('pos', null);
  requestAnimationFrame(() => scrollTo(0, (pos && pos.ch === id) ? pos.y : 0));
}
function route(){
  closeSheet();
  const m = location.hash.match(/^#\/(.+)$/);
  if (m) renderChapter(m[1]); else renderHome();
}
window.addEventListener('hashchange', route);
route();
</script>
